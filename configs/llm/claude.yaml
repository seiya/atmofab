# Shipped leaf-LLM configuration: every LLM leaf on the Claude Code CLI.
#
# This is the file `run_workflow.py` loads when nobody passes `--llm-config`, and the one the
# deprecated `--llm claude` maps onto. `tools/tests/test_llm_config.py` asserts it loads and
# `tools/tests/test_workflow_conductor.py` asserts the leaf argv it produces, so it cannot
# drift silently the way an untested YAML file in this repository has before.
#
# EVERY phase, substep, provider, model and effort is written out, even though the resolution
# rules would let all five leaves inherit one `defaults` block. The file is the answer to
# "what runs where, and how hard does it think" — a reader should get that answer by reading it,
# not by re-deriving it from an inheritance chain. Omission still works and is the right choice
# for a file an operator writes themselves; it is the wrong choice for the shipped default.
#
# The five entries below are the complete set of LLM leaves. Every other substep
# (compile.static, generate.gate, validate.pre_judge / execute / post_judge, and the whole
# build phase) is deterministic and runs in-process, so naming one here is rejected.
#
#   model    An unpinned ALIAS, never a pinned version: versions move, and the exact version
#            that ran is recovered afterwards from the leaf's own transcript and recorded on its
#            `agent_runs` row. Because this file DECLARES it, it is passed as
#            `claude --model opus` — which overrides the `model` in the operator's own
#            `~/.claude/settings.json`. Delete the `model:` lines to hand that choice back.
#   effort   `low` | `medium` | `high` | `xhigh` | `max`, passed as `claude --effort`. All five
#            leaves are judgement-bearing — an IR author, two verifiers, a bundle producer and a
#            semantic judge — and this repository's standing rule is that nothing may trade
#            accuracy for speed, so the shipped default asks for `high` everywhere rather than
#            economising on the ones that look cheap. Lower it per substep to buy speed
#            knowingly; delete the line to leave the CLI's own default in force.
#
# To move one leaf elsewhere, replace its block. HTTP providers (`openai_compatible`,
# `anthropic_api`) are admissible ONLY on the two `generate` leaves, which run as host-mediated
# pure functions; assigning one to an agentic leaf is rejected at load with
# `llm_config_capability_insufficient_for_substep`. For example:
#
#     generate:
#       substeps:
#         generate:
#           provider: openai_compatible
#           # MUST carry the API version segment: the request appends /chat/completions.
#           # (`anthropic_api` is the opposite -- it appends /v1/messages, so give it a bare
#           # host, or omit base_url entirely and take its default.)
#           base_url: http://localhost:8000/v1
#           # The NAME of the environment variable holding the key, never the key.
#           api_key_env: LOCAL_LLM_API_KEY
#           model: qwen2.5-coder-32b-instruct
#           effort: high          # `minimal` | `low` | `medium` | `high` on this provider
#           # Size against the model's CONTEXT WINDOW, not its documented maximum: the request
#           # is non-streaming. The default (32768) is sized for a CodegenBundle.
#           max_output_tokens: 16384
defaults:
  provider: claude_cli
  model: opus
  effort: high

phases:
  compile:
    substeps:
      # Authors spec.ir.yaml from the controlled spec: the hardest structured task in the run.
      generate:
        provider: claude_cli
        model: opus
        effort: high
      # Semantic cross-reference (V1/V3/V5) over a deterministically-clean IR.
      verify:
        provider: claude_cli
        model: opus
        effort: high

  generate:
    substeps:
      # The CodegenBundle producer — the dominant leaf of the run, by tokens and by difficulty.
      generate:
        provider: claude_cli
        model: opus
        effort: high
      # The verdict reviewer, reached only on a source the deterministic gate already accepted.
      verify:
        provider: claude_cli
        model: opus
        effort: high

  validate:
    substeps:
      # The independent semantic check; the contract calls it essential, so it is not economised.
      judge:
        provider: claude_cli
        model: opus
        effort: high
