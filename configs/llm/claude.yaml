# Shipped leaf-LLM configuration: every LLM leaf on the Claude Code CLI.
#
# This is the file `run_workflow.py` loads when nobody passes `--llm-config`, and the one the
# deprecated `--llm claude` maps onto. `tools/tests/test_llm_config.py` asserts it loads and
# `tools/tests/test_workflow_conductor.py` asserts the leaf argv it produces, so it cannot
# drift silently the way an untested YAML file in this repository has before.
#
# EVERY phase, substep, provider, model and effort is written out, even though the resolution
# rules would let all five leaves inherit one `defaults` block. The file is the answer to
# "what runs where, and how hard does it think" — a reader should get that answer by reading it,
# not by re-deriving it from an inheritance chain. Omission still works and is the right choice
# for a file an operator writes themselves; it is the wrong choice for the shipped default.
#
# The five entries below are the complete set of LLM leaves. Every other substep
# (compile.static, generate.gate, validate.pre_judge / execute / post_judge, and the whole
# build phase) is deterministic and runs in-process, so naming one here is rejected.
#
#   model    An unpinned ALIAS, never a pinned version: versions move, and the exact version
#            that ran is recovered afterwards from the leaf's own transcript and recorded on its
#            `agent_runs` row. Because this file DECLARES it, it is passed as
#            `claude --model opus` — which overrides the `model` in the operator's own
#            `~/.claude/settings.json`. Delete the `model:` lines to hand that choice back.
#   effort   `low` | `medium` | `high` | `xhigh` | `max`, passed as `claude --effort`.
#
# WHY THESE VALUES. Measured over the 94 recorded orchestrations that still have transcripts
# (`skills/workflow-timing-audit/`), by share of output tokens and by how often the leaf had to
# be re-run:
#
#     leaf                 tokens   re-run   attempts seen
#     generate.generate     45.3%    30.2%   1..7   (only 39 of 87 nodes passed first try)
#     compile.generate      26.7%    14.8%   1..3
#     generate.verify       11.3%    21.8%   1..5
#     compile.verify         8.3%     3.3%   1..2   (90 of 93 nodes passed first try)
#     validate.judge         8.2%     0.0%   1      (69 of 69)
#
# Re-runs are 20% of every token this pipeline has ever spent, and they are concentrated in the
# leaves that WRITE things. That inverts the usual intuition: on `generate.generate` a cheaper
# setting is not a discount, it is a bet against a leaf that already reaches 7 attempts against
# a `MAX_ATTEMPTS_PER_PHASE` of 3 — and going over does not cost one more attempt, it fails the
# phase and re-runs the node. So the four leaves that write, or whose mistakes force a rewrite,
# stay at the top setting; economising them raises the expected bill rather than lowering it.
#
# `compile.verify` is the one place the numbers support spending less. It is the smallest leaf,
# it re-ran in 3 of 93 nodes, it reads an IR that the deterministic `compile.static` gate has
# already proved clean, and anything it lets through is looked at again by `generate` and by
# `validate.judge`. `validate.judge` is NOT economised despite also being small and never
# re-run: nothing runs after it, so what it misses ships.
#
# Raising `generate.generate` to `xhigh` is the other move worth considering, and is left off
# deliberately: it costs ~40% more on every attempt, so it only pays if it lifts the first-try
# rate from 45% to about 65%, which nothing here measures. Run the A/B before adopting it.
#
# To move one leaf elsewhere, replace its block. HTTP providers (`openai_compatible`,
# `anthropic_api`) are admissible ONLY on the two `generate` leaves, which run as host-mediated
# pure functions; assigning one to an agentic leaf is rejected at load with
# `llm_config_capability_insufficient_for_substep`. For example:
#
#     generate:
#       substeps:
#         generate:
#           provider: openai_compatible
#           # MUST carry the API version segment: the request appends /chat/completions.
#           # (`anthropic_api` is the opposite -- it appends /v1/messages, so give it a bare
#           # host, or omit base_url entirely and take its default.)
#           base_url: http://localhost:8000/v1
#           # The NAME of the environment variable holding the key, never the key.
#           api_key_env: LOCAL_LLM_API_KEY
#           model: qwen2.5-coder-32b-instruct
#           effort: high          # `minimal` | `low` | `medium` | `high` on this provider
#           # Size against the model's CONTEXT WINDOW, not its documented maximum: the request
#           # is non-streaming. The default (32768) is sized for a CodegenBundle.
#           max_output_tokens: 16384
defaults:
  provider: claude_cli
  model: opus
  effort: high

phases:
  compile:
    substeps:
      # Authors spec.ir.yaml from the controlled spec: the hardest structured task in the run,
      # 26.7% of all tokens, and every later leaf reads what it wrote.
      generate:
        provider: claude_cli
        model: opus
        effort: high
      # Semantic cross-reference (V1/V3/V5) over a deterministically-clean IR. The cheapest
      # leaf to be wrong in: 3 of 93 nodes re-ran it, and both `generate` and `validate.judge`
      # read the same IR afterwards. The only leaf this file economises.
      verify:
        provider: claude_cli
        model: sonnet
        effort: medium

  generate:
    substeps:
      # The CodegenBundle producer — 45.3% of all tokens and the only leaf that routinely
      # re-runs (30.2% of its spend is re-runs, tail to 7 attempts). The last leaf to economise.
      generate:
        provider: claude_cli
        model: opus
        effort: high
      # The verdict reviewer, reached only on a source the deterministic gate already accepted —
      # but it re-ran in 12 of 80 nodes, and a wrong rejection re-runs the 45% leaf above.
      verify:
        provider: claude_cli
        model: opus
        effort: high

  validate:
    substeps:
      # The independent semantic check. Never re-run in 69 of 69 nodes, so its cost is perfectly
      # predictable — and still not economised, because nothing runs after it to catch a miss.
      judge:
        provider: claude_cli
        model: opus
        effort: high
