      qsum: initial.qv + initial.qc
    expr: maxabs(interior * (final.qv - qsum)) / maxabs(interior * qsum)
    op: le
    value: 1.0e-12
  - test_id: l0_satadj_subsaturated_evaporates_all_pass
    quantity: satadj_evaporates_all
    target_cases:
    - l0_satadj_subsat
    - l0_satadj_alt_subsat
    per_case: true
    bind:
      interior: min(1, max(0, floor(xc) - (inputs.grid.ks - 2))) * min(1, max(0, inputs.grid.ke - floor(xc)))
      cvv: inputs.constants.cpvap - inputs.constants.rvap
      L00: inputs.constants.lhv0 - (inputs.constants.cpvap - inputs.constants.cl) * inputs.constants.tem00
      qsum: initial.qv + initial.qc
      cvnew: initial.cvtot + initial.qc * (cvv - inputs.constants.cl)
      tstar: (initial.temp * initial.cvtot + initial.qv * L00 - L00 * qsum) / cvnew
