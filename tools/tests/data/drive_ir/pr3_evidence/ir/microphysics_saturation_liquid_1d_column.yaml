algorithm:
  algorithm_id: microphysics_saturation_liquid_1d_column
  execution_mode: conditional
  steps:
  - step_id: step_01_dens2qsat_guard
    step_kind: diagnostic
    operation_ref: dens2qsat_input_guard
    inputs:
    - ka
    - ks
    - ke
    - temp
    - dens
    outputs:
    - guard_pass
    description: 'First step of microphysics_saturation_liquid_1d_column__dens2qsat_liq, run on the cases of its drive.step
      entry; ka, ks, ke are inputs.grid.ka/ks/ke. guard_pass = false when ks < 1, or ke > ka, or ks > ke (checked first, before
      any array access), or temp(k) <= 0 or dens(k) <= 0 at some interior cell k = ks..ke; otherwise true. On guard_pass =
      false the operation returns immediately: qsat is not defined, and nothing is terminated or silently completed.'
  - step_id: step_02_dens2qsat_eval
    step_kind: pointwise_process
    operation_ref: dens2qsat_liq_eval
    inputs:
    - ka
    - ks
    - ke
    - temp
    - dens
    - rvap
    - cpvap
    - cl
    - lhv0
    - psat0
    - tem00
    - L00
    - qs_func
    outputs:
    - qsat
    description: 'For k = ks..ke: qsat(k) = qs_func(temp(k), dens(k)) with the case''s constants (inputs.constants: rvap,
      cpvap, cl, lhv0, psat0, tem00 passed as arguments, no default, never read from module state). For every halo cell (k
      < ks or k > ke): qsat(k) = 0. Pointwise: each cell depends only on its own inputs.'
  - step_id: step_03_satadj_guard
    step_kind: diagnostic
    operation_ref: satadj_input_guard
    inputs:
    - ka
    - ks
    - ke
    - dens
    - temp
    - cptot
    - cvtot
    outputs:
    - guard_pass
    description: First step of microphysics_saturation_liquid_1d_column__saturation_adjustment, run on the cases of its drive.step
      entry. guard_pass = false when ks < 1, or ke > ka, or ks > ke (checked before any array access), or at some interior
      cell k = ks..ke dens(k) <= 0, temp(k) <= 0, cptot(k) <= 0 or cvtot(k) <= 0; otherwise true. No check on the sign of
      qv or qc (values of order -1e-19 are legal and the definition stays finite on them). On guard_pass = false the operation
      returns immediately with temp, qv, qc, cptot, cvtot unchanged at EVERY cell; rhoe_d and converged are not defined.
  - step_id: step_04_satadj_virtual_evaporation
    step_kind: pointwise_process
    operation_ref: satadj_virtual_evaporation
    inputs:
    - ks
    - ke
    - dens
    - temp
    - qv
    - qc
    - cptot
    - cvtot
    - rvap
    - cpvap
    - cl
    - lhv0
    - psat0
    - tem00
    - cvv
    - L00
    - qs_func
    outputs:
    - T0
    - qv0
    - qc0
    - cp0
    - cv0
    - qsum
    - E0
    - T_virt
    - cp_virt
    - cv_virt
    - virtual_branch
    - cell_converged
    description: 'Per interior cell k = ks..ke (pointwise): T0 = temp(k), qv0 = qv(k), qc0 = qc(k), cp0 = cptot(k), cv0 =
      cvtot(k), rho = dens(k), qsum = qv0 + qc0, E0 = T0*cv0 + qv0*L00. Virtual evaporation: cp_virt = cp0 + qc0*(cpvap -
      cl); cv_virt = cv0 + qc0*(cvv - cl); T_virt = (E0 - L00*qsum)/cv_virt. virtual_branch = (qsum <= qs_func(T_virt, rho)).
      If virtual_branch: the cell''s result is qv = qsum, qc = 0, temp = T_virt, cptot = cp_virt, cvtot = cv_virt (temp is
      rewritten by this formula even when qc0 = 0), cell_converged = true, and the cell continues at step 07 (energy); the
      Newton steps 05/06 are skipped for it. Otherwise the cell goes to step 05.'
  - step_id: step_05_satadj_newton
    step_kind: iterative_solve
    operation_ref: satadj_newton_iteration
    inputs:
    - dens
    - T0
    - qv0
    - cv0
    - qsum
    - E0
    - cvv
    - L00
    - qs_func
    - dqs_func
    - virtual_branch
    outputs:
    - T_it
    - qs_it
    - qc_it
    - cv_it
    - newton_converged
    - cell_converged
    description: 'Only for interior cells with virtual_branch false. Restart from T_it = T0 and cv_it = cv0 (NOT from the
      virtual state). Repeat at most 100 times, each iteration in exactly this order: (a) qs_it = qs_func(T_it, rho), dqs_it
      = dqs_func(T_it, rho); (b) ET = T_it*(cvv - cl)*dqs_it + cv_it + L00*dqs_it, with cv_it still the value from the PREVIOUS
      iteration (cv0 on the first); (c) qc_it = qsum - qs_it; (d) cv_it = cv0 + (cvv - cl)*(qs_it - qv0); (e) E = T_it*cv_it
      + qs_it*L00; (f) delta = (E - E0)/ET; T_it = T_it - delta; (g) if |delta| < 1.0e-6: newton_converged = true, stop; else
      if T_it is not finite (NaN or Inf): newton_converged = false, stop. A cell that completes the 100th iteration without
      |delta| < 1.0e-6 (with finite T_it) is newton_converged = false. cell_converged = newton_converged. The iteration limit
      100 and the threshold 1.0e-6 are fixed; no other iteration, relaxation, damping, bracketing, clipping or fallback scheme
      is allowed, and the program is never terminated on non-convergence. Non-convergence is reachable and chaotic in the
      input (e.g. temp=277.8, dens=1, qc=0, qv=0.66357706133254214 ends with a non-finite T_it). The convergence test and
      the iteration count are non-differentiable operations (AD).'
  - step_id: step_06_satadj_newton_result
    step_kind: pointwise_process
    operation_ref: satadj_newton_result
    inputs:
    - T_it
    - qs_it
    - qc_it
    - cv_it
    - cp0
    - qv0
    - cpvap
    - cl
    - newton_converged
    outputs:
    - temp
    - qv
    - qc
    - cptot
    - cvtot
    description: 'For an interior Newton-branch cell with newton_converged true: cptot = cp0 + (cpvap - cl)*(qs_it - qv0),
      qv = qs_it, qc = qc_it, cvtot = cv_it, temp = T_it. temp is the LAST update (after the final delta), while qv, qc, cvtot,
      cptot belong to the iterate BEFORE it (qs evaluated at the temperature the last iteration started from). Evaluating
      qs at the final temperature instead is forbidden. qc is NOT clipped: it is whatever this gives, of either sign (a non-physical
      root with qc < 0 and temp near 5425 K is a legitimate result).'
  - step_id: step_07_satadj_energy
    step_kind: pointwise_process
    operation_ref: satadj_energy_release
    inputs:
    - qv
    - qv0
    - dens
    - L00
    - cell_converged
    outputs:
    - rhoe_d
    description: 'For every interior converged cell (either branch): rhoe_d(k) = -L00*(qv(k) - qv0)*dens(k), with qv the cell''s
      result of step 04 or 06.'
  - step_id: step_08_satadj_refusal_halo_flag
    step_kind: reduction
    operation_ref: satadj_refusal_and_converged_flag
    inputs:
    - ks
    - ke
    - cell_converged
    - T0
    - qv0
    - qc0
    - cp0
    - cv0
    outputs:
    - temp
    - qv
    - qc
    - cptot
    - cvtot
    - rhoe_d
    - converged
    description: 'For an interior cell with cell_converged false (non-converged Newton): the refusal state replaces steps
      06/07 at that cell: temp = T0, qv = qv0, qc = qc0, cptot = cp0, cvtot = cv0, rhoe_d = 0; guard_pass stays true; every
      other cell follows steps 04-07, so the returned state is finite on every path (publishing a non-finite value is forbidden).
      Halo cells (k < ks or k > ke): temp, qv, qc, cptot, cvtot keep their input values (never read or written) and rhoe_d
      = 0. converged = true iff every interior cell has cell_converged true (independent of evaluation order).'
  ordering:
  - step_01_dens2qsat_guard
  - step_02_dens2qsat_eval
  - step_03_satadj_guard
  - step_04_satadj_virtual_evaporation
  - step_05_satadj_newton
  - step_06_satadj_newton_result
  - step_07_satadj_energy
  - step_08_satadj_refusal_halo_flag
  control_condition:
  - 'Dispatch per case by the drive.step entry whose cases list it: dens2qsat_liq runs step_01 then step_02 (if guard_pass);
    saturation_adjustment runs step_03 then, if guard_pass, steps 04-08.'
  - 'Inside saturation_adjustment, per interior cell: if qsum <= qs_func(T_virt, rho) the virtual-evaporation result is final
    (step 04 then 07); otherwise the Newton branch (steps 05, 06, 07) runs; a Newton cell that does not converge takes the
    refusal state of step 08.'
  - Either operation returns at once when its input guard (step 01 / step 03) is false, leaving every in-place array unchanged.
  iteration_contract:
    applies: false
    rationale: Each published operation is a single evaluation of one column with no time stepping. The only loop is the per-cell
      Newton solve, an internal iterative_solve whose limit (100 iterations), tolerance (|delta| < 1.0e-6) and non-finite
      stop are stated in step_05_satadj_newton.
  update_semantics:
    target_variables:
    - qsat
    - temp
    - qv
    - qc
    - cptot
    - cvtot
    - rhoe_d
    - guard_pass
    - converged
    update_order: sequential
    description: 'dens2qsat_liq writes qsat (out). saturation_adjustment updates temp, qv, qc, cptot, cvtot in place (inout)
      and writes rhoe_d (out); both write guard_pass, saturation_adjustment also converged. dens is intent in for both. Halo
      cells: in-place arrays keep their input; out arrays are 0 (on an accepted call).'
  temporaries:
  - name: T0
    shape_expr: '[ka]'
  - name: qv0
    shape_expr: '[ka]'
  - name: qc0
    shape_expr: '[ka]'
  - name: cp0
    shape_expr: '[ka]'
  - name: cv0
    shape_expr: '[ka]'
  - name: qsum
    shape_expr: '[ka]'
  - name: E0
    shape_expr: '[ka]'
  - name: T_virt
    shape_expr: scalar
  - name: cp_virt
    shape_expr: scalar
  - name: cv_virt
    shape_expr: scalar
  - name: virtual_branch
    shape_expr: '[ka]'
  - name: T_it
    shape_expr: scalar
  - name: qs_it
    shape_expr: scalar
  - name: qc_it
    shape_expr: scalar
  - name: cv_it
    shape_expr: scalar
  - name: newton_converged
    shape_expr: scalar
  - name: cell_converged
    shape_expr: '[ka]'
  derived_field_rules:
  - name: cvv
    expression: cvv = cpvap - rvap
    description: Specific heat of water vapour at constant volume, from the constant arguments.
  - name: L00
    expression: L00 = lhv0 - (cpvap - cl)*tem00
    description: Latent-heat offset at 0 K, from the constant arguments.
  - name: L_of_T
    expression: L(T) = lhv0 + (cpvap - cl)*(T - tem00)
    description: Latent heat of vaporization at temperature T.
  - name: qs_func
    expression: qs_func(T, rho) = psat0/(rho*rvap*T) * exp( log(T/tem00)*(cpvap - cl)/rvap + (L00/rvap)*(1/tem00 - 1/T) )
    description: Saturation mixing ratio over liquid water at temperature T and density rho (source scale_atmos_saturation
      dens2qsat_liq, EXACT thermodynamics, double precision). At T = tem00 it is exactly psat0/(rho*rvap*tem00).
  - name: dqs_func
    expression: dqs_func(T, rho) = qs_func(T, rho)/T * ( L(T)/(rvap*T) - 1 )
    description: Temperature derivative of qs_func at fixed density (source dqs_dtem_dens_liq).
  invariants:
  - 'Both operations are pointwise in k: a cell''s result depends on that cell''s inputs alone; cells k < ks or k > ke are
    never read.'
  - Every constant (rvap, cpvap, cl, lhv0, psat0, tem00) is an argument with no default value and is never read from module
    state; there is no setup step.
  - saturation_adjustment conserves qv + qc exactly (to rounding) on both branches at every converged cell.
  - The virtual-evaporation branch conserves T*cvtot + qv*L00; on the Newton branch the drift (T*Cv + qv*L00) - E0 = delta*(ET
    - Cv) = delta*(dqs*(L00 + T_it*(cvv - cl)) + Cv_prev - Cv), bounded by |delta| < 1.0e-6.
  - No clipping of qc to non-negative; no automatic switch to another scheme; no change of the 100-iteration limit or of the
    1.0e-6 threshold.
  - 'On an accepted call every published array is defined at every cell: in-place arrays keep their input at halo cells, out
    arrays (qsat, rhoe_d) are 0 at halo cells.'
  - A non-converged cell keeps its input temp, qv, qc, cptot, cvtot and gets rhoe_d = 0; guard_pass stays true, converged
    is false; no value published is non-finite and the program never terminates on it.
  - On invalid input guard_pass is false, every in-place array holds its input value at every cell, and qsat / rhoe_d / converged
    are not defined.
  - 'AD readiness: the step-04 branch, the step-05 convergence test and iteration count, and the input-guard refusal are explicit
    non-differentiable operations.'
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
  inputs:
  - name: ka
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: Column extent, inputs.grid.ka; fixes every array's extent and the halo/interior split.
  - name: ks
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: First interior cell passed to the operation, inputs.grid.ks; checked by the guard (ks >= 1, ks <= ke).
  - name: ke
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: Last interior cell passed to the operation, inputs.grid.ke; checked by the guard (ke <= ka).
  - name: rvap
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.rvap, gas constant of vapour (J/kg/K).
  - name: cpvap
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.cpvap (J/kg/K).
  - name: cl
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.cl (J/kg/K).
  - name: lhv0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.lhv0 (J/kg).
  - name: psat0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.psat0 (Pa).
