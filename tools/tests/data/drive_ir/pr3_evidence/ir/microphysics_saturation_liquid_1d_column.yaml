  predicates:
  - test_id: l0_qsat_reference_point_pass
    quantity: guard_pass
    target_cases:
    - l0_qsat_ref
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_qsat_reference_point_pass
    quantity: qsat_reference
    target_cases:
    - l0_qsat_ref
    per_case: true
    bind:
      interior: min(1, max(0, floor(xc) - (inputs.grid.ks - 2))) * min(1, max(0, inputs.grid.ke - floor(xc)))
      ref: inputs.constants.psat0 / (final.dens * inputs.constants.rvap * inputs.constants.tem00)
    expr: maxabs(interior * (final.qsat - ref)) / maxabs(interior * ref)
    op: le
    value: 1.0e-12
  - test_id: l0_qsat_reference_point_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_qsat_ref
    per_case: true
    expr: maxabs(final.qsat - comparand.final.qsat) / max(maxabs(final.qsat), maxabs(comparand.final.qsat), 1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_qsat_clausius_clapeyron_pass
    quantity: guard_pass
    target_cases:
    - l0_qsat_ref
    - l0_qsat_temp_ramp
    - l0_qsat_dens_ramp
    - l0_qsat_alt
    - l0_qsat_range
    - l0_qsat_one_cell
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_qsat_clausius_clapeyron_pass
    quantity: qsat_formula
    target_cases:
    - l0_qsat_ref
    - l0_qsat_temp_ramp
    - l0_qsat_dens_ramp
    - l0_qsat_alt
    - l0_qsat_range
    - l0_qsat_one_cell
    per_case: true
    bind:
      interior: min(1, max(0, floor(xc) - (inputs.grid.ks - 2))) * min(1, max(0, inputs.grid.ke - floor(xc)))
      L00: inputs.constants.lhv0 - (inputs.constants.cpvap - inputs.constants.cl) * inputs.constants.tem00
      qs: inputs.constants.psat0 * exp(log(initial.temp / inputs.constants.tem00) * (inputs.constants.cpvap - inputs.constants.cl)
        / inputs.constants.rvap + L00 / inputs.constants.rvap * (1 / inputs.constants.tem00 - 1 / initial.temp)) / (initial.dens
        * inputs.constants.rvap * initial.temp)
    expr: maxabs(interior * (final.qsat - qs)) / maxabs(interior * qs)
    op: le
    value: 1.0e-12
  - test_id: l0_qsat_clausius_clapeyron_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_qsat_ref
    - l0_qsat_temp_ramp
    - l0_qsat_dens_ramp
    - l0_qsat_alt
    - l0_qsat_range
    - l0_qsat_one_cell
    per_case: true
    expr: maxabs(final.qsat - comparand.final.qsat) / max(maxabs(final.qsat), maxabs(comparand.final.qsat), 1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_qsat_monotone_pass
    quantity: guard_pass
    target_cases:
    - l0_qsat_temp_ramp
    - l0_qsat_dens_ramp
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_qsat_monotone_pass
    quantity: qsat_monotone
    target_cases:
    - l0_qsat_temp_ramp
    - l0_qsat_dens_ramp
    case: l0_qsat_temp_ramp
    bind:
      pairs: min(1, max(0, floor(xc) - (inputs.grid.ks - 2))) * min(1, max(0, inputs.grid.ke - 1 - floor(xc)))
      d: roll(final.qsat, -1) - final.qsat
    expr: min(pairs * d + (1 - pairs))
    op: gt
    value: 0
  - test_id: l0_qsat_monotone_pass
    quantity: qsat_monotone
    target_cases:
    - l0_qsat_temp_ramp
    - l0_qsat_dens_ramp
    case: l0_qsat_dens_ramp
    bind:
      pairs: min(1, max(0, floor(xc) - (inputs.grid.ks - 2))) * min(1, max(0, inputs.grid.ke - 1 - floor(xc)))
      d: roll(final.qsat, -1) - final.qsat
    expr: max(pairs * d - (1 - pairs))
    op: lt
    value: 0
  - test_id: l0_qsat_monotone_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_qsat_temp_ramp
    - l0_qsat_dens_ramp
    per_case: true
    expr: maxabs(final.qsat - comparand.final.qsat) / max(maxabs(final.qsat), maxabs(comparand.final.qsat), 1.0)
