      u_yp: ax * ub_yp - (ax * pr_yp + (1 - ax) * ps_yp)
      v_yp: (1 - ax) * ub_yp + ax * ps_yp + (1 - ax) * pr_yp
      x_ym: xcell
      y_ym: ycell - d
      s_ym: ax * x_ym + (1 - ax) * y_ym
      r_ym: ax * y_ym + (1 - ax) * x_ym
      xi_ym: pi * (s_ym - inputs.low.s_c0 - inputs.low.c_tr * (inputs.time.t)) / inputs.constants.L_along
      psi_ym: inputs.low.psi0 * exp(-((inputs.constants.L_along / pi) ** 2 * sin(xi_ym)
        ** 2 + (r_ym - inputs.low.r_c) ** 2) / inputs.low.R_low ** 2)
      ps_ym: -(inputs.constants.L_along / (pi * inputs.low.R_low ** 2)) * sin(2 *
        xi_ym) * psi_ym
      pr_ym: -2 * (r_ym - inputs.low.r_c) / inputs.low.R_low ** 2 * psi_ym
      f_ym: inputs.background.rotation_sign * (f0 + beta * (r_ym - inputs.background.L_r
        / 2))
      ub_ym: inputs.background.jet_sign * inputs.background.u0 * sin(k_y * r_ym) **
        2
      hb_ym: inputs.background.gh0 / inputs.constants.g - (inputs.background.u0 /
        inputs.constants.g) * (f0 * (r_ym / 2 - sin(2 * k_y * r_ym) / (4 * k_y)) +
        beta * (r_ym ** 2 / 4 - inputs.background.L_r * r_ym / 4 - (r_ym - inputs.background.L_r
        / 2) * sin(2 * k_y * r_ym) / (4 * k_y) - (cos(2 * k_y * r_ym) - 1) / (8 *
        k_y ** 2)))
      h_ym: hb_ym + f_ym * psi_ym / inputs.constants.g
      u_ym: ax * ub_ym - (ax * pr_ym + (1 - ax) * ps_ym)
      v_ym: (1 - ax) * ub_ym + ax * ps_ym + (1 - ax) * pr_ym
      F_h: (h_tp - h_tm) / (2 * dt) + (h_xp * u_xp - h_xm * u_xm) / (2 * d) + (h_yp
        * v_yp - h_ym * v_ym) / (2 * d)
      F_hu: (h_tp * u_tp - h_tm * u_tm) / (2 * dt) + (h_xp * u_xp ** 2 + inputs.constants.g
        * h_xp ** 2 / 2 - h_xm * u_xm ** 2 - inputs.constants.g * h_xm ** 2 / 2) /
        (2 * d) + (h_yp * u_yp * v_yp - h_ym * u_ym * v_ym) / (2 * d) - f_c * h_c
        * v_c
      F_hv: (h_tp * v_tp - h_tm * v_tm) / (2 * dt) + (h_xp * u_xp * v_xp - h_xm *
        u_xm * v_xm) / (2 * d) + (h_yp * v_yp ** 2 + inputs.constants.g * h_yp **
        2 / 2 - h_ym * v_ym ** 2 - inputs.constants.g * h_ym ** 2 / 2) / (2 * d) +
        f_c * h_c * u_c
      S_fd: (comp - 1.5) * (comp - 2.5) / 2 * F_h + (comp - 0.5) * (2.5 - comp) *
        F_hu + (comp - 0.5) * (comp - 1.5) / 2 * F_hv
    expr: maxabs(final.S - S_fd)
    op: le
    value: 1.0e-06
