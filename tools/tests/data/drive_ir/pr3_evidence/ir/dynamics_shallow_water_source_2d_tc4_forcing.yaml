algorithm:
  algorithm_id: tc4_manufactured_forcing_apply
  execution_mode: conditional
  steps:
  - step_id: step_01_input_guard
    step_kind: pointwise_process
    operation_ref: tc4_forcing_input_guard
    inputs:
    - ncomp
    - nx
    - ny
    - along_axis
    - R_low
    - L_along
    outputs:
    - guard_pass
    - S
    description: Evaluated first, before any input array is read. The input is rejected
      when ncomp /= 3, nx < 1, ny < 1, along_axis is neither 1 nor 2 (0 and 3 are
      both rejected; no value is mapped onto 1 or 2), R_low <= 0 (zero AND negative
      are rejected), or L_along <= 0 (zero AND negative are rejected). On a rejected
      input guard_pass = false, every element of S (all ncomp x nx x ny elements,
      whatever ncomp is) is set to exactly 0.0, no element of x, y, f, dfdr, ubar,
      dubar, hbar is read, and the operation returns without evaluating steps 02-05.
      Otherwise guard_pass = true and steps 02-05 run. h <= 0 is not checked (the
      state does not enter the forcing).
  - step_id: step_02_low_streamfunction
    step_kind: pointwise_process
    operation_ref: tc4_low_streamfunction_derivatives
    inputs:
    - nx
    - ny
    - along_axis
    - x
    - y
    - t
    - L_along
    - psi0
    - R_low
    - c_tr
    - s_c0
    - r_c
    outputs:
    - s_coord
    - r_coord
    - s_c
    - xi
    - rho2
    - k_psi
    - psi
    - psi_s
    - psi_r
    - psi_ss
    - psi_sr
    - psi_rr
    - psi_x
    - psi_y
    - psi_xx
    - psi_xy
    - psi_yy
    description: 'For every interior cell (i,j), i=1..nx, j=1..ny, at the supplied
      time t only. along_axis selects the orientation: along_axis=1 gives s_coord=x(i),
      r_coord=y(j); along_axis=2 gives s_coord=y(j), r_coord=x(i). Then s_c = s_c0
      + c_tr*t; xi = pi*(s_coord - s_c)/L_along; rho2 = (L_along/pi)**2 * sin(xi)**2
      + (r_coord - r_c)**2; psi = psi0*exp(-rho2/R_low**2); k_psi = L_along/(pi*R_low**2);
      psi_s = -k_psi*sin(2*xi)*psi; psi_r = -2*(r_coord - r_c)/R_low**2*psi; psi_ss
      = (-2/R_low**2*cos(2*xi) + k_psi**2*sin(2*xi)**2)*psi; psi_sr = 2*(r_coord -
      r_c)*L_along/(pi*R_low**4)*sin(2*xi)*psi; psi_rr = (-2/R_low**2 + 4*(r_coord
      - r_c)**2/R_low**4)*psi. Assignment to x/y derivatives: along_axis=1: psi_x=psi_s,
      psi_y=psi_r, psi_xx=psi_ss, psi_xy=psi_sr, psi_yy=psi_rr; along_axis=2: psi_x=psi_r,
      psi_y=psi_s, psi_xx=psi_rr, psi_xy=psi_sr, psi_yy=psi_ss. The periodic argument
      xi is used as written (sin of the unfolded argument); the Gaussian shape, the
      periodic argument and the translation at the constant signed speed c_tr must
      not be changed.'
  - step_id: step_03_prescribed_flow
    step_kind: pointwise_process
    operation_ref: tc4_prescribed_flow_and_derivatives
    inputs:
    - along_axis
    - c_tr
    - g
    - f
    - dfdr
    - ubar
    - dubar
    - hbar
    - psi
    - psi_x
    - psi_y
    - psi_xx
    - psi_xy
    - psi_yy
    outputs:
    - u_p
    - v_p
    - h_p
    - u_x
    - u_y
    - u_t
    - v_x
    - v_y
    - v_t
    - h_x
    - h_y
    - h_t
    description: 'Per cell (i,j), with ub=ubar(i,j), dub=dubar(i,j), fc=f(i,j), dfc=dfdr(i,j),
      hb=hbar(i,j) read at the cell''s own (i,j) (no differencing of any array, no
      re-derivation of the background). along_axis=1: u_p = ub - psi_y; v_p = psi_x;
      h_p = hb + fc*psi/g; u_x = -psi_xy; u_y = dub - psi_yy; u_t = c_tr*psi_xy; v_x
      = psi_xx; v_y = psi_xy; v_t = -c_tr*psi_xx; h_x = fc*psi_x/g; h_y = -fc*ub/g
      + (dfc*psi + fc*psi_y)/g; h_t = -c_tr*fc*psi_x/g. along_axis=2: u_p = -psi_y;
      v_p = ub + psi_x; h_p = hb + fc*psi/g; u_x = -psi_xy; u_y = -psi_yy; u_t = c_tr*psi_yy;
      v_x = dub + psi_xx; v_y = psi_xy; v_t = -c_tr*psi_xy; h_x = fc*ub/g + (dfc*psi
      + fc*psi_x)/g; h_y = fc*psi_y/g; h_t = -c_tr*fc*psi_y/g. The first term of the
      cross-channel derivative of h_p (-fc*ub/g at along_axis=1, +fc*ub/g at along_axis=2)
      is the geostrophic relation of the background; hbar is never differenced. Each
      orientation evaluates its own branch; one orientation must not be realised by
      exchanging arguments to the other orientation''s form and exchanging the result
      back.'
  - step_id: step_04_advective_residuals
    step_kind: source_term
    operation_ref: tc4_advective_residuals
    inputs:
    - g
    - f
    - u_p
    - v_p
    - h_p
    - u_x
    - u_y
    - u_t
    - v_x
    - v_y
    - v_t
    - h_x
    - h_y
    - h_t
    outputs:
    - F_u
    - F_v
    - F_h
    description: 'Per cell, in either orientation, with fc=f(i,j): F_u = u_t + u_p*u_x
      + v_p*u_y + g*h_x - fc*v_p; F_v = v_t + u_p*v_x + v_p*v_y + g*h_y + fc*u_p;
      F_h = h_t + u_p*h_x + v_p*h_y + h_p*(u_x + v_y). Each residual is evaluated
      as written, term by term in this order, and is NOT reduced by any cancellation
      the prescribed flow satisfies (g*h_x - fc*v_p and g*h_y + fc*u_p are evaluated
      as written, and the divergence term h_p*(u_x + v_y) is kept although it is zero
      for this flow).'
  - step_id: step_05_conservation_forcing
    step_kind: source_term
    operation_ref: tc4_conservation_form_forcing
    inputs:
    - F_u
    - F_v
    - F_h
    - h_p
    - u_p
    - v_p
    outputs:
    - S
    description: 'Per cell (i,j): S(1,i,j) = F_h; S(2,i,j) = h_p*F_u + u_p*F_h; S(3,i,j)
      = h_p*F_v + v_p*F_h. S is the only array written; it is intent out and never
      read, interior cells only, no ghost cells, component order [h, hu, hv] along
      the first extent.'
  ordering:
  - step_01_input_guard
  - step_02_low_streamfunction
  - step_03_prescribed_flow
  - step_04_advective_residuals
  - step_05_conservation_forcing
  control_condition: step_01_input_guard runs first. If the input is rejected (ncomp
    /= 3, nx < 1, ny < 1, along_axis not in {1, 2}, R_low <= 0 or L_along <= 0), guard_pass
    = false, S = 0 everywhere, and the operation returns. Otherwise guard_pass = true
    and steps 02-05 run once over every interior cell; within them the branch along_axis
    = 1 / along_axis = 2 selects the orientation assignments of steps 02 and 03.
  iteration_contract:
    applies: false
    rationale: The operation evaluates a pointwise forcing once per call at the supplied
      time; no loop carries state forward. The translation case's two calls are made
      by the checks module, not by the operation.
  update_semantics:
    target_variables:
    - S
    - guard_pass
    update_order: sequential
    write_policy: S is fully overwritten on every call (zeros on a rejected input,
      the forcing otherwise); guard_pass is always assigned.
  temporaries:
  - name: s_coord
    shape_expr: scalar
  - name: r_coord
    shape_expr: scalar
  - name: s_c
    shape_expr: scalar
  - name: xi
    shape_expr: scalar
  - name: rho2
    shape_expr: scalar
  - name: k_psi
    shape_expr: scalar
  - name: psi
    shape_expr: scalar
  - name: psi_s
    shape_expr: scalar
  - name: psi_r
    shape_expr: scalar
  - name: psi_ss
    shape_expr: scalar
  - name: psi_sr
    shape_expr: scalar
  - name: psi_rr
    shape_expr: scalar
  - name: psi_x
    shape_expr: scalar
  - name: psi_y
    shape_expr: scalar
  - name: psi_xx
    shape_expr: scalar
  - name: psi_xy
    shape_expr: scalar
  - name: psi_yy
    shape_expr: scalar
  - name: u_p
    shape_expr: scalar
  - name: v_p
    shape_expr: scalar
  - name: h_p
    shape_expr: scalar
  - name: u_x
    shape_expr: scalar
  - name: u_y
    shape_expr: scalar
  - name: u_t
    shape_expr: scalar
  - name: v_x
    shape_expr: scalar
  - name: v_y
    shape_expr: scalar
  - name: v_t
    shape_expr: scalar
  - name: h_x
    shape_expr: scalar
  - name: h_y
    shape_expr: scalar
  - name: h_t
    shape_expr: scalar
  - name: F_u
    shape_expr: scalar
  - name: F_v
    shape_expr: scalar
  - name: F_h
    shape_expr: scalar
  derived_field_rules:
  - name: s_coord
    rule: 'Along-channel coordinate of cell (i,j): x(i) when along_axis=1, y(j) when
      along_axis=2. Per-cell value of the current cell.'
  - name: r_coord
    rule: 'Cross-channel coordinate of cell (i,j): y(j) when along_axis=1, x(i) when
      along_axis=2.'
  - name: s_c
    rule: s_c = s_c0 + c_tr*t, the along-channel centre of the low at the supplied
      time t (no other time is used).
  - name: xi
    rule: xi = pi*(s_coord - s_c)/L_along (periodic argument; period L_along along
      the channel).
  - name: rho2
    rule: rho2 = (L_along/pi)**2 * sin(xi)**2 + (r_coord - r_c)**2.
  - name: k_psi
    rule: k_psi = L_along/(pi*R_low**2).
  - name: psi
    rule: psi = psi0*exp(-rho2/R_low**2), the streamfunction of the low.
  - name: psi_s
    rule: psi_s = -k_psi*sin(2*xi)*psi.
  - name: psi_r
    rule: psi_r = -2*(r_coord - r_c)/R_low**2*psi.
  - name: psi_ss
    rule: psi_ss = (-2/R_low**2*cos(2*xi) + k_psi**2*sin(2*xi)**2)*psi.
  - name: psi_sr
    rule: psi_sr = 2*(r_coord - r_c)*L_along/(pi*R_low**4)*sin(2*xi)*psi.
  - name: psi_rr
    rule: psi_rr = (-2/R_low**2 + 4*(r_coord - r_c)**2/R_low**4)*psi.
  - name: psi_x
    rule: psi_s when along_axis=1, psi_r when along_axis=2.
  - name: psi_y
    rule: psi_r when along_axis=1, psi_s when along_axis=2.
  - name: psi_xx
    rule: psi_ss when along_axis=1, psi_rr when along_axis=2.
  - name: psi_xy
    rule: psi_sr in both orientations.
  - name: psi_yy
    rule: psi_rr when along_axis=1, psi_ss when along_axis=2.
  - name: u_p
    rule: 'Prescribed x-velocity: ubar(i,j) - psi_y when along_axis=1; -psi_y when
      along_axis=2.'
  - name: v_p
    rule: 'Prescribed y-velocity: psi_x when along_axis=1; ubar(i,j) + psi_x when
      along_axis=2.'
  - name: h_p
    rule: 'Prescribed depth: hbar(i,j) + f(i,j)*psi/g in both orientations.'
  - name: u_x
    rule: -psi_xy in both orientations.
  - name: u_y
    rule: dubar(i,j) - psi_yy when along_axis=1; -psi_yy when along_axis=2.
  - name: u_t
    rule: c_tr*psi_xy when along_axis=1; c_tr*psi_yy when along_axis=2.
  - name: v_x
    rule: psi_xx when along_axis=1; dubar(i,j) + psi_xx when along_axis=2.
  - name: v_y
    rule: psi_xy in both orientations.
  - name: v_t
    rule: -c_tr*psi_xx when along_axis=1; -c_tr*psi_xy when along_axis=2.
  - name: h_x
    rule: f(i,j)*psi_x/g when along_axis=1; f(i,j)*ubar(i,j)/g + (dfdr(i,j)*psi +
      f(i,j)*psi_x)/g when along_axis=2.
  - name: h_y
    rule: -f(i,j)*ubar(i,j)/g + (dfdr(i,j)*psi + f(i,j)*psi_y)/g when along_axis=1;
      f(i,j)*psi_y/g when along_axis=2.
  - name: h_t
    rule: -c_tr*f(i,j)*psi_x/g when along_axis=1; -c_tr*f(i,j)*psi_y/g when along_axis=2.
  - name: F_u
    rule: F_u = u_t + u_p*u_x + v_p*u_y + g*h_x - f(i,j)*v_p, evaluated as written
      (no cancellation).
  - name: F_v
    rule: F_v = v_t + u_p*v_x + v_p*v_y + g*h_y + f(i,j)*u_p, evaluated as written
      (no cancellation).
  - name: F_h
    rule: F_h = h_t + u_p*h_x + v_p*h_y + h_p*(u_x + v_y), evaluated as written; the
      divergence term is kept.
  - name: S
    rule: 'Operation output: S(1,i,j) = F_h, S(2,i,j) = h_p*F_u + u_p*F_h, S(3,i,j)
      = h_p*F_v + v_p*F_h on an accepted input; S = 0.0 at every element on a rejected
      input. Checks-module bound state: case_setup allocates S with shape [ncomp,
      nx, ny] from inputs.grid (so the ncomp=2 / ncomp=4 cases allocate two / four
      components) and fills every element with inputs.sentinel (-999.0); case_run
      passes the bound S itself as the operation''s S argument (every case except
      l0_translation and l0_translation_axis, where S keeps the sentinel).'
  - name: S_t0
    rule: Checks-module bound state [3, nx, ny], set to inputs.sentinel at setup in
      every case. On l0_translation and l0_translation_axis only, case_run calls the
      operation with t = inputs.time.t_first (0.0) passing S_t0 as the S argument,
      then calls it again with t = inputs.time.t_second (the literal 106066.017177982,
      used as given and never re-derived as 3*dx/c_tr) passing S_tau as the S argument;
      all other arguments are the case's. In every other case S_t0 keeps the sentinel.
  - name: S_tau
    rule: 'Checks-module bound state [3, nx, ny]: inputs.sentinel at setup; the S
      argument of the second call of the translation cases (see S_t0); the sentinel
      elsewhere.'
  - name: guard_pass_record
    rule: The bound scalar guard_pass of the checks module (source record) is -1.0
      at setup, before any call; after each call of the operation it is set to 1.0
      if the returned logical guard_pass is true and 0.0 if false (on the translation
      cases it holds the result of the last call). steps = number of operation calls
      (1, or 2 on the translation cases); cells_updated = nx*ny per call.
  - name: x
    rule: Operation argument x (nx values). When inputs.grid.x is declared (the four
      reference-values cases) it is that list. Otherwise x(i) = (i - 0.5)*inputs.grid.L_x/inputs.grid.nx,
      i = 1..nx (cell centres; L_x is the grid length and is independent of the L_along
      argument, which abnormal cases override).
  - name: y
    rule: 'Operation argument y (ny values): inputs.grid.y when declared; otherwise
      y(j) = (j - 0.5)*inputs.grid.L_y/inputs.grid.ny, j = 1..ny.'
  - name: t
    rule: 'Operation argument t: inputs.time.t; on the translation cases inputs.time.t_first
      for the first call and inputs.time.t_second for the second.'
  - name: background_profile
    rule: 'How the checks module forms f, dfdr, ubar, dubar, hbar (nx x ny each, element
      (i,j)) from inputs.background. When profile = explicit, each is the declared
      nested list, outer index i, inner index j. When profile = tc4_beta_channel:
      f0 = 2*Omega*sin(theta0), beta = 2*Omega*cos(theta0)/a, h0 = gh0/g (g = inputs.constants.g),
      k = pi/L_r; r = y(j) when along_axis = 2 is false (along_axis 1, 0 or 3) and
      r = x(i) when along_axis = 2; q = r and dq = +1 when cross_reversed = 0, q =
      L_r - r and dq = -1 when cross_reversed = 1. fprof(q) = f0 + beta*(q - L_r/2);
      ubprof(q) = u0*sin(k*q)**2; dubprof(q) = u0*k*sin(2*k*q); hbprof(q) = h0 - (u0/g)*(
      f0*(q/2 - sin(2*k*q)/(4*k)) + beta*( q**2/4 - L_r*q/4 - (q - L_r/2)*sin(2*k*q)/(4*k)
      - (cos(2*k*q) - 1)/(8*k**2) ) ). Then f = rotation_sign*fprof(q), dfdr = rotation_sign*beta*dq,
      ubar = jet_sign*ubprof(q), dubar = jet_sign*dubprof(q)*dq, hbar = hbprof(q),
      each the same along the channel. Omega, a, theta0, u0, gh0 are never changed;
      the three numbers rotation_sign, jet_sign, cross_reversed declare the transformation.
      psi0, R_low, c_tr, s_c0, r_c are inputs.low; g, L_along are inputs.constants;
      ncomp, nx, ny are inputs.grid; along_axis is inputs.along_axis.'
  - name: S_fd
    rule: 'Checks-module reference field [3, nx, ny] (source reference), set to inputs.sentinel
      at setup in every case except l0_fd_t0, l0_fd_t0_axis, l0_fd_t3e4, l0_fd_t3e4_axis,
      where it is computed at setup, before the operation is called, never from an
      output of the operation, and not written again. It uses the checks module''s
      own closed forms of the prescribed flow, evaluated at continuous positions:
      psi as in step_02 with the case''s low and the along-channel coordinate x (along_axis=1)
      or y (along_axis=2), and fprof/ubprof/hbprof of background_profile (rotation_sign
      applied to f). along_axis=1: h = hbar(y) + f(y)*psi/g, u = ubar(y) - psi_y,
      v = psi_x; along_axis=2: h = hbar(x) + f(x)*psi/g, u = -psi_y, v = ubar(x) +
      psi_x. With U = [h, h*u, h*v], Fx = [h*u, h*u*u + g*h*h/2, h*u*v], Fy = [h*v,
      h*u*v, h*v*v + g*h*h/2], S_cor = [0, f*h*v, -f*h*u] at the cell centre, d =
      50.0 m and dt = 1.0 s, at cell (i,j) and the case time t: S_fd = (U(t+dt) -
      U(t-dt))/(2*dt) + (Fx(x+d) - Fx(x-d))/(2*d) + (Fy(y+d) - Fy(y-d))/(2*d) - S_cor,
      every shifted value evaluated from the closed forms (no grid array, no boundary).'
  invariants:
  - 'The forcing is pointwise: S(:,i,j) depends only on x(i), y(j), t, the background
    at (i,j) and the scalar arguments, and on no element of S.'
  - No state of the run (h, hu, hv) is read; the forcing is evaluated at the supplied
    t only.
  - The background arrays are received, never re-derived from a profile, and no received
    array is differenced in place of a supplied derivative (dfdr, dubar are used as
    given).
  - The orientation is decided by along_axis alone; each orientation evaluates its
    own branch of steps 02-03, never by exchanging arguments to the other orientation.
  - No residual of step_04 is reduced by a cancellation the prescribed flow satisfies.
  - With psi0 = 0 the prescribed flow is the geostrophic background and S = 0 at every
    cell up to round-off.
  - The divergence u_x + v_y of the prescribed flow is zero; the term h_p*(u_x + v_y)
    is still evaluated.
  - On a rejected input guard_pass = false and S = 0 exactly at every element, and
    no input array element is read.
  - 'Axis exchange: the forcing at along_axis=2 for (nx, ny, x, y, f, dfdr, ubar,
    dubar, hbar, psi0) equals, up to the floating-point order, the forcing at along_axis=1
    for (ny, nx, y, x, -f^T, -dfdr^T, ubar^T, dubar^T, hbar^T, -psi0) transposed with
    its 2nd and 3rd components exchanged (a property, not an implementation route).'
  - No procedure prefix beyond the published signature (e.g. no pure / side-effect-free
    marker) is added to the operation header; dp is bound exactly once as the float64
    kind parameter.
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
  inputs:
  - name: ncomp
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.ncomp; number of forcing components (must be 3).
  - name: nx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.nx; interior cells along x.
  - name: ny
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.ny; interior cells along y.
  - name: along_axis
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.along_axis; 1 = channel along x, 2 = channel along y; fixes
      the (s, r) assignment and the prescribed-flow branch.
  - name: x
    shape_expr: '[nx]'
    evidence_ref: spec.ir.yaml
    description: Interior cell-centre x coordinates (derived rule x).
  - name: y
    shape_expr: '[ny]'
    evidence_ref: spec.ir.yaml
    description: Interior cell-centre y coordinates (derived rule y).
  - name: t
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: Evaluation time (derived rule t).
  - name: f
    shape_expr: '[nx, ny]'
    evidence_ref: spec.ir.yaml
    description: Coriolis parameter per cell (derived rule background_profile).
  - name: dfdr
    shape_expr: '[nx, ny]'
    evidence_ref: spec.ir.yaml
    description: Cross-channel derivative of f per cell (background_profile).
  - name: ubar
    shape_expr: '[nx, ny]'
    evidence_ref: spec.ir.yaml
    description: Background along-channel velocity per cell (background_profile).
  - name: dubar
    shape_expr: '[nx, ny]'
    evidence_ref: spec.ir.yaml
    description: Cross-channel derivative of ubar per cell (background_profile).
  - name: hbar
    shape_expr: '[nx, ny]'
    evidence_ref: spec.ir.yaml
    description: Background depth per cell (background_profile).
  - name: g
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.g, gravitational acceleration.
  - name: L_along
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.L_along, channel period along the channel (guarded
      > 0).
  - name: psi0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.low.psi0, streamfunction amplitude.
  - name: R_low
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.low.R_low, radius of the low (guarded > 0).
  - name: c_tr
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.low.c_tr, signed translation speed.
  - name: s_c0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.low.s_c0, along-channel centre at t=0.
  - name: r_c
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.low.r_c, cross-channel centre.
  outputs:
  - name: S
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - S
    description: Forcing [h, hu, hv] at interior cells, captured after the run.
  - name: guard_pass
    shape_expr: scalar
    evidence_ref: raw/state_snapshots
    raw_variables:
    - guard_pass
    description: The operation's logical result, written by the driver as 1 (true)
      / 0 (false); 0 before the call.
  raw_requirements:
    required_evidence:
    - artifact: state_snapshots
      required: true
      schema:
        variables:
        - name: S
          shape_expr: '[ncomp, nx, ny]'
        - name: guard_pass
          shape_expr: scalar
        time_variable: t
        time_shape_expr: scalar
        coordinates:
        - name: comp
          axis: 0
          count: inputs.grid.ncomp
          length: inputs.grid.ncomp
          placement: cell_center
        - name: xc
          axis: 1
          count: inputs.grid.nx
          length: inputs.grid.nx
          placement: cell_center
        - name: yc
          axis: 2
          count: inputs.grid.ny
          length: inputs.grid.ny
          placement: cell_center
  semantic_dependency:
    required_sources:
    - ncomp
    - nx
    - ny
    - along_axis
    - x
    - y
    - t
    - f
    - dfdr
    - ubar
    - dubar
    - hbar
    - g
    - L_along
    - psi0
    - R_low
    - c_tr
    - s_c0
    - r_c
  tests:
  - test_id: l0_reference_values_pass
    expected_outcome: pass
    target_cases:
    - l0_reference_values
    quantities:
    - guard_pass
    - reference_values
  - test_id: l0_reference_values_quiescent_pass
    expected_outcome: pass
    target_cases:
    - l0_reference_values_quiescent
    quantities:
    - guard_pass
    - reference_values
  - test_id: l0_min_extent_pass
    expected_outcome: pass
    target_cases:
    - l0_min_extent
    quantities:
    - guard_pass
    - reference_values
  - test_id: l0_forcing_matches_fd_residual_pass
    expected_outcome: pass
    target_cases:
    - l0_fd_t0
    - l0_fd_t0_axis
    quantities:
    - guard_pass
    - fd_residual
  - test_id: l0_forcing_matches_fd_residual_late_pass
    expected_outcome: pass
    target_cases:
    - l0_fd_t3e4
    - l0_fd_t3e4_axis
    quantities:
    - guard_pass
    - fd_residual
  - test_id: l0_zero_low_gives_zero_forcing_pass
    expected_outcome: pass
    target_cases:
    - l0_zero_low
    - l0_zero_low_axis
    quantities:
    - guard_pass
    - zero_low
  - test_id: l0_translation_covariance_pass
    expected_outcome: pass
    target_cases:
    - l0_translation
    - l0_translation_axis
    - l0_translation_tau
    - l0_translation_tau_axis
    quantities:
    - guard_pass
    - translation
  - test_id: l0_axis_exchange_pairs_pass
    expected_outcome: pass
    target_cases:
    - l0_reference_values
    - l0_reference_values_axis
    - l0_reference_values_quiescent
    - l0_reference_values_quiescent_axis
    - l0_fd_t0
    - l0_fd_t0_axis
    - l0_fd_t3e4
    - l0_fd_t3e4_axis
    - l0_translation
    - l0_translation_axis
    - l0_translation_tau
    - l0_translation_tau_axis
    - l0_min_extent
    - l0_min_extent_axis
    quantities:
    - guard_pass
    - axis_exchange
  - test_id: l0_mirror_pairs_pass
    expected_outcome: pass
    target_cases:
    - l0_fd_t3e4
    - l0_fd_t3e4_axis
    - l0_fd_t3e4_axis_xmir
    - l0_fd_t3e4_axis_ymir
    - l0_fd_t3e4_xmir
    - l0_fd_t3e4_ymir
    quantities:
    - guard_pass
    - mirror
  - test_id: l0_invalid_ncomp_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_ncomp_2
    - l0_invalid_ncomp_2_axis
    quantities:
    - guard_pass
    - rejected_outputs_zero
  - test_id: l0_invalid_ncomp_above_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_ncomp_4
    - l0_invalid_ncomp_4_axis
    quantities:
    - guard_pass
    - rejected_outputs_zero
  - test_id: l0_invalid_along_axis_zero_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_along_axis_0
    quantities:
    - guard_pass
    - rejected_outputs_zero
  - test_id: l0_invalid_along_axis_three_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_along_axis_3
    quantities:
    - guard_pass
    - rejected_outputs_zero
  - test_id: l0_invalid_r_low_zero_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_r_low_zero
    - l0_invalid_r_low_zero_axis
    quantities:
    - guard_pass
    - rejected_outputs_zero
  - test_id: l0_invalid_r_low_negative_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_r_low_negative
    - l0_invalid_r_low_negative_axis
    quantities:
    - guard_pass
    - rejected_outputs_zero
  - test_id: l0_invalid_l_along_zero_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_l_along_zero
    - l0_invalid_l_along_zero_axis
    quantities:
    - guard_pass
    - rejected_outputs_zero
  - test_id: l0_invalid_l_along_negative_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_l_along_negative
    - l0_invalid_l_along_negative_axis
    quantities:
    - guard_pass
    - rejected_outputs_zero
  - test_id: l0_invalid_nx_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_nx_zero
    - l0_invalid_nx_zero_axis
    quantities:
    - guard_pass
  - test_id: l0_invalid_ny_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_ny_zero
    - l0_invalid_ny_zero_axis
    quantities:
    - guard_pass
  predicates:
  - test_id: l0_reference_values_pass
    quantity: guard_pass
    target_cases:
    - l0_reference_values
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_reference_values_pass
    quantity: reference_values
    target_cases:
    - l0_reference_values
    per_case: true
    expr: maxabs(final.S - inputs.expected_S)
    op: le
    value: 1.0e-08
  - test_id: l0_reference_values_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_reference_values
    per_case: true
    expr: maxabs(final.S - comparand.final.S) / max(maxabs(final.S), maxabs(comparand.final.S),
      1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_reference_values_quiescent_pass
    quantity: guard_pass
    target_cases:
    - l0_reference_values_quiescent
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_reference_values_quiescent_pass
    quantity: reference_values
    target_cases:
    - l0_reference_values_quiescent
    per_case: true
    expr: maxabs(final.S - inputs.expected_S)
    op: le
    value: 1.0e-08
  - test_id: l0_reference_values_quiescent_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_reference_values_quiescent
    per_case: true
    expr: maxabs(final.S - comparand.final.S) / max(maxabs(final.S), maxabs(comparand.final.S),
      1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_min_extent_pass
    quantity: guard_pass
    target_cases:
    - l0_min_extent
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_min_extent_pass
    quantity: reference_values
    target_cases:
    - l0_min_extent
    per_case: true
    expr: maxabs(final.S - inputs.expected_S)
    op: le
    value: 1.0e-08
  - test_id: l0_min_extent_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_min_extent
    per_case: true
    expr: maxabs(final.S - comparand.final.S) / max(maxabs(final.S), maxabs(comparand.final.S),
      1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_forcing_matches_fd_residual_pass
    quantity: guard_pass
    target_cases:
    - l0_fd_t0
    - l0_fd_t0_axis
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_forcing_matches_fd_residual_pass
    quantity: fd_residual
    target_cases:
    - l0_fd_t0
    - l0_fd_t0_axis
    per_case: true
    bind:
      ax: 2 - inputs.along_axis
      d: '50.0'
      dt: '1.0'
      xcell: xc * inputs.grid.L_x / inputs.grid.nx
      ycell: yc * inputs.grid.L_y / inputs.grid.ny
      f0: 2 * inputs.background.Omega * sin(inputs.background.theta0)
      beta: 2 * inputs.background.Omega * cos(inputs.background.theta0) / inputs.background.a
      k_y: pi / inputs.background.L_r
      x_c: xcell
      y_c: ycell
      s_c: ax * x_c + (1 - ax) * y_c
      r_c: ax * y_c + (1 - ax) * x_c
      xi_c: pi * (s_c - inputs.low.s_c0 - inputs.low.c_tr * (inputs.time.t)) / inputs.constants.L_along
      psi_c: inputs.low.psi0 * exp(-((inputs.constants.L_along / pi) ** 2 * sin(xi_c)
        ** 2 + (r_c - inputs.low.r_c) ** 2) / inputs.low.R_low ** 2)
      ps_c: -(inputs.constants.L_along / (pi * inputs.low.R_low ** 2)) * sin(2 * xi_c)
        * psi_c
      pr_c: -2 * (r_c - inputs.low.r_c) / inputs.low.R_low ** 2 * psi_c
      f_c: inputs.background.rotation_sign * (f0 + beta * (r_c - inputs.background.L_r
        / 2))
      ub_c: inputs.background.jet_sign * inputs.background.u0 * sin(k_y * r_c) **
        2
      hb_c: inputs.background.gh0 / inputs.constants.g - (inputs.background.u0 / inputs.constants.g)
        * (f0 * (r_c / 2 - sin(2 * k_y * r_c) / (4 * k_y)) + beta * (r_c ** 2 / 4
        - inputs.background.L_r * r_c / 4 - (r_c - inputs.background.L_r / 2) * sin(2
        * k_y * r_c) / (4 * k_y) - (cos(2 * k_y * r_c) - 1) / (8 * k_y ** 2)))
      h_c: hb_c + f_c * psi_c / inputs.constants.g
      u_c: ax * ub_c - (ax * pr_c + (1 - ax) * ps_c)
      v_c: (1 - ax) * ub_c + ax * ps_c + (1 - ax) * pr_c
      x_tp: xcell
      y_tp: ycell
      s_tp: ax * x_tp + (1 - ax) * y_tp
      r_tp: ax * y_tp + (1 - ax) * x_tp
      xi_tp: pi * (s_tp - inputs.low.s_c0 - inputs.low.c_tr * (inputs.time.t + dt))
        / inputs.constants.L_along
      psi_tp: inputs.low.psi0 * exp(-((inputs.constants.L_along / pi) ** 2 * sin(xi_tp)
        ** 2 + (r_tp - inputs.low.r_c) ** 2) / inputs.low.R_low ** 2)
      ps_tp: -(inputs.constants.L_along / (pi * inputs.low.R_low ** 2)) * sin(2 *
        xi_tp) * psi_tp
      pr_tp: -2 * (r_tp - inputs.low.r_c) / inputs.low.R_low ** 2 * psi_tp
      f_tp: inputs.background.rotation_sign * (f0 + beta * (r_tp - inputs.background.L_r
        / 2))
      ub_tp: inputs.background.jet_sign * inputs.background.u0 * sin(k_y * r_tp) **
        2
      hb_tp: inputs.background.gh0 / inputs.constants.g - (inputs.background.u0 /
        inputs.constants.g) * (f0 * (r_tp / 2 - sin(2 * k_y * r_tp) / (4 * k_y)) +
        beta * (r_tp ** 2 / 4 - inputs.background.L_r * r_tp / 4 - (r_tp - inputs.background.L_r
        / 2) * sin(2 * k_y * r_tp) / (4 * k_y) - (cos(2 * k_y * r_tp) - 1) / (8 *
        k_y ** 2)))
      h_tp: hb_tp + f_tp * psi_tp / inputs.constants.g
      u_tp: ax * ub_tp - (ax * pr_tp + (1 - ax) * ps_tp)
      v_tp: (1 - ax) * ub_tp + ax * ps_tp + (1 - ax) * pr_tp
      x_tm: xcell
      y_tm: ycell
      s_tm: ax * x_tm + (1 - ax) * y_tm
      r_tm: ax * y_tm + (1 - ax) * x_tm
      xi_tm: pi * (s_tm - inputs.low.s_c0 - inputs.low.c_tr * (inputs.time.t - dt))
        / inputs.constants.L_along
      psi_tm: inputs.low.psi0 * exp(-((inputs.constants.L_along / pi) ** 2 * sin(xi_tm)
        ** 2 + (r_tm - inputs.low.r_c) ** 2) / inputs.low.R_low ** 2)
      ps_tm: -(inputs.constants.L_along / (pi * inputs.low.R_low ** 2)) * sin(2 *
        xi_tm) * psi_tm
      pr_tm: -2 * (r_tm - inputs.low.r_c) / inputs.low.R_low ** 2 * psi_tm
      f_tm: inputs.background.rotation_sign * (f0 + beta * (r_tm - inputs.background.L_r
        / 2))
      ub_tm: inputs.background.jet_sign * inputs.background.u0 * sin(k_y * r_tm) **
        2
      hb_tm: inputs.background.gh0 / inputs.constants.g - (inputs.background.u0 /
        inputs.constants.g) * (f0 * (r_tm / 2 - sin(2 * k_y * r_tm) / (4 * k_y)) +
        beta * (r_tm ** 2 / 4 - inputs.background.L_r * r_tm / 4 - (r_tm - inputs.background.L_r
        / 2) * sin(2 * k_y * r_tm) / (4 * k_y) - (cos(2 * k_y * r_tm) - 1) / (8 *
        k_y ** 2)))
      h_tm: hb_tm + f_tm * psi_tm / inputs.constants.g
      u_tm: ax * ub_tm - (ax * pr_tm + (1 - ax) * ps_tm)
      v_tm: (1 - ax) * ub_tm + ax * ps_tm + (1 - ax) * pr_tm
      x_xp: xcell + d
      y_xp: ycell
      s_xp: ax * x_xp + (1 - ax) * y_xp
      r_xp: ax * y_xp + (1 - ax) * x_xp
      xi_xp: pi * (s_xp - inputs.low.s_c0 - inputs.low.c_tr * (inputs.time.t)) / inputs.constants.L_along
      psi_xp: inputs.low.psi0 * exp(-((inputs.constants.L_along / pi) ** 2 * sin(xi_xp)
        ** 2 + (r_xp - inputs.low.r_c) ** 2) / inputs.low.R_low ** 2)
      ps_xp: -(inputs.constants.L_along / (pi * inputs.low.R_low ** 2)) * sin(2 *
        xi_xp) * psi_xp
      pr_xp: -2 * (r_xp - inputs.low.r_c) / inputs.low.R_low ** 2 * psi_xp
      f_xp: inputs.background.rotation_sign * (f0 + beta * (r_xp - inputs.background.L_r
        / 2))
      ub_xp: inputs.background.jet_sign * inputs.background.u0 * sin(k_y * r_xp) **
        2
      hb_xp: inputs.background.gh0 / inputs.constants.g - (inputs.background.u0 /
        inputs.constants.g) * (f0 * (r_xp / 2 - sin(2 * k_y * r_xp) / (4 * k_y)) +
        beta * (r_xp ** 2 / 4 - inputs.background.L_r * r_xp / 4 - (r_xp - inputs.background.L_r
        / 2) * sin(2 * k_y * r_xp) / (4 * k_y) - (cos(2 * k_y * r_xp) - 1) / (8 *
        k_y ** 2)))
      h_xp: hb_xp + f_xp * psi_xp / inputs.constants.g
      u_xp: ax * ub_xp - (ax * pr_xp + (1 - ax) * ps_xp)
      v_xp: (1 - ax) * ub_xp + ax * ps_xp + (1 - ax) * pr_xp
