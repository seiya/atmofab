  - test_id: l1_refinement_against_analytic
    quantity: errors.mode_scheme_fidelity
    target_cases:
    - advdiff1d_ref_nx064_shift000_dts100
    - advdiff1d_ref_nx128_shift000_dts100
    - advdiff1d_ref_nx256_shift000_dts100
    per_case: true
    bind:
      dx: derived.dx
      n_step: derived.n_step
      dt: derived.dt
      C: inputs.physics.a * dt / dx
      D: inputs.constants.nu * dt / dx ** 2
      th1: 2 * pi * 1 / inputs.grid.nx
      km1: 2 * pi * 1 / inputs.grid.L
      ReG1: 1 - (abs(C) + 2 * D) * (1 - cos(th1))
      ImG1: -C * sin(th1)
      rG1: sqrt(ReG1 ** 2 + ImG1 ** 2)
      phG1: atan2(ImG1, ReG1)
      Pr1: rG1 ** n_step * cos(n_step * phG1)
      Pi1: rG1 ** n_step * sin(n_step * phG1)
      A0r1: sum(initial.u * cos(km1 * x))
      A0i1: -sum(initial.u * sin(km1 * x))
      A1r1: sum(final.u * cos(km1 * x))
      A1i1: -sum(final.u * sin(km1 * x))
      err1: sqrt((A1r1 - (Pr1 * A0r1 - Pi1 * A0i1)) ** 2 + (A1i1 - (Pr1 * A0i1 + Pi1 * A0r1)) ** 2) / sqrt(A0r1 ** 2 + A0i1
        ** 2)
      th2: 2 * pi * 2 / inputs.grid.nx
      km2: 2 * pi * 2 / inputs.grid.L
      ReG2: 1 - (abs(C) + 2 * D) * (1 - cos(th2))
      ImG2: -C * sin(th2)
      rG2: sqrt(ReG2 ** 2 + ImG2 ** 2)
      phG2: atan2(ImG2, ReG2)
      Pr2: rG2 ** n_step * cos(n_step * phG2)
      Pi2: rG2 ** n_step * sin(n_step * phG2)
      A0r2: sum(initial.u * cos(km2 * x))
      A0i2: -sum(initial.u * sin(km2 * x))
      A1r2: sum(final.u * cos(km2 * x))
      A1i2: -sum(final.u * sin(km2 * x))
      err2: sqrt((A1r2 - (Pr2 * A0r2 - Pi2 * A0i2)) ** 2 + (A1i2 - (Pr2 * A0i2 + Pi2 * A0r2)) ** 2) / sqrt(A0r2 ** 2 + A0i2
        ** 2)
    expr: max(err1, err2)
    op: le
    value: 1.0e-10
