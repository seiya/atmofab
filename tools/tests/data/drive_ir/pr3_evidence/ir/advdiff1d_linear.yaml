      Pr2: rG2 ** n_step * cos(n_step * phG2)
      Pi2: rG2 ** n_step * sin(n_step * phG2)
      A0r2: sum(initial.u * cos(km2 * x))
      A0i2: -sum(initial.u * sin(km2 * x))
      A1r2: sum(final.u * cos(km2 * x))
      A1i2: -sum(final.u * sin(km2 * x))
      err2: sqrt((A1r2 - (Pr2 * A0r2 - Pi2 * A0i2)) ** 2 + (A1i2 - (Pr2 * A0i2 + Pi2 * A0r2)) ** 2) / sqrt(A0r2 ** 2 + A0i2
        ** 2)
    expr: max(err1, err2)
    op: le
    value: 1.0e-10
  - test_id: l3_mirror_pair
    quantity: cross_target_state_agreement
    target_cases:
    - advdiff1d_ref_nx128_shift000_dts100
    - advdiff1d_ref_nx128_shift000_dts100_amir
    per_case: true
    expr: maxabs(final.u - comparand.final.u) / max(maxabs(final.u), maxabs(comparand.final.u), 1.0)
    op: le
    value: 1.0e-12
  - test_id: l1_advection_limited_bands
    quantity: cfl.combined_max
    target_cases:
    - advdiff1d_ref_nx064_shift000_dts100_a200
    per_case: true
    bind:
      C: inputs.physics.a * derived.dt / derived.dx
      D: inputs.constants.nu * derived.dt / (derived.dx * derived.dx)
      input_term: abs(C) + 2 * D
      state_term: maxabs(final.u) / maxabs(initial.u)
    expr: max(input_term, state_term)
    op: le
    value: 1.0
  - test_id: l1_advection_limited_bands
    quantity: metrics.mass_drift_rel
    target_cases:
    - advdiff1d_ref_nx064_shift000_dts100_a200
    per_case: true
    bind:
      dx: inputs.grid.L / inputs.grid.nx
      M0: sum(initial.u) * dx
      M_end: sum(final.u) * dx
      M0_abs: sum(abs(initial.u)) * dx
    expr: abs(M_end - M0) / max(M0_abs, 1.0e-14)
    op: le
    value: 1.0e-12
  - test_id: l1_advection_limited_bands
    quantity: errors.analytic.l1_rel_tend.lower
    target_cases:
    - advdiff1d_ref_nx064_shift000_dts100_a200
    per_case: true
    bind:
      T: inputs.time.t_end
      k1: 2 * pi / inputs.grid.L
      k2: 4 * pi / inputs.grid.L
      s: inputs.initial.shift_fraction * inputs.grid.L
      u_ex: exp(-inputs.constants.nu * k1 ** 2 * T) * sin(k1 * (x - inputs.physics.a * T - s)) + 0.5 * exp(-inputs.constants.nu
        * k2 ** 2 * T) * sin(k2 * (x - inputs.physics.a * T - s))
    expr: sum(abs(final.u - u_ex)) / sum(abs(u_ex))
    op: ge
    value: 0.12
  - test_id: l1_advection_limited_bands
    quantity: errors.analytic.l1_rel_tend.upper
    target_cases:
    - advdiff1d_ref_nx064_shift000_dts100_a200
    per_case: true
    bind:
      T: inputs.time.t_end
      k1: 2 * pi / inputs.grid.L
      k2: 4 * pi / inputs.grid.L
      s: inputs.initial.shift_fraction * inputs.grid.L
      u_ex: exp(-inputs.constants.nu * k1 ** 2 * T) * sin(k1 * (x - inputs.physics.a * T - s)) + 0.5 * exp(-inputs.constants.nu
        * k2 ** 2 * T) * sin(k2 * (x - inputs.physics.a * T - s))
    expr: sum(abs(final.u - u_ex)) / sum(abs(u_ex))
    op: le
    value: 0.16
  - test_id: l1_advection_limited_bands
    quantity: errors.analytic.l2_rel_tend.lower
    target_cases:
    - advdiff1d_ref_nx064_shift000_dts100_a200
    per_case: true
    bind:
      T: inputs.time.t_end
      k1: 2 * pi / inputs.grid.L
      k2: 4 * pi / inputs.grid.L
      s: inputs.initial.shift_fraction * inputs.grid.L
      u_ex: exp(-inputs.constants.nu * k1 ** 2 * T) * sin(k1 * (x - inputs.physics.a * T - s)) + 0.5 * exp(-inputs.constants.nu
        * k2 ** 2 * T) * sin(k2 * (x - inputs.physics.a * T - s))
    expr: norm2(final.u - u_ex) / norm2(u_ex)
    op: ge
    value: 0.13
  - test_id: l1_advection_limited_bands
    quantity: errors.analytic.l2_rel_tend.upper
    target_cases:
    - advdiff1d_ref_nx064_shift000_dts100_a200
    per_case: true
    bind:
      T: inputs.time.t_end
