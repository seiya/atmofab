drive:
  distribute:
    axes:
    - {name: x, cells: inputs.grid.nx, min_block: 2}
  step:
    operation: advdiff1d_linear__step
    result: ok
    arguments:
      nx: inputs.grid.nx
      dx: derived.dx
      a: inputs.physics.a
      nu: inputs.constants.nu
      dt: derived.dt
      t: time
      u: state.u
      ok: state.ok
  loop:
    n_step: derived.n_step
    dt: derived.dt
    t_start: inputs.time.t_start
    t_end: inputs.time.t_end
  history:
    every: inputs.history.every
