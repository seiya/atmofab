algorithm:
  algorithm_id: rk4_classical_time_update
  execution_mode: sequence
  steps:
  - step_id: step_01_input_guard
    step_kind: diagnostic
    operation_ref: input_guard
    inputs:
    - ncomp
    - nx
    - ny
    - dt
    outputs:
    - guard_pass
    description: 'guard_pass = (dt > 0) and (ncomp >= 1) and (nx >= 1) and (ny >=
      1). dt is the case''s inputs.time.dt; ncomp, nx, ny are inputs.grid.ncomp/nx/ny.
      When guard_pass is false (dt <= 0, i.e. dt = 0.0 in l0_invalid_dt_zero and dt
      = -0.1 in l0_invalid_dt_negative, or an extent < 1) the operation returns immediately:
      rhs is NOT called at all (zero calls), no stage is evaluated, and U_np1 is not
      a valid update (it may be left as any defined value; the driver does not commit
      it). The guard is evaluated before any rhs call. A guard written as dt < 0 or
      dt /= 0 is wrong: both dt = 0 and dt < 0 must be refused.'
  - step_id: step_02_stage_1
    step_kind: source_term
    operation_ref: rk4_stage_1_tendency
    inputs:
    - rhs
    - ncomp
    - nx
    - ny
    - t
    - U_n
    outputs:
    - k1
    description: 'First rhs call: call rhs(ncomp, nx, ny, t, U_n, k1), i.e. k1 = R(t,
      U_n). Stage time is exactly t (the argument, never 0 or a constant), stage state
      is exactly U_n. Only executed when guard_pass is true.'
  - step_id: step_03_stage_2
    step_kind: source_term
    operation_ref: rk4_stage_2_tendency
    inputs:
    - rhs
    - ncomp
    - nx
    - ny
    - t
    - dt
    - U_n
    - k1
    outputs:
    - U_s2
    - k2
    description: 'Build U_s2(c,i,j) = U_n(c,i,j) + (dt/2)*k1(c,i,j) for every c in
      1..ncomp, i in 1..nx, j in 1..ny (loops over exactly these extents; i bounded
      by nx, j bounded by ny). Second rhs call: rhs(ncomp, nx, ny, t + dt/2, U_s2,
      k2), i.e. k2 = R(t + dt/2, U_n + (dt/2) k1).'
  - step_id: step_04_stage_3
    step_kind: source_term
    operation_ref: rk4_stage_3_tendency
    inputs:
    - rhs
    - ncomp
    - nx
    - ny
    - t
    - dt
    - U_n
    - k2
    outputs:
    - U_s3
    - k3
    description: 'Build U_s3(c,i,j) = U_n(c,i,j) + (dt/2)*k2(c,i,j) over all c in
      1..ncomp, i in 1..nx, j in 1..ny. Third rhs call: rhs(ncomp, nx, ny, t + dt/2,
      U_s3, k3), i.e. k3 = R(t + dt/2, U_n + (dt/2) k2).'
  - step_id: step_05_stage_4
    step_kind: source_term
    operation_ref: rk4_stage_4_tendency
    inputs:
    - rhs
    - ncomp
    - nx
    - ny
    - t
    - dt
    - U_n
    - k3
    outputs:
    - U_s4
    - k4
    description: 'Build U_s4(c,i,j) = U_n(c,i,j) + dt*k3(c,i,j) over all c in 1..ncomp,
      i in 1..nx, j in 1..ny. Fourth rhs call: rhs(ncomp, nx, ny, t + dt, U_s4, k4),
      i.e. k4 = R(t + dt, U_n + dt k3).'
  - step_id: step_06_combine
    step_kind: time_integrate
    operation_ref: rk4_combine
    inputs:
    - U_n
    - dt
    - k1
    - k2
    - k3
    - k4
    - ncomp
    - nx
    - ny
    outputs:
    - U_np1
    description: U_np1(c,i,j) = U_n(c,i,j) + (dt/6)*(k1(c,i,j) + 2*k2(c,i,j) + 2*k3(c,i,j)
      + k4(c,i,j)) for every c in 1..ncomp, i in 1..nx, j in 1..ny (j loop bounded
      by ny, i loop by nx). U_np1 is a separate array from U_n, so no written cell
      is read. The operation's last action on the accepted path is guard_pass = true.
  ordering:
  - step_01_input_guard
  - step_02_stage_1
  - step_03_stage_2
  - step_04_stage_3
  - step_05_stage_4
  - step_06_combine
  control_condition: step_01_input_guard runs first; steps 02-06 run only when guard_pass
    is true. When guard_pass is false the operation returns with guard_pass = false
    and makes no rhs call. The four rhs calls are a fixed classical RK4 stage composition
    (exactly 4 stages, run once per operation call); the time loop of a case belongs
    to the host-rendered driver, not to this component.
  iteration_contract:
    kind: fixed_stage_composition
    stages: 4
    rationale: 'classical four-stage RK4: one operation call evaluates rhs exactly
      four times in the fixed order of steps 02-05 and combines once; no loop counter
      or stop condition is part of the operation.'
  update_semantics:
    target_variables:
    - U_np1
    - guard_pass
    update_order: sequential
  temporaries:
  - name: k1
    shape_expr: '[ncomp, nx, ny]'
  - name: k2
    shape_expr: '[ncomp, nx, ny]'
  - name: k3
    shape_expr: '[ncomp, nx, ny]'
  - name: k4
    shape_expr: '[ncomp, nx, ny]'
  - name: U_s2
    shape_expr: '[ncomp, nx, ny]'
  - name: U_s3
    shape_expr: '[ncomp, nx, ny]'
  - name: U_s4
    shape_expr: '[ncomp, nx, ny]'
  derived_field_rules:
  - name: ncomp
    rule: inputs.grid.ncomp of the case; first extent of every array state; passed
      as ncomp to the operation and to every rhs call.
  - name: nx
    rule: inputs.grid.nx of the case; second extent of every array state; passed as
      nx.
  - name: ny
    rule: inputs.grid.ny of the case; third extent of every array state; passed as
      ny.
  - name: U_n
    rule: 'the in dummy of the operation, bound to the state U: at each step the driver
      passes the state the last committed step left, initially initial_state.U.'
  - name: U_np1
    rule: 'the out dummy of the operation, bound to the same state U: the driver commits
      it into U only on a true guard_pass.'
  - name: rhs
    rule: the host-rendered procedure of the prototype dynamics_shallow_water_time_update_2d_rk4_rhs,
      dUdt = inputs.constants.lam * U elementwise (drive.step.arguments.rhs); it counts
      its calls into n_calls and stores the first four (t, U) in stage_t and stage_U1..4.
  - name: t
    rule: the driver time, t_start + step * dt, bound by the `time` binding.
  - name: dt
    rule: inputs.time.dt of the case (loop.dt); 0.0 and -0.1 on the two dt guard cases,
      whose first call the kernel refuses.
  invariants:
  - 'zero-tendency invariance: when rhs returns dUdt = 0 at every stage, U_np1 = U_n.'
  - 'stage sequence: exactly four rhs calls per accepted operation call, receiving
    stage times t, t + dt/2, t + dt/2, t + dt and stage states U_n, U_n + (dt/2) k1,
    U_n + (dt/2) k2, U_n + dt k3, in that order; no tendency is reused for another
    stage.'
  - 'one-step accuracy: for R(t,U) = lam*U, U_np1 = (1 + z + z^2/2 + z^3/6 + z^4/24)
    * U_n with z = lam*dt, up to round-off.'
  - 'input guard: dt <= 0, ncomp < 1, nx < 1 or ny < 1 gives guard_pass = false and
    no rhs call.'
  - 'prohibited: switching the integration method, changing the number of stages or
    the weights (1/6, 2/6, 2/6, 1/6), fewer than four rhs calls, reusing a stage tendency,
    evaluating rhs at another state or time, calling rhs when guard_pass is false,
    and computing a call through another call (detecting an axis-exchanged state and
    transforming the result back).'
  - the operation holds no non-differentiable operation of its own (ad_readiness enabled);
    differentiability is that of rhs.
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
  inputs:
  - name: ncomp
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: nx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: ny
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: t_start
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: dt
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: n_step
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: t_end
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: every
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: lam
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: U
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
  outputs:
  - name: U
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - U
  - name: guard_pass
    shape_expr: scalar
    evidence_ref: raw/state_snapshots
    raw_variables:
    - guard_pass
  raw_requirements:
    required_evidence:
    - artifact: state_snapshots
      required: true
      schema:
        variables:
        - name: U
          shape_expr: '[ncomp, nx, ny]'
        - name: guard_pass
          shape_expr: scalar
        - name: n_calls
          shape_expr: scalar
        - name: stage_t
          shape_expr: '[4]'
        - name: stage_U1
          shape_expr: '[ncomp, nx, ny]'
        - name: stage_U2
          shape_expr: '[ncomp, nx, ny]'
        - name: stage_U3
          shape_expr: '[ncomp, nx, ny]'
        - name: stage_U4
          shape_expr: '[ncomp, nx, ny]'
        time_variable: t
        time_shape_expr: scalar
        coordinates:
        - name: kc
          axis: 0
          count: inputs.grid.ncomp
          length: inputs.grid.ncomp
          placement: cell_center
        - name: xc
          axis: 1
          count: inputs.grid.nx
          length: inputs.grid.nx
          placement: cell_center
        - name: yc
          axis: 2
          count: inputs.grid.ny
          length: inputs.grid.ny
          placement: cell_center
    - artifact: state_history
    - artifact: step_series
      names:
      - step
      - U_min
      - U_max
      - stage_t_min
      - stage_t_max
      - stage_U1_min
      - stage_U1_max
      - stage_U2_min
      - stage_U2_max
      - stage_U3_min
      - stage_U3_max
      - stage_U4_min
      - stage_U4_max
  semantic_dependency:
    required_sources:
    - U
    - lam
    - t_start
    - dt
  tests:
  - test_id: l0_zero_rhs_invariance_pass
    expected_outcome: pass
    target_cases: &id003
    - l0_zero_rhs
    quantities:
    - call_count
    - guard_pass
    - run.n_step
    - stage_sequence
    - zero_rhs_invariance
  - test_id: l0_linear_ode_one_step_pass
    expected_outcome: pass
    target_cases: &id002
    - l0_linear_one_step
    - l0_linear_one_step_axis
    - l0_min_extent
    - l0_large_dt
    - l0_ncomp4
    quantities:
    - guard_pass
    - one_step_closed_form
    - run.n_step
  - test_id: l0_fourth_order_pass
    expected_outcome: pass
    target_cases: &id004
    - l0_linear_convergence_n10
    - l0_linear_convergence_n20
    quantities:
    - call_count
    - global_order
    - guard_pass
    - run.n_step
  - test_id: l0_stage_states_pass
    expected_outcome: pass
    target_cases: *id002
    quantities:
    - call_count
    - guard_pass
    - run.n_step
    - stage_sequence
  - test_id: l0_symmetry_pairs_pass
    expected_outcome: pass
    target_cases: &id006
    - l0_linear_one_step
    - l0_linear_one_step_axis
    quantities:
    - guard_pass
    - run.n_step
    - symmetry_pair
  - test_id: l0_invalid_dt_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_dt_zero
    quantities:
    - guard_pass
    - rhs_not_called_on_guard
  - test_id: l0_negative_dt_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_dt_negative
    quantities:
    - guard_pass
    - rhs_not_called_on_guard
  - test_id: l0_invalid_ncomp_xfail
    expected_outcome: xfail
    target_cases:
    - l0_ncomp0
    quantities:
    - guard_pass
    - rhs_not_called_on_guard
  - test_id: l0_invalid_nx_xfail
    expected_outcome: xfail
    target_cases:
    - l0_nx0
    quantities:
    - guard_pass
    - rhs_not_called_on_guard
  - test_id: l0_invalid_ny_xfail
    expected_outcome: xfail
    target_cases:
    - l0_ny0
    quantities:
    - guard_pass
    - rhs_not_called_on_guard
  predicates:
  - test_id: l0_zero_rhs_invariance_pass
    quantity: zero_rhs_invariance
    target_cases: *id003
    per_case: true
    expr: maxabs(final.U - initial.U)
    op: le
    value: 1.0e-12
  - test_id: l0_zero_rhs_invariance_pass
    quantity: run.n_step
    target_cases: *id003
    per_case: true
    expr: final.step - inputs.time.n_step
    op: eq
    value: 0
  - test_id: l0_zero_rhs_invariance_pass
    quantity: guard_pass
    target_cases: *id003
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_zero_rhs_invariance_pass
    quantity: call_count
    target_cases: *id003
    per_case: true
    expr: final.n_calls
    op: eq
    value: 4
  - test_id: l0_zero_rhs_invariance_pass
    quantity: stage_sequence
    target_cases: *id003
    per_case: true
    bind: &id005
      z: inputs.constants.lam * inputs.time.dt
    expr: max(maxabs(final.stage_t - inputs.expected.stage_t), maxabs(final.stage_U1
      - initial.U), maxabs(final.stage_U2 - (1 + z/2)*initial.U), maxabs(final.stage_U3
      - (1 + z/2 + z**2/4)*initial.U), maxabs(final.stage_U4 - (1 + z + z**2/2 + z**3/4)*initial.U))
    op: le
    value: 1.0e-12
  - test_id: l0_zero_rhs_invariance_pass
    quantity: cross_target_state_agreement
