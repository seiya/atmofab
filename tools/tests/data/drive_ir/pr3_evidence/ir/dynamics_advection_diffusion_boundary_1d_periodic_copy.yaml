  - case_id: l0_periodic_ng2
    inputs:
      grid:
        nx: 4
        ng: 2
        nx_total: 8
      test_profile_id: dynamics_advection_diffusion_boundary_1d_periodic_copy_l0
      test_profile_version: 0.5.0
    initial_state:
      u_in:
      - -999.0
      - -999.0
      - 0.3
      - 1.7
      - 0.2
      - 2.9
      - -999.0
      - -999.0
      u_out: -999.0
    derived:
      nx_total: inputs.grid.nx + 2 * inputs.grid.ng
  - case_id: l0_min_nx
    inputs:
      grid:
        nx: 2
        ng: 1
        nx_total: 4
      test_profile_id: dynamics_advection_diffusion_boundary_1d_periodic_copy_l0
      test_profile_version: 0.5.0
    initial_state:
      u_in:
      - -999.0
      - 0.3
      - 1.7
      - -999.0
      u_out: -999.0
    derived:
      nx_total: inputs.grid.nx + 2 * inputs.grid.ng
  - case_id: l0_large_nx
    inputs:
      grid:
        nx: 256
        ng: 1
        nx_total: 258
      test_profile_id: dynamics_advection_diffusion_boundary_1d_periodic_copy_l0
      test_profile_version: 0.5.0
    initial_state:
      u_in: max(0, min(1, (x + 0.5) - inputs.grid.ng)) * max(0, min(1, inputs.grid.ng + inputs.grid.nx + 1 - (x
