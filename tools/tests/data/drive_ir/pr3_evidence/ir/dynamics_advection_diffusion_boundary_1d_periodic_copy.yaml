    initial_state:
      u_in:
      - -999.0
      - 0.3
      - 1.7
      - 0.2
      - 2.9
      - -999.0
      u_out: -999.0
    derived:
      nx_total: inputs.grid.nx + 2 * inputs.grid.ng
  - case_id: l0_periodic_xmir
    inputs:
      grid:
        nx: 4
        ng: 1
        nx_total: 6
      test_profile_id: dynamics_advection_diffusion_boundary_1d_periodic_copy_l0
      test_profile_version: 0.5.0
    initial_state:
      u_in:
      - -999.0
      - 2.9
      - 0.2
      - 1.7
      - 0.3
      - -999.0
      u_out: -999.0
    derived:
