        - abs(y - inputs.topography.y_c_fraction * inputs.grid.L_y))) / (min(inputs.grid.L_x, inputs.grid.L_y)
        / 6)))
      hu: (inputs.constants.H_0 + inputs.initial.eta0 * sin(2 * pi * (x / inputs.grid.L_x - inputs.initial.shift_x_fraction))
        - (0.2 * inputs.constants.H_0 * max(0, 1 - sqrt(min(abs(x - inputs.topography.x_c_fraction * inputs.grid.L_x),
        inputs.grid.L_x - abs(x - inputs.topography.x_c_fraction * inputs.grid.L_x)) * min(abs(x - inputs.topography.x_c_fraction
        * inputs.grid.L_x), inputs.grid.L_x - abs(x - inputs.topography.x_c_fraction * inputs.grid.L_x))
        + min(abs(y - inputs.topography.y_c_fraction * inputs.grid.L_y), inputs.grid.L_y - abs(y - inputs.topography.y_c_fraction
        * inputs.grid.L_y)) * min(abs(y - inputs.topography.y_c_fraction * inputs.grid.L_y), inputs.grid.L_y
        - abs(y - inputs.topography.y_c_fraction * inputs.grid.L_y))) / (min(inputs.grid.L_x, inputs.grid.L_y)
        / 6)))) * (inputs.initial.wave_sign * (inputs.initial.eta0 * sqrt(inputs.constants.g * inputs.constants.H_0)
        / inputs.constants.H_0) * sin(2 * pi * (x / inputs.grid.L_x - inputs.initial.shift_x_fraction)))
      hv: 0.0
      z_b: 0.2 * inputs.constants.H_0 * max(0, 1 - sqrt(min(abs(x - inputs.topography.x_c_fraction * inputs.grid.L_x),
        inputs.grid.L_x - abs(x - inputs.topography.x_c_fraction * inputs.grid.L_x)) * min(abs(x - inputs.topography.x_c_fraction
        * inputs.grid.L_x), inputs.grid.L_x - abs(x - inputs.topography.x_c_fraction * inputs.grid.L_x))
        + min(abs(y - inputs.topography.y_c_fraction * inputs.grid.L_y), inputs.grid.L_y - abs(y - inputs.topography.y_c_fraction
        * inputs.grid.L_y)) * min(abs(y - inputs.topography.y_c_fraction * inputs.grid.L_y), inputs.grid.L_y
        - abs(y - inputs.topography.y_c_fraction * inputs.grid.L_y))) / (min(inputs.grid.L_x, inputs.grid.L_y)
        / 6))
      f: inputs.rotation.f0 + inputs.rotation.f_amp_x * sin(2 * pi * (x / inputs.grid.L_x - inputs.rotation.f_phase_x))
        + inputs.rotation.f_amp_y * sin(2 * pi * (y / inputs.grid.L_y - inputs.rotation.f_phase_y))
    derived:
      dx: inputs.grid.L_x / inputs.grid.nx
      dy: inputs.grid.L_y / inputs.grid.ny
      lam0: max((abs(initial.hu / initial.h) + sqrt(inputs.constants.g * initial.h)) / derived.dx + (abs(initial.hv
        / initial.h) + sqrt(inputs.constants.g * initial.h)) / derived.dy)
      dt_raw: inputs.dt_rule.dt_scale * inputs.dt_rule.cfl_target / derived.lam0
      n_step: ceil((inputs.time.t_end - inputs.time.t_start) / derived.dt_raw)
      dt: (inputs.time.t_end - inputs.time.t_start) / derived.n_step
