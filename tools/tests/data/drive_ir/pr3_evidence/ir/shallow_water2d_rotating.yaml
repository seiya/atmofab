  - test_id: l1_rotation_closed_form
    quantity: rotation.closed_form.final_rel
    target_cases:
    - swr_rot_n016_k1
    - swr_rot_n016_k4
    - swr_rot_n016_k4_rem3
    per_case: true
    bind:
      th: inputs.rotation.f0 * inputs.rotation.every * derived.dt
      a: 1 - th * th / 2 + th ** 4 / 24
      b: -th + th ** 3 / 6
      rho: sqrt(a * a + b * b)
      psi: atan2(b, a)
      u0: inputs.initial.mom_x0
      v0: inputs.initial.mom_y0
      w0: sqrt(u0 * u0 + v0 * v0)
      m: floor(derived.n_step / inputs.rotation.every)
      eu: rho ** m * (u0 * cos(m * psi) - v0 * sin(m * psi))
      ev: rho ** m * (u0 * sin(m * psi) + v0 * cos(m * psi))
    expr: max(maxabs(final.hu - eu), maxabs(final.hv - ev)) / w0
    op: le
    value: 1.0e-12
