  distribute:
    axes:
    - name: x
      cells: inputs.grid.nx
      min_block: 2
    - name: y
      cells: inputs.grid.ny
      min_block: 2
  step:
    operation: shallow_water2d_rotating__step
    result: ok
    arguments:
      nx: inputs.grid.nx
      ny: inputs.grid.ny
      dx: derived.dx
      dy: derived.dy
      g: inputs.constants.g
      dt: derived.dt
      t: time
      step: step
      rotation: inputs.rotation.on
      rotation_every: inputs.rotation.every
      f: state.f
      z_b: state.z_b
      h: state.h
      hu: state.hu
      hv: state.hv
      ok: state.ok
  loop:
    n_step: derived.n_step
    dt: derived.dt
    t_start: inputs.time.t_start
    t_end: inputs.time.t_end
  history:
    every: inputs.history.every
