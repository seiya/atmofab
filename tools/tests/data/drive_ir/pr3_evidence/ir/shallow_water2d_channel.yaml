    value: 1.0e-12
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: errors.repeat.hu_l2_rel
    case: chan_zrepeat_n032_dts100
    expr: norm2(final.hu - at('chan_tc2_ref_n032_dts100').final.hu) / max(norm2(at('chan_tc2_ref_n032_dts100').final.hu), norm2(at('chan_tc2_ref_n032_dts100').final.hv))
    op: le
    value: 1.0e-12
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: errors.repeat.hv_l2_rel
    case: chan_zrepeat_n032_dts100
    expr: norm2(final.hv - at('chan_tc2_ref_n032_dts100').final.hv) / max(norm2(at('chan_tc2_ref_n032_dts100').final.hu), norm2(at('chan_tc2_ref_n032_dts100').final.hv))
    op: le
    value: 1.0e-12
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: cross_target_state_agreement
    expr: maxabs(final.h - comparand.final.h) / max(maxabs(final.h), maxabs(comparand.final.h), 1.0)
    op: le
    value: 1.0e-10
    per_case: true
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: cross_target_state_agreement
    expr: maxabs(final.hu - comparand.final.hu) / max(maxabs(final.hu), maxabs(final.hv), maxabs(comparand.final.hu), maxabs(comparand.final.hv), 1.0)
    op: le
    value: 1.0e-10
    per_case: true
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: cross_target_state_agreement
    expr: maxabs(final.hv - comparand.final.hv) / max(maxabs(final.hu), maxabs(final.hv), maxabs(comparand.final.hu), maxabs(comparand.final.hv), 1.0)
    op: le
    value: 1.0e-10
    per_case: true
    target_cases: *id016
  - test_id: l0_boundary_refusal_xfail
    quantity: ok
    target_cases:
    - chan_tc2_ref_n032_dts100_badnx
    - chan_tc2_ref_n032_dts100_badny
    per_case: true
    expr: final.ok
    op: eq
    value: 0
  - test_id: l0_boundary_refusal_xfail
    quantity: init_ok
    expr: initial.init_ok
    op: eq
    value: 1
    per_case: true
    target_cases:
    - chan_tc2_ref_n032_dts100_badnx
    - chan_tc2_ref_n032_dts100_badny
