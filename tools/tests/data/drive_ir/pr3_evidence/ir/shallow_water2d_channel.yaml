    quantity: errors.initial_h.linf_rel
    target_cases:
    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_xmir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_xmir
