      Fr: f0 * (y / 2 - sin(2 * k * y) / (4 * k)) + beta * (y ** 2 / 4 - Lr * y / 4 - (y - Lr / 2) * sin(2 * k * y) / (4 * k) - (cos(2 * k * y) - 1) / (8 * k ** 2))
      Fc: f0 * (rc / 2 - sin(2 * k * rc) / (4 * k)) + beta * (rc ** 2 / 4 - Lr * rc / 4 - (rc - Lr / 2) * sin(2 * k * rc) / (4 * k) - (cos(2 * k * rc) - 1) / (8 * k ** 2))
      hbar: h0 - (Uj / g) * (Fr - Fc)
      ubar: Uj * sin(k * y) ** 2
      fr: f0 + beta * (y - Lr / 2)
      psi0: -0.03 * inputs.initial.gh0 / f0
      Rl: 2 * inputs.constants.a / 12.74244
      ctr: Uj * cos(inputs.constants.theta0)
      tt: '0.0'
      xi: pi * (x - Ls / 2 - ctr * tt) / Ls
      psi: psi0 * exp(-((Ls / pi) ** 2 * sin(xi) ** 2 + (y - rc) ** 2) / Rl ** 2)
      ps: -(Ls / (pi * Rl ** 2)) * sin(2 * xi) * psi
      pr: -(2 * (y - rc) / Rl ** 2) * psi
      hr: hbar + fr * psi / g
      ur: ubar - pr
      vr: ps
    expr: maxabs(initial.hu / initial.h - ur) / inputs.initial.u_jet
    op: le
    value: 1.0e-09
