drive:
  distribute:
    axes:
    - {name: x, cells: inputs.grid.nx, min_block: 2}
    - {name: y, cells: inputs.grid.ny, min_block: 2}
  init:
    operation: shallow_water2d_channel__init
    result: init_ok
    arguments:
      nx: inputs.grid.nx
      ny: inputs.grid.ny
      nx_g: derived.nx_g
      ny_g: derived.ny_g
      L_x: inputs.grid.L_x
      L_y: inputs.grid.L_y
      ng: inputs.grid.ng
      i0: block.x.first
      j0: block.y.first
      t_start: inputs.time.t_start
      t_end: inputs.time.t_end
      cfl_target: inputs.dt_rule.cfl_target
      dt_scale: inputs.dt_rule.dt_scale
      g: inputs.constants.g
      Omega: inputs.constants.Omega
      a: inputs.constants.a
      theta0: inputs.constants.theta0
      along_axis: inputs.boundary.along_axis
      flow_profile_id: inputs.initial.flow_profile_id
      zonal_sign: inputs.initial.zonal_sign
      gh0: inputs.initial.gh0
      eta0: inputs.initial.eta0
      shift_x_fraction: inputs.initial.shift_x_fraction
      u_jet: inputs.initial.u_jet
      h: state.h
      hu: state.hu
      hv: state.hv
      dt: state.dt
      n_step_plan: state.n_step_plan
      init_ok: state.init_ok
  step:
    operation: shallow_water2d_channel__step
    result: ok
    arguments:
      nx: inputs.grid.nx
      ny: inputs.grid.ny
      dt: state.dt
      t: time
      h: state.h
      hu: state.hu
      hv: state.hv
      ok: state.ok
  loop:
    n_step: state.n_step_plan
    dt: state.dt
    t_start: inputs.time.t_start
    t_end: inputs.time.t_end
  history:
    every: inputs.history.every
