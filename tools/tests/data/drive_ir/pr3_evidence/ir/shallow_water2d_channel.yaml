    expr: maxabs(final.hv - comparand.final.hv) / max(maxabs(final.hu), maxabs(final.hv), maxabs(comparand.final.hu), maxabs(comparand.final.hv), 1.0)
    op: le
    value: 1.0e-10
  - test_id: l0_init_refusal_xfail
    quantity: init_ok
    expr: initial.init_ok
    op: eq
    value: 0
    per_case: true
    target_cases:
    - chan_tc2_ref_n032_dts100_badprofile
    - chan_tc2_ref_n032_dts100_badaxis
    - chan_tc2_ref_n032_dts100_badng
    - chan_tc2_ref_n032_dts100_badzonal
    - chan_tc2_ref_n032_dts100_badomega
    - chan_tc2_ref_n032_dts100_badtheta
    - chan_tc2_ref_n032_dts100_baddepth
  - test_id: l0_wet_domain_refusal_xfail
    quantity: ok
    expr: final.ok
    op: eq
    value: 0
    per_case: true
    target_cases:
    - chan_dry_n032_dts800
  - test_id: l0_wet_domain_refusal_xfail
    quantity: run.state_moved
    expr: maxabs(final.h - initial.h)
    op: gt
    value: 0
    per_case: true
    target_cases:
    - chan_dry_n032_dts800
  - test_id: l0_forcing_refusal_xfail
    quantity: ok
    expr: final.ok
    op: eq
    value: 0
    per_case: true
    target_cases:
    - chan_tc4_ref_n032_dts100_badradius
  - test_id: l0_forcing_refusal_xfail
    quantity: init_ok
    expr: initial.init_ok
    op: eq
    value: 1
    per_case: true
    target_cases:
    - chan_tc4_ref_n032_dts100_badradius
  - test_id: l3_case_independence_repeat
    quantity: run.n_step
    expr: final.step - initial.n_step_plan
    op: eq
    value: 0
    per_case: true
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: init_ok
    expr: initial.init_ok
    op: eq
    value: 1
    per_case: true
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: init.n_step_plan
    bind:
      dx: inputs.grid.L_x / inputs.grid.nx
      dy: inputs.grid.L_y / inputs.grid.ny
      g: inputs.constants.g
      lam0: max((abs(initial.hu / initial.h) + sqrt(g * initial.h)) / dx + (abs(initial.hv / initial.h) + sqrt(g * initial.h)) / dy)
      dt_raw: inputs.dt_rule.dt_scale * inputs.dt_rule.cfl_target / lam0
      nst: ceil((inputs.time.t_end - inputs.time.t_start) / dt_raw)
    expr: abs(initial.n_step_plan - nst)
    op: le
    value: 0.5
    per_case: true
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: init.dt
    bind:
      dx: inputs.grid.L_x / inputs.grid.nx
      dy: inputs.grid.L_y / inputs.grid.ny
      g: inputs.constants.g
      lam0: max((abs(initial.hu / initial.h) + sqrt(g * initial.h)) / dx + (abs(initial.hv / initial.h) + sqrt(g * initial.h)) / dy)
      dt_raw: inputs.dt_rule.dt_scale * inputs.dt_rule.cfl_target / lam0
      nst: ceil((inputs.time.t_end - inputs.time.t_start) / dt_raw)
      dt_rule: (inputs.time.t_end - inputs.time.t_start) / nst
    expr: abs(initial.dt - dt_rule) / dt_rule
    op: le
    value: 1.0e-12
    per_case: true
    target_cases: *id016
  - test_id: l3_case_independence_repeat
    quantity: errors.repeat.h_l2_rel
    case: chan_zrepeat_n032_dts100
    expr: norm2(final.h - at('chan_tc2_ref_n032_dts100').final.h) / norm2(at('chan_tc2_ref_n032_dts100').final.h)
