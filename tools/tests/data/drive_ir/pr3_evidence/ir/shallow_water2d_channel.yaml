    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_ymir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_ymir
    - chan_tc4_ref_n064_dts100
    - chan_tc4_ref_n064_dts100_ymir
    - chan_tc2_xpert_n064_dts100
    - chan_tc2_xpert_n064_dts100_ymir
    case: chan_tc2_xpert_n064_dts100_ymir
    bind:
      g: inputs.constants.g
      dx: inputs.grid.L_x / inputs.grid.nx
      dy: inputs.grid.L_y / inputs.grid.ny
      lam0: max((abs(initial.hu / initial.h) + sqrt(g * initial.h)) / dx + (abs(initial.hv / initial.h) + sqrt(g * initial.h)) / dy)
      lam1: max((abs(final.hu / final.h) + sqrt(g * final.h)) / dx + (abs(final.hv / final.h) + sqrt(g * final.h)) / dy)
    expr: initial.dt * max(lam0, lam1)
    op: le
    value: 1.0
  - test_id: l3_cross_channel_mirror_pairs
    quantity: cfl.max
    target_cases:
    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_ymir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_ymir
    - chan_tc4_ref_n064_dts100
    - chan_tc4_ref_n064_dts100_ymir
    - chan_tc2_xpert_n064_dts100
    - chan_tc2_xpert_n064_dts100_ymir
    case: chan_tc2_xpert_n064_dts100_ymir
    expr: initial.dt * max(smax((abs(history.hu / history.h) + sqrt(g * history.h)) / dx + (abs(history.hv / history.h) + sqrt(g * history.h)) / dy))
    op: le
    value: 1.0
    bind:
      dx: inputs.grid.L_x / inputs.grid.nx
      dy: inputs.grid.L_y / inputs.grid.ny
      g: inputs.constants.g
  - test_id: l3_cross_channel_mirror_pairs
    quantity: extrema.h.min
    target_cases:
    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_ymir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_ymir
    - chan_tc4_ref_n064_dts100
    - chan_tc4_ref_n064_dts100_ymir
    - chan_tc2_xpert_n064_dts100
    - chan_tc2_xpert_n064_dts100_ymir
    case: chan_tc2_xpert_n064_dts100_ymir
    expr: min(min(initial.h), min(final.h))
    op: ge
    value: 1000.0
  - test_id: l3_cross_channel_mirror_pairs
    quantity: extrema.h.min
    target_cases:
    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_ymir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_ymir
    - chan_tc4_ref_n064_dts100
    - chan_tc4_ref_n064_dts100_ymir
    - chan_tc2_xpert_n064_dts100
    - chan_tc2_xpert_n064_dts100_ymir
    case: chan_tc2_xpert_n064_dts100_ymir
    expr: min(series.h_min)
    op: ge
    value: 1000.0
  - test_id: l3_cross_channel_mirror_pairs
    quantity: metrics.mass_drift_rel
    target_cases:
    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_ymir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_ymir
    - chan_tc4_ref_n064_dts100
    - chan_tc4_ref_n064_dts100_ymir
    - chan_tc2_xpert_n064_dts100
    - chan_tc2_xpert_n064_dts100_ymir
    case: chan_tc2_xpert_n064_dts100_ymir
    bind:
      dA: (inputs.grid.L_x / inputs.grid.nx) * (inputs.grid.L_y / inputs.grid.ny)
      M0: sum(initial.h) * dA
      M1: sum(final.h) * dA
    expr: abs(M1 - M0) / max(abs(M0), 1e-14)
    op: le
    value: 1.0e-10
  - test_id: l3_cross_channel_mirror_pairs
    quantity: cross_target_state_agreement
    target_cases:
    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_ymir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_ymir
    - chan_tc4_ref_n064_dts100
    - chan_tc4_ref_n064_dts100_ymir
    - chan_tc2_xpert_n064_dts100
    - chan_tc2_xpert_n064_dts100_ymir
    case: chan_tc2_xpert_n064_dts100_ymir
    expr: maxabs(final.h - comparand.final.h) / max(maxabs(final.h), maxabs(comparand.final.h), 1.0)
    op: le
    value: 1.0e-10
  - test_id: l3_cross_channel_mirror_pairs
    quantity: cross_target_state_agreement
    target_cases:
    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_ymir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_ymir
    - chan_tc4_ref_n064_dts100
    - chan_tc4_ref_n064_dts100_ymir
    - chan_tc2_xpert_n064_dts100
    - chan_tc2_xpert_n064_dts100_ymir
    case: chan_tc2_xpert_n064_dts100_ymir
    expr: maxabs(final.hu - comparand.final.hu) / max(maxabs(final.hu), maxabs(final.hv), maxabs(comparand.final.hu), maxabs(comparand.final.hv), 1.0)
    op: le
    value: 1.0e-10
  - test_id: l3_cross_channel_mirror_pairs
    quantity: cross_target_state_agreement
    target_cases:
    - chan_tc2_ref_n064_dts100
    - chan_tc2_ref_n064_dts100_ymir
    - chan_tc3_ref_n064_dts100
    - chan_tc3_ref_n064_dts100_ymir
    - chan_tc4_ref_n064_dts100
    - chan_tc4_ref_n064_dts100_ymir
    - chan_tc2_xpert_n064_dts100
    - chan_tc2_xpert_n064_dts100_ymir
