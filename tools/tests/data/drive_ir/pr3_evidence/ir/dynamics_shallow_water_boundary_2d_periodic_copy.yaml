algorithm:
  algorithm_id: shallow_water_boundary_periodic_copy
  execution_mode: conditional
  steps:
  - step_id: step_01_grid_guard
    step_kind: diagnostic
    operation_ref: grid_guard
    inputs:
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    outputs:
    - grid_valid
    description: "Input guard of controlled_spec \xA74. grid_valid = (nx >= 2) .and. (ny >= 2) .and. (ng >= 1).\
      \ nx < 2, ny < 2 or ng < 1 is invalid input and an error: grid_valid is set false and the operation returns\
      \ WITHOUT running steps 02-04 (no fallback to any non-periodic mapping; the content of U_out on a rejected\
      \ input is not defined by the spec). On valid input grid_valid is set true and steps 02-04 run. The grid values\
      \ come per case from inputs.grid; they fix the interior ranges i = ng+1..ng+nx, j = ng+1..ng+ny and the padded\
      \ extents of U_in / U_out (nx_total x ny_total). l0_invalid_ny (ny = 1), l0_invalid_nx (nx = 1) and l0_invalid_ng\
      \ (ng = 0) are each rejected on that one input."
  - step_id: step_02_interior_copy
    step_kind: pointwise_process
    operation_ref: interior_copy
    inputs:
    - U_in
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    outputs:
    - U_out
    description: U_out(i,j) = U_in(i,j) for every interior cell i = ng+1..ng+nx, j = ng+1..ng+ny (1-based indices
      into the nx_total x ny_total padded arrays). U_in is intent(in) and is never written; U_out is a separate
      array.
  - step_id: step_03_periodic_wrap_x
    step_kind: boundary_apply
    operation_ref: periodic_wrap_x
    inputs:
    - U_in
    - nx
    - ny
    - ng
    - U_out
    outputs:
    - U_out
    description: "x-direction periodic ghost mapping (applied FIRST, controlled_spec \xA73). For every interior\
      \ ROW j = ng+1..ng+ny (the row loop is bounded by ny, the y extent \u2014 never by nx) and every k = 1..ng:\
      \ left ghost column U_out(k,j) = U_in(k+nx, j); right ghost column U_out(ng+nx+k, j) = U_in(ng+k, j). The\
      \ source column is the periodic image of the ghost column in the interior of period nx along the FIRST array\
      \ index; the mapping is done along that index itself (no transpose of the field, no recognition of a transposed\
      \ / reversed input mapped through another call)."
  - step_id: step_04_periodic_wrap_y
    step_kind: boundary_apply
    operation_ref: periodic_wrap_y
    inputs:
    - U_out
    - nx_total
    - ny
    - ng
    outputs:
    - U_out
    description: 'y-direction periodic ghost mapping (applied SECOND, after step_03). For every column i = 1..nx_total
      (the x ghost columns included) and every k = 1..ng: bottom ghost row U_out(i,k) = U_out(i,k+ny); top ghost
      row U_out(i,ng+ny+k) = U_out(i,ng+k), reading the rows of U_out that step_02/03 completed. Equivalently U_out(i,k)
      = U_in(p(i),k+ny) and U_out(i,ng+ny+k) = U_in(p(i),ng+k) with the column map p (derived_field_rules), so a
      corner ghost cell holds the periodic image of the interior along both axes and, after this step, every cell
      of U_out has been written. Mapped along the SECOND array index itself.'
  ordering:
  - step_01_grid_guard
  - step_02_interior_copy
  - step_03_periodic_wrap_x
  - step_04_periodic_wrap_y
  control_condition: step_01_grid_guard always runs; steps 02-04 run, in this order, only when grid_valid is true
    (nx >= 2 and ny >= 2 and ng >= 1); otherwise the operation returns with grid_valid = false.
  iteration_contract: {}
  update_semantics:
    target_variables:
    - U_out
    - grid_valid
    update_order: sequential
    notes: U_in is read-only (intent in); U_out is written only on valid input, in the order interior, x ghosts,
      y ghosts.
  temporaries:
  - name: i
    shape_expr: scalar
  - name: j
    shape_expr: scalar
  - name: k
    shape_expr: scalar
  derived_field_rules:
  - name: nx_total
    rule: padded x extent supplied by the case (inputs.grid.nx_total); in every case nx_total = nx + 2*ng. It is
      the first-axis extent of U_in and U_out.
  - name: ny_total
    rule: padded y extent supplied by the case (inputs.grid.ny_total); in every case ny_total = ny + 2*ng. It is
      the second-axis extent of U_in and U_out.
  - name: p
    rule: 'column map used by the y wrap: p(i) = i for an interior column i = ng+1..ng+nx; p(k) = k+nx and p(ng+nx+k)
      = ng+k for the x ghost columns, k = 1..ng.'
  invariants:
  - grid_valid is false exactly when nx < 2 or ny < 2 or ng < 1; then no mapping step runs.
  - 'On valid input every cell of U_out is written: interior = U_in interior, x ghosts on interior rows from step_03,
    all y ghost rows (corners included) from step_04.'
  - U_in is never modified; U_in and U_out are separate arrays (no in-place form).
  - No automatic fallback to a non-periodic boundary.
  - Each call maps its own arguments along each axis by that axis's own index; a call is never computed through
    another call (no detecting a transposed or reversed input and mapping a base field then transforming back).
  - "The published procedure header carries no prefix the \xA75.1 block does not declare (e.g. no pure/elemental\
    \ marker)."
  - 'AD readiness: the periodic index wrap is an explicit discrete copy operation.'
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
  inputs:
  - name: nx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: ny
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: ng
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: nx_total
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: ny_total
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: U_in
    shape_expr: '[nx_total, ny_total]'
    evidence_ref: raw/state_snapshots
  outputs:
  - name: U_out
    shape_expr: '[nx_total, ny_total]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - U_out
  - name: grid_valid
    shape_expr: scalar
    evidence_ref: raw/state_snapshots
    raw_variables:
    - grid_valid
  raw_requirements:
    required_evidence:
    - artifact: state_snapshots
      required: true
      schema:
        variables:
        - name: U_in
          shape_expr: '[nx_total, ny_total]'
        - name: U_out
          shape_expr: '[nx_total, ny_total]'
        - name: grid_valid
          shape_expr: scalar
        time_variable: t
        time_shape_expr: scalar
        coordinates:
        - name: x
          axis: 0
          count: inputs.grid.nx_total
          length: inputs.grid.nx_total
          placement: cell_center
        - name: y
          axis: 1
          count: inputs.grid.ny_total
          length: inputs.grid.ny_total
          placement: cell_center
  semantic_dependency:
    required_sources:
    - U_in
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
  tests:
  - test_id: l0_periodic_x_wrap_pass
    expected_outcome: pass
    target_cases: &id001
    - l0_ng1
    - l0_ng1_axis
    - l0_ng1_xmir
    - l0_ng1_ymir
    - l0_ng2
    - l0_min_grid
    - l0_large_grid
    quantities:
    - grid_valid
    - x_wrap_residual
  - test_id: l0_periodic_y_wrap_pass
    expected_outcome: pass
    target_cases: *id001
    quantities:
    - grid_valid
    - y_wrap_residual
  - test_id: l0_symmetry_pairs_pass
    expected_outcome: pass
    target_cases:
    - l0_ng1
    - l0_ng1_axis
    - l0_ng1_xmir
    - l0_ng1_ymir
    quantities:
    - grid_valid
    - pair_residual
  - test_id: l0_invalid_ny_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_ny
    quantities:
    - grid_valid
  - test_id: l0_invalid_nx_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_nx
    quantities:
    - grid_valid
  - test_id: l0_invalid_ng_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_ng
    quantities:
    - grid_valid
  predicates:
  - test_id: l0_periodic_x_wrap_pass
    quantity: grid_valid
    target_cases:
    - l0_ng1
    - l0_ng1_axis
    - l0_ng1_xmir
    - l0_ng1_ymir
    - l0_ng2
    - l0_min_grid
    - l0_large_grid
    per_case: true
    expr: final.grid_valid
    op: eq
    value: 1.0
  - test_id: l0_periodic_x_wrap_pass
    quantity: x_wrap_residual
    target_cases:
    - l0_ng1
    - l0_ng1_axis
    - l0_ng1_xmir
    - l0_ng1_ymir
    - l0_ng2
    - l0_min_grid
    - l0_large_grid
    per_case: true
    bind:
      mL: min(max(inputs.grid.ng - x + 0.5, 0), 1)
      mI: min(max(inputs.grid.ng + inputs.grid.nx - x + 0.5, 0), 1) - mL
      mR: 1 - mL - mI
      mJ: min(max(inputs.grid.ng + inputs.grid.ny - y + 0.5, 0), 1) - min(max(inputs.grid.ng - y + 0.5, 0), 1)
      rL: final.U_out - roll(initial.U_in, -inputs.grid.nx, 0)
      rI: final.U_out - initial.U_in
      rR: final.U_out - roll(initial.U_in, inputs.grid.nx, 0)
    expr: maxabs(mJ * (mL * rL + mI * rI + mR * rR))
    op: eq
    value: 0.0
  - test_id: l0_periodic_x_wrap_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_ng1
    - l0_ng1_axis
    - l0_ng1_xmir
    - l0_ng1_ymir
    - l0_ng2
    - l0_min_grid
    - l0_large_grid
    per_case: true
    expr: maxabs(final.U_out - comparand.final.U_out) / max(maxabs(final.U_out), maxabs(comparand.final.U_out),
      1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_periodic_y_wrap_pass
    quantity: grid_valid
    target_cases:
    - l0_ng1
    - l0_ng1_axis
    - l0_ng1_xmir
    - l0_ng1_ymir
    - l0_ng2
    - l0_min_grid
    - l0_large_grid
    per_case: true
    expr: final.grid_valid
    op: eq
    value: 1.0
  - test_id: l0_periodic_y_wrap_pass
    quantity: y_wrap_residual
    target_cases:
    - l0_ng1
    - l0_ng1_axis
    - l0_ng1_xmir
    - l0_ng1_ymir
    - l0_ng2
    - l0_min_grid
    - l0_large_grid
    per_case: true
    bind:
      mL: min(max(inputs.grid.ng - x + 0.5, 0), 1)
      mI: min(max(inputs.grid.ng + inputs.grid.nx - x + 0.5, 0), 1) - mL
      mR: 1 - mL - mI
      mB: min(max(inputs.grid.ng - y + 0.5, 0), 1)
      mT: 1 - min(max(inputs.grid.ng + inputs.grid.ny - y + 0.5, 0), 1)
      PU: mL * roll(initial.U_in, -inputs.grid.nx, 0) + mI * initial.U_in + mR * roll(initial.U_in, inputs.grid.nx,
        0)
    expr: maxabs(mB * (final.U_out - roll(PU, 0, -inputs.grid.ny)) + mT * (final.U_out - roll(PU, 0, inputs.grid.ny)))
    op: eq
    value: 0.0
  - test_id: l0_periodic_y_wrap_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_ng1
    - l0_ng1_axis
    - l0_ng1_xmir
    - l0_ng1_ymir
    - l0_ng2
    - l0_min_grid
    - l0_large_grid
    per_case: true
