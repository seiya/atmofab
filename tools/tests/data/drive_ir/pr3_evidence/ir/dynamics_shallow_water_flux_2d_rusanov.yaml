algorithm:
  algorithm_id: shallow_water_rusanov_interface_flux
  execution_mode: sequence
  description: One pointwise call of dynamics_shallow_water_flux_2d_rusanov__compute_flux evaluates, for one x-interface (left
    state U_L, right state U_R) and one y-interface (bottom state U_B, top state U_T), each a conserved vector U = [h, hu,
    hv] (1-based components 1..3), the Rusanov numerical fluxes F_star (x) and G_star (y), the Rusanov wave speeds a_x, a_y
    and the logical guard_ok. The call runs once; there is no time loop, no reconstruction, no boundary condition and no time
    integration. The supplied states are used exactly as given.
  steps:
  - step_id: step_01_input_guard
    step_kind: pointwise_process
    operation_ref: dry_state_input_guard
    inputs:
    - U_L
    - U_R
    - U_B
    - U_T
    outputs:
    - guard_ok
    description: guard_ok = (U_L(1) > 0) and (U_R(1) > 0) and (U_B(1) > 0) and (U_T(1) > 0), i.e. h <= 0 in ANY of the four
      supplied states (h == 0 as well as h < 0) is invalid input. This test is evaluated FIRST, before any division by h anywhere
      in the operation. Every one of the four states is tested; the comparison is strictly h > 0 for validity (neither h <
      0 nor h == 0 alone).
  - step_id: step_02_rejected_output_fill
    step_kind: pointwise_process
    operation_ref: rejected_input_zero_outputs
    inputs:
    - guard_ok
    outputs:
    - F_star
    - G_star
    - a_x
    - a_y
    description: 'Executed only when guard_ok is false: set F_star = [0, 0, 0], G_star = [0, 0, 0], a_x = 0, a_y = 0 (exact
      zeros, every component), and return immediately without evaluating steps 03-06. The zeros are the published observable
      consequence of a rejected input, not a valid flux.'
  - step_id: step_03_side_speeds
    step_kind: pointwise_process
    operation_ref: side_normal_velocity_and_celerity
    inputs:
    - U_L
    - U_R
    - U_B
    - U_T
    - g
    outputs:
    - u_L
    - u_R
    - v_B
    - v_T
    - c_L
    - c_R
    - c_B
    - c_T
    description: 'Executed only when guard_ok is true. Each from the state on its own side: u_L = U_L(2)/U_L(1), u_R = U_R(2)/U_R(1)
      (x-normal velocity, from hu), v_B = U_B(3)/U_B(1), v_T = U_T(3)/U_T(1) (y-normal velocity, from hv), and the gravity-wave
      celerity c_S = sqrt(g * U_S(1)) for S in {L, R, B, T}. g is the case input constants.g (gravitational acceleration,
      m s^-2), passed as the operation''s argument g.'
  - step_id: step_04_wave_speeds
    step_kind: pointwise_process
    operation_ref: rusanov_wave_speed
    inputs:
    - u_L
    - u_R
    - v_B
    - v_T
    - c_L
    - c_R
    - c_B
    - c_T
    outputs:
    - a_x
    - a_y
    description: 'a_x = max(abs(u_L) + c_L, abs(u_R) + c_R) and a_y = max(abs(v_B) + c_B, abs(v_T) + c_T): the maximum of
      the two PER-SIDE sums, one scalar per interface, the same for all three flux components, non-negative by construction.
      Forbidden alternatives: u + c without the absolute value, the minimum of the sides, the sum of the two maxima max(|u_L|,|u_R|)
      + max(c_L,c_R), a per-component speed, or any other estimate. max and abs are explicit non-differentiable operations
      (AD readiness).'
  - step_id: step_05_physical_fluxes
    step_kind: flux_compute
    operation_ref: shallow_water_physical_flux
    inputs:
    - U_L
    - U_R
    - U_B
    - U_T
    - g
    outputs:
    - F_L
    - F_R
    - G_B
    - G_T
    description: 'For U = [h, hu, hv]: F(U) = [hu, hu*hu/h + g*h*h/2, hu*hv/h] and G(U) = [hv, hu*hv/h, hv*hv/h + g*h*h/2].
      F_L = F(U_L), F_R = F(U_R), G_B = G(U_B), G_T = G(U_T), each evaluated at the supplied state itself. The pressure term
      is g*h^2/2 (not g*h^2, not g*h) and sits in the hu component of F and the hv component of G; the x flux uses hu^2/h
      in its hu component, the y flux uses hu*hv/h in its hu component.'
  - step_id: step_06_rusanov_flux
    step_kind: flux_compute
    operation_ref: rusanov_numerical_flux
    inputs:
    - F_L
    - F_R
    - G_B
    - G_T
    - U_L
    - U_R
    - U_B
    - U_T
    - a_x
    - a_y
    outputs:
    - F_star
    - G_star
    description: 'Component-wise for k = 1..3: F_star(k) = 0.5*(F_L(k) + F_R(k)) - 0.5*a_x*(U_R(k) - U_L(k)) and G_star(k)
      = 0.5*(G_B(k) + G_T(k)) - 0.5*a_y*(U_T(k) - U_B(k)). The dissipation sign is minus; the x flux is dissipated with a_x
      and the y flux with a_y. Output ordering [h, hu, hv] aligned with U. With equal states the result equals the physical
      flux exactly: F_star(U,U) = F(U), G_star(U,U) = G(U). Evaluating both fluxes with one routine written in (h, normal,
      tangential) components is permitted provided each interface''s own two states are passed and the result is put back
      in [h, hu, hv] order.'
  ordering:
  - step_01_input_guard
  - step_02_rejected_output_fill
  - step_03_side_speeds
  - step_04_wave_speeds
  - step_05_physical_fluxes
  - step_06_rusanov_flux
  control_condition: 'After step_01_input_guard: if guard_ok is false, run step_02_rejected_output_fill and return (outputs
    all zero, guard_ok false). If guard_ok is true, skip step_02 and run step_03 through step_06 in order, returning guard_ok
    true.'
  iteration_contract: {}
  update_semantics:
    target_variables:
    - F_star
    - G_star
    - a_x
    - a_y
    - guard_ok
    update_order: sequential
    description: Every output argument (F_star, G_star, a_x, a_y, guard_ok) is assigned on every path. The input states U_L,
      U_R, U_B, U_T are intent(in) and are never modified.
  temporaries:
  - name: u_L
    shape_expr: scalar
  - name: u_R
    shape_expr: scalar
  - name: v_B
    shape_expr: scalar
  - name: v_T
    shape_expr: scalar
  - name: c_L
    shape_expr: scalar
  - name: c_R
    shape_expr: scalar
  - name: c_B
    shape_expr: scalar
  - name: c_T
    shape_expr: scalar
  - name: F_L
    shape_expr: '[3]'
  - name: F_R
    shape_expr: '[3]'
  - name: G_B
    shape_expr: '[3]'
  - name: G_T
    shape_expr: '[3]'
  derived_field_rules:
  - name: u_L
    rule: u_L = U_L(2) / U_L(1); likewise u_R = U_R(2) / U_R(1), v_B = U_B(3) / U_B(1), v_T = U_T(3) / U_T(1), only after
      guard_ok is true
  - name: c_L
    rule: c_S = sqrt(g * U_S(1)) for each side S in {L, R, B, T} (c_L, c_R, c_B, c_T), g the operation argument taken from
      case input constants.g
  - name: F_L
    rule: F(U) = [U(2), U(2)**2 / U(1) + g * U(1)**2 / 2, U(2) * U(3) / U(1)]; F_L = F(U_L), F_R = F(U_R)
  - name: G_B
    rule: G(U) = [U(3), U(2) * U(3) / U(1), U(3)**2 / U(1) + g * U(1)**2 / 2]; G_B = G(U_B), G_T = G(U_T)
  invariants:
  - The guard (h <= 0 in any of U_L, U_R, U_B, U_T means invalid) is evaluated before any division by h.
  - On a rejected input guard_ok is false and every component of F_star and G_star and both a_x and a_y are exactly 0.
  - a_x >= 0 and a_y >= 0 whenever guard_ok is true (maximum of sums of an absolute value and a square root).
  - 'F_star(U, U) = F(U) and G_star(U, U) = G(U): the dissipation term vanishes for equal states.'
  - 'Forbidden: reconstructing, limiting or modifying the supplied states; evaluating a flux at any state other than the two
    supplied for its interface; replacing the Rusanov wave speed by another estimate.'
  - 'Forbidden: computing a call through another call - recognising the supplied states as an axis exchange or mirror of another
    configuration, computing that configuration''s fluxes and transforming them back.'
  - The operation is pointwise per interface; any vectorisation over a grid is the caller's responsibility. No boundary condition
    is applied.
  - The published subroutine header carries no procedure prefix (e.g. no pure/elemental) beyond what the signature declares.
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
