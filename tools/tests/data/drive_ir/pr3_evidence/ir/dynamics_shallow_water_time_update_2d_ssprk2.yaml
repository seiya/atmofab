schema_version: '1.0'
meta:
  node_key: component/dynamics_shallow_water_time_update_2d_ssprk2@0.4.1
  spec_kind: component
  spec_id: dynamics_shallow_water_time_update_2d_ssprk2
  spec_version: 0.4.1
  source_refs:
    controlled_spec: spec/component/dynamics/shallow_water/dynamics_shallow_water_time_update_2d_ssprk2/controlled_spec.md
    tests: spec/component/dynamics/shallow_water/dynamics_shallow_water_time_update_2d_ssprk2/tests.md
    deps: spec/component/dynamics/shallow_water/dynamics_shallow_water_time_update_2d_ssprk2/deps.yaml
case:
  description: Fourteen fixed L0 cases, no sweep and no refinement. The driver holds the state U_n, L_flux, S_b, z_b, U_np1
    and guard_pass; a coordinate kc, xc, yc is the 0-based index + 0.5 along its axis, so c = kc + 0.5, i = xc + 0.5, j =
    yc + 0.5. z_b is declared by the coefficients inputs.initial.z_b.{a0,a_i,a_j}.
  test_case_set:
  - case_id: l0_dt0
    inputs:
      grid: &id003
        ncomp: 3
        nx: 4
        ny: 3
        dx: 0.5
        dy: 0.25
      time:
        dt: 0.0
      initial:
        z_b: &id001
          a0: 0.0
          a_i: 0.1
          a_j: 0.05
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: &id002
      U_n: 1 + 0.5*(kc + 0.5) + 0.1*(xc + 0.5) - 0.2*(yc + 0.5)
      L_flux: 0.01*(kc + 0.5) + 0.02*(xc + 0.5) - 0.03*(yc + 0.5)
      S_b: 0.02 + 0.005*(kc + 0.5) - 0.004*(xc + 0.5) + 0.001*(yc + 0.5)
      z_b: inputs.initial.z_b.a0 + inputs.initial.z_b.a_i*(xc + 0.5) + inputs.initial.z_b.a_j*(yc + 0.5)
      U_np1: -999.0
  - case_id: l0_dx0
    inputs:
      grid:
        ncomp: 3
        nx: 4
        ny: 3
        dx: 0.0
        dy: 0.25
      time:
        dt: 0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_dx_neg
    inputs:
      grid:
        ncomp: 3
        nx: 4
        ny: 3
        dx: -0.5
        dy: 0.25
      time:
        dt: 0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_dy0
    inputs:
      grid:
        ncomp: 3
        nx: 4
        ny: 3
        dx: 0.5
        dy: 0.0
      time:
        dt: 0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_dy_neg
    inputs:
      grid:
        ncomp: 3
        nx: 4
        ny: 3
        dx: 0.5
        dy: -0.25
      time:
        dt: 0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_frozen_rhs
    inputs:
      grid: *id003
      time:
        dt: 0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_frozen_rhs_axis
    inputs:
      grid:
        ncomp: 3
        nx: 3
        ny: 4
        dx: 0.25
        dy: 0.5
      time:
        dt: 0.1
      initial:
        z_b:
          a0: 0.0
          a_i: 0.05
          a_j: 0.1
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state:
      U_n: 1 + 0.5*(((kc - 1.5) * (kc - 2.5) / 2) * 1 + ((kc - 0.5) * (2.5 - kc)) * 3 + ((kc - 0.5) * (kc - 1.5) / 2) * 2)
        + 0.1*(yc + 0.5) - 0.2*(xc + 0.5)
      L_flux: 0.01*(((kc - 1.5) * (kc - 2.5) / 2) * 1 + ((kc - 0.5) * (2.5 - kc)) * 3 + ((kc - 0.5) * (kc - 1.5) / 2) * 2)
        + 0.02*(yc + 0.5) - 0.03*(xc + 0.5)
      S_b: 0.02 + 0.005*(((kc - 1.5) * (kc - 2.5) / 2) * 1 + ((kc - 0.5) * (2.5 - kc)) * 3 + ((kc - 0.5) * (kc - 1.5) / 2)
        * 2) - 0.004*(yc + 0.5) + 0.001*(xc + 0.5)
      z_b: inputs.initial.z_b.a0 + inputs.initial.z_b.a_i*(xc + 0.5) + inputs.initial.z_b.a_j*(yc + 0.5)
      U_np1: -999.0
  - case_id: l0_invalid_dt
    inputs:
      grid: *id003
      time:
        dt: -0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_ncomp4
    inputs:
      grid:
        ncomp: 4
        nx: 4
        ny: 3
        dx: 0.5
        dy: 0.25
      time:
        dt: 0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_small_step
    inputs:
      grid:
        ncomp: 3
        nx: 4
        ny: 3
        dx: 0.015625
        dy: 0.015625
      time:
        dt: 0.001
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_stage_weight
    inputs:
      grid: *id003
      time:
        dt: 0.05
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_zb_invariance
    inputs:
      grid: *id003
      time:
        dt: 0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_zb_invariance_zb2
    inputs:
      grid: *id003
      time:
        dt: 0.1
      initial:
        z_b:
          a0: 0.5
          a_i: -0.2
          a_j: 0.3
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state: *id002
  - case_id: l0_zero_rhs
    inputs:
      grid: *id003
      time:
        dt: 0.1
      initial:
        z_b: *id001
      test_profile_id: dynamics_shallow_water_time_update_2d_ssprk2_l0
      test_profile_version: 0.7.0
    initial_state:
      U_n: 1 + 0.5*(kc + 0.5) + 0.1*(xc + 0.5) - 0.2*(yc + 0.5)
      L_flux: 0.0
      S_b: 0.0
      z_b: inputs.initial.z_b.a0 + inputs.initial.z_b.a_i*(xc + 0.5) + inputs.initial.z_b.a_j*(yc + 0.5)
      U_np1: -999.0
algorithm:
  algorithm_id: shallow_water_time_update_ssprk2_l0
  execution_mode: sequence
  description: 'One call of the published operation dynamics_shallow_water_time_update_2d_ssprk2__advance advances U^n by
    one SSPRK2 step of size dt with the caller-supplied FIXED fields L_flux and S_b (L0 realization). General form: U1 = U^n
    + dt*(L_flux(U^n) + S_b(U^n,z_b)); U^{n+1} = 1/2 U^n + 1/2 (U1 + dt*(L_flux(U1) + S_b(U1,z_b))). At L0 L_flux and S_b
    are NOT recomputed at the stage state: both stages use the identical rhs = L_flux + S_b, so the composition reduces to
    U^{n+1} = U^n + dt*(L_flux + S_b). z_b is accepted and inert. All arrays are indexed (c, i, j) with c = 1..ncomp, i =
    1..nx, j = 1..ny; every loop over cells is bounded by the extent of its own axis (i by nx, j by ny, c by ncomp) and covers
    the whole array, in every stage.'
  steps:
  - step_id: step_01_input_guard
    step_kind: diagnostic
    operation_ref: input_guard
    inputs:
    - dt
    - dx
    - dy
    outputs:
    - guard_pass
    description: 'guard_pass = (dt > 0) and (dx > 0) and (dy > 0). When guard_pass is false (dt <= 0 or dx <= 0 or dy <= 0)
      the input is invalid: the operation returns at once with guard_pass = false and performs no update (steps 02-04 are
      skipped; U_np1 is not defined by the spec on that path). dx and dy enter the operation only here. guard_pass is the
      logical output argument of the operation, assigned on every path.'
  - step_id: step_02_stage_rhs
    step_kind: source_term
    operation_ref: ssprk2_stage_rhs
    inputs:
    - L_flux
    - S_b
    - ncomp
    - nx
    - ny
    outputs:
    - rhs
    description: 'rhs(c,i,j) = L_flux(c,i,j) + S_b(c,i,j) for every c = 1..ncomp, i = 1..nx, j = 1..ny, from the supplied
      fixed fields. It consumes ONLY L_flux and S_b: it does not consume U or z_b, and L_flux / S_b are not recomputed. The
      same rhs serves both stages.'
  - step_id: step_03_stage1
    step_kind: time_integrate
    operation_ref: ssprk2_stage1
    inputs:
    - U_n
    - rhs
    - dt
    - ncomp
    - nx
    - ny
    outputs:
    - U_1
    description: 'First SSPRK2 stage: U_1(c,i,j) = U_n(c,i,j) + dt * rhs(c,i,j) for every c = 1..ncomp, i = 1..nx, j = 1..ny
      (every element of the stage state is written; the j loop is bounded by ny and the i loop by nx). dt is the case''s time
      step (inputs.time.dt).'
  - step_id: step_04_stage2
    step_kind: time_integrate
    operation_ref: ssprk2_stage2
    inputs:
    - U_n
    - U_1
    - rhs
    - dt
    - ncomp
    - nx
    - ny
    outputs:
    - U_np1
    description: 'Second SSPRK2 stage with weights 1/2, 1/2: U_np1(c,i,j) = 0.5 * U_n(c,i,j) + 0.5 * (U_1(c,i,j) + dt * rhs(c,i,j))
      for every c = 1..ncomp, i = 1..nx, j = 1..ny (the j loop bounded by ny, the i loop by nx), using the same rhs as stage
      1. Result equals U_n + dt*(L_flux + S_b) up to round-off.'
  ordering:
  - step_01_input_guard
  - step_02_stage_rhs
  - step_03_stage1
  - step_04_stage2
  control_condition: steps 02-04 run only when step_01 yields guard_pass = true; otherwise the call returns with guard_pass
    = false and no update
  iteration_contract:
    kind: fixed_stage_composition
    stage_count: 2
    stage_weights:
    - 0.5
    - 0.5
    notes: two fixed SSPRK2 stages per call; the time loop belongs to the calling problem node
  update_semantics:
    target_variables:
    - U_np1
    update_order: sequential
    notes: U_n, L_flux, S_b and z_b are intent-in and are never modified; U_np1 is a separate intent-out array
  temporaries:
  - name: rhs
    shape_expr: '[ncomp, nx, ny]'
  - name: U_1
    shape_expr: '[ncomp, nx, ny]'
  derived_field_rules:
  - name: ncomp
    rule: number of state components (3 in every case), case input inputs.grid.ncomp; passed as the ncomp extent argument
      and bounds every loop over c
  - name: nx
    rule: number of cells along x, case input inputs.grid.nx (4, or 3 on l0_frozen_rhs_axis); passed as the nx extent argument
      and bounds every loop over i
  - name: ny
    rule: number of cells along y, case input inputs.grid.ny (3, or 4 on l0_frozen_rhs_axis); passed as the ny extent argument
      and bounds every loop over j
  - name: dt
    rule: time step, case input inputs.time.dt (0.1; 0.05 on l0_stage_weight; -0.1 on l0_invalid_dt, which the guard rejects);
      passed as the dt argument, scales rhs in both stages
  - name: dx
    rule: cell size along x, case input inputs.grid.dx (0.5; 0.25 on l0_frozen_rhs_axis); passed as the dx argument, read
      only by the input guard
  - name: dy
    rule: cell size along y, case input inputs.grid.dy (0.25; 0.5 on l0_frozen_rhs_axis); passed as the dy argument, read
      only by the input guard
  - name: U_n
    rule: 'initial_state.U_n: the closed form of tests.md section 2 evaluated by the host; passed as the U_n argument'
  - name: L_flux
    rule: 'initial_state.L_flux: the closed form of tests.md section 2 evaluated by the host; passed as the L_flux argument'
  - name: S_b
    rule: 'initial_state.S_b: the closed form of tests.md section 2 evaluated by the host; passed as the S_b argument'
  - name: z_b
    rule: 'initial_state.z_b: z_b(i,j) = a0 + a_i*i + a_j*j over inputs.initial.z_b; passed as the z_b argument; inert at
      L0'
  - name: U_np1
    rule: pre-call content -999 at every element (initial_state.U_np1); then the U_np1 output argument of the operation called
      with the case's U_n, L_flux, S_b, z_b, dt, dx, dy, ncomp, nx, ny, as received (never computed through a call on axis-exchanged
      fields)
  - name: guard_pass
    rule: the operation's logical output guard_pass, written by the driver into the scalar state guard_pass as 1 / 0 after
      the call (0 before it)
  invariants:
  - 'zero-rhs invariance: when L_flux = 0 and S_b = 0, U_np1 equals U_n'
  - 'stage-weight consistency: the two-stage composition applies weights 1/2 and 1/2 to U_n and the second-stage state U_1
    + dt*rhs'
  - 'frozen-field exactness: U_np1 = U_n + dt*(L_flux + S_b), both stages using the identical rhs'
  - 'z_b invariance: with U_n, L_flux, S_b fixed, varying z_b does not change U_np1 (z_b is inert at L0)'
  - 'input guard: dt <= 0 or dx <= 0 or dy <= 0 gives guard_pass = false and the update is rejected'
  - z_b is kept as a live input argument and referenced only through a benign name binding (e.g. an associate block) that
    does not participate in the computation; no arithmetic no-op (0*U, 0*z_b) references an unused input, and no lint-suppression
    pragma is added for z_b or anything else
  - no automatic switching of the time-integration method
  - 'no call is computed through another call: the update runs over the extents and arrays it receives and never recognizes
    axis-exchanged inputs, transforms them, updates and transforms back'
  - the published procedure header carries no prefix the signature block does not declare (e.g. no side-effect-free / pure
    marker)
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
  inputs:
  - name: ncomp
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: nx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: ny
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: dt
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: dx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: dy
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
  - name: U_n
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
  - name: L_flux
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
  - name: S_b
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
  - name: z_b
    shape_expr: '[nx, ny]'
    evidence_ref: raw/state_snapshots
  outputs:
  - name: U_np1
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - U_np1
  - name: guard_pass
    shape_expr: scalar
    evidence_ref: raw/state_snapshots
    raw_variables:
    - guard_pass
  raw_requirements:
    required_evidence:
    - artifact: state_snapshots
      required: true
      schema:
        variables:
        - name: U_n
          shape_expr: '[ncomp, nx, ny]'
        - name: L_flux
          shape_expr: '[ncomp, nx, ny]'
        - name: S_b
          shape_expr: '[ncomp, nx, ny]'
        - name: z_b
          shape_expr: '[nx, ny]'
        - name: U_np1
          shape_expr: '[ncomp, nx, ny]'
        - name: guard_pass
          shape_expr: scalar
        time_variable: t
        time_shape_expr: scalar
        coordinates:
        - name: kc
          axis: 0
          count: inputs.grid.ncomp
          length: inputs.grid.ncomp
          placement: cell_center
        - name: xc
          axis: 1
          count: inputs.grid.nx
          length: inputs.grid.nx
          placement: cell_center
        - name: yc
          axis: 2
          count: inputs.grid.ny
          length: inputs.grid.ny
          placement: cell_center
  semantic_dependency:
    required_sources:
    - U_n
    - L_flux
    - S_b
    - z_b
    - dt
    - dx
    - dy
  tests:
  - test_id: l0_zero_rhs_invariance_pass
    expected_outcome: pass
    target_cases:
    - l0_zero_rhs
    quantities:
    - guard_pass
    - zero_rhs_deviation
  - test_id: l0_stage_weight_consistency_pass
    expected_outcome: pass
    target_cases:
    - l0_stage_weight
    quantities:
    - guard_pass
    - stage_weight_deviation
  - test_id: l0_frozen_rhs_exactness_pass
    expected_outcome: pass
    target_cases:
    - l0_frozen_rhs
    - l0_frozen_rhs_axis
    - l0_small_step
    - l0_ncomp4
    quantities:
    - frozen_rhs_deviation
    - guard_pass
  - test_id: l0_zb_invariance_pass
    expected_outcome: pass
    target_cases:
    - l0_zb_invariance
    - l0_zb_invariance_zb2
    quantities:
    - guard_pass
    - zb_deviation
  - test_id: l0_symmetry_pairs_pass
    expected_outcome: pass
    target_cases:
    - l0_frozen_rhs
    - l0_frozen_rhs_axis
    quantities:
    - guard_pass
    - pair_residual
  - test_id: l0_invalid_dt_xfail
    expected_outcome: xfail
    target_cases:
    - l0_invalid_dt
    quantities:
    - guard_pass
  - test_id: l0_invalid_dt_zero_xfail
    expected_outcome: xfail
    target_cases:
    - l0_dt0
    quantities:
    - guard_pass
  - test_id: l0_invalid_dx_zero_xfail
    expected_outcome: xfail
    target_cases:
    - l0_dx0
    quantities:
    - guard_pass
  - test_id: l0_invalid_dx_negative_xfail
    expected_outcome: xfail
    target_cases:
    - l0_dx_neg
    quantities:
    - guard_pass
  - test_id: l0_invalid_dy_zero_xfail
    expected_outcome: xfail
    target_cases:
    - l0_dy0
    quantities:
    - guard_pass
  - test_id: l0_invalid_dy_negative_xfail
    expected_outcome: xfail
    target_cases:
    - l0_dy_neg
    quantities:
    - guard_pass
  predicates:
  - test_id: l0_zero_rhs_invariance_pass
    quantity: guard_pass
    target_cases:
    - l0_zero_rhs
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_zero_rhs_invariance_pass
    quantity: zero_rhs_deviation
    target_cases:
    - l0_zero_rhs
    per_case: true
    expr: maxabs(final.U_np1 - initial.U_n)
    op: le
    value: 1.0e-12
  - test_id: l0_zero_rhs_invariance_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_zero_rhs
    per_case: true
    expr: maxabs(final.U_np1 - comparand.final.U_np1) / max(maxabs(final.U_np1), maxabs(comparand.final.U_np1), 1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_stage_weight_consistency_pass
    quantity: guard_pass
    target_cases:
    - l0_stage_weight
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_stage_weight_consistency_pass
    quantity: stage_weight_deviation
    target_cases:
    - l0_stage_weight
    per_case: true
    bind:
      rhs: initial.L_flux + initial.S_b
      U1: initial.U_n + inputs.time.dt * rhs
      U2: 0.5 * initial.U_n + 0.5 * (U1 + inputs.time.dt * rhs)
    expr: maxabs(final.U_np1 - U2)
    op: le
    value: 1.0e-12
  - test_id: l0_stage_weight_consistency_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_stage_weight
    per_case: true
    expr: maxabs(final.U_np1 - comparand.final.U_np1) / max(maxabs(final.U_np1), maxabs(comparand.final.U_np1), 1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_frozen_rhs_exactness_pass
    quantity: frozen_rhs_deviation
    target_cases:
    - l0_frozen_rhs
    - l0_frozen_rhs_axis
    - l0_small_step
    - l0_ncomp4
    per_case: true
    expr: maxabs(final.U_np1 - (initial.U_n + inputs.time.dt * (initial.L_flux + initial.S_b)))
    op: le
    value: 1.0e-12
  - test_id: l0_frozen_rhs_exactness_pass
    quantity: guard_pass
    target_cases:
    - l0_frozen_rhs
    - l0_frozen_rhs_axis
    - l0_small_step
    - l0_ncomp4
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1
  - test_id: l0_frozen_rhs_exactness_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_frozen_rhs
    - l0_frozen_rhs_axis
    - l0_small_step
    - l0_ncomp4
    per_case: true
    expr: maxabs(final.U_np1 - comparand.final.U_np1) / max(maxabs(final.U_np1), maxabs(comparand.final.U_np1), 1.0)
    op: le
