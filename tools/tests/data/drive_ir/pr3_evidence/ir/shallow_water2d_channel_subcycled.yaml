  - test_id: l1_tc2_substeps1_restates_member
    quantity: errors.steady_h.l1_rel_tend.lower
    target_cases:
    - chs_tc2_ref_n032_dts100_m1
    per_case: true
    bind:
      g: inputs.constants.g
      f0: 2 * inputs.constants.Omega * sin(inputs.constants.theta0)
      beta: 2 * inputs.constants.Omega * cos(inputs.constants.theta0) / inputs.constants.a
      h0: inputs.initial.gh0 / g
      u0: inputs.initial.zonal_sign * 2 * pi * inputs.constants.a / (12 * 86400)
      Lr: inputs.grid.L_y
      hr: h0 - (u0 / g) * (f0 * (y - Lr / 2) + (beta / 2) * (y - Lr / 2) ** 2)
      hur: hr * u0
      hvr: 0.0 * y
      eh1: sum(abs(final.h - hr)) / sum(abs(hr))
      eh2: norm2(final.h - hr) / norm2(hr)
      ehi: maxabs(final.h - hr) / maxabs(hr)
      eu1: sum(abs(final.hu - hur)) / sum(abs(hur))
      eu2: norm2(final.hu - hur) / norm2(hur)
      eui: maxabs(final.hu - hur) / maxabs(hur)
      ev1: sum(abs(final.hv - hvr)) / max(sum(abs(hur)), sum(abs(hvr)))
      ev2: norm2(final.hv - hvr) / max(norm2(hur), norm2(hvr))
      evi: maxabs(final.hv - hvr) / max(maxabs(hur), maxabs(hvr))
    expr: eh1
    op: ge
    value:
      per_case:
        chs_tc2_ref_n032_dts100_m1: 0.0011
