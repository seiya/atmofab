      dx: inputs.grid.L_x / inputs.grid.nx
      dy: inputs.grid.L_y / inputs.grid.ny
      lam0: max((abs(initial.hu / initial.h) + sqrt(g * initial.h)) / dx + (abs(initial.hv / initial.h)
