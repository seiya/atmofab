  - case_id: chs_tc4_ref_n128_dts100_m2
    inputs:
      grid:
        nx: 128
        ny: 128
        L_x: 8000000.0
        L_y: 8000000.0
        ng: 2
      time:
        t_start: 0.0
        t_end: 86400.0
      dt_rule:
        kind: cfl_ceil
        cfl_target: 0.45
        dt_scale: 1.0
      constants:
        g: 9.80616
        Omega: 7.292e-05
        a: 6371220.0
        theta0: 0.7853981633974483
      boundary:
        kind: channel_periodic_along_mirror_wall_across
        channel_axis: x
        along_axis: 1
      coriolis:
        coriolis_profile: beta_plane
      initial:
        flow_profile: tc4_translating_low
        zonal_sign: 1
        gh0: 100000.0
        u_jet: 40.0
        flow_profile_id: 4
        eta0: 0.0
        shift_x_fraction: 0.0
      test_profile_id: shallow_water2d_channel_subcycled_baseline
      test_profile_version: 0.1.0
      history:
        every: 1087
      subcycle:
