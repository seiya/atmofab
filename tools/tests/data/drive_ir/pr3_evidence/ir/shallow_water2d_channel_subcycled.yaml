  sweeps: {}
  refinements: {}
algorithm:
  algorithm_id: shallow_water_channel_p1_mc_rusanov_rk4
  execution_mode: iterative
  steps:
  - step_id: step_01_setup_validate
    step_kind: diagnostic
    operation_ref: channel_setup_validate
    inputs:
    - channel_axis
    - boundary_kind
    - coriolis_profile
    - flow_profile
    - zonal_sign
    - Omega
    - theta0
    - gh0
    - eta0
    - shift_x_fraction
    - u_jet
    - nx
    - ny
    - ng
    - dt_rule_kind
    outputs:
    - init_ok
    description: 'Setup-time validation, an error (run stops, no state is produced by the step loop) on
      any violation, never a silent completion: channel_axis must be x or y; boundary_kind must be channel_periodic_along_mirror_wall_across
      (periodic along the channel axis, free-slip mirror wall at r=0 and r=L_r); coriolis_profile must
      be beta_plane; flow_profile must be one of tc2_zonal_uniform, tc3_compact_jet, tc2_zonal_perturbed,
      tc4_translating_low; zonal_sign must be +1 or -1; Omega must be non-zero; 0 < |theta0| < pi/2; ng
      must be 2; dt_rule_kind must be cfl_ceil; eta0 (>0) and shift_x_fraction (in [0,1)) must be present
      for tc2_zonal_perturbed and u_jet (>0) for tc4_translating_low (an undefined parameter is an error
      without implicit completion); gh0 is the case value. No automatic switching of flow_profile, coriolis_profile
      or of the discretization ever happens.'
  - step_id: step_02_grid_setup
    step_kind: pointwise_process
    operation_ref: channel_grid_setup
    inputs:
    - nx
    - ny
    - L_x
    - L_y
    - ng
    - channel_axis
    outputs:
    - dx
    - dy
    - x_c
    - y_c
    - sigma
    - wall_axis
    - along_axis
    - nx_total
    - ny_total
    - nxp1
    - nyp1
    - ncomp
    description: 'Uniform cell-centred grid: dx = L_x/nx, dy = L_y/ny, x_c(i) = (i-1/2) dx (i=1..nx),
      y_c(j) = (j-1/2) dy (j=1..ny); arrays indexed (i,j) with first axis x, second y in either orientation
      (never transposed). channel_axis fixes the along-channel coordinate s and the cross-channel coordinate
      r: (s,r)=(x,y), L_s=L_x, L_r=L_y, sigma=+1, wall_axis=2, along_axis=1 for x; (s,r)=(y,x), L_s=L_y,
      L_r=L_x, sigma=-1, wall_axis=1, along_axis=2 for y. ng=2 gives ghost-extended extents nx_total=nx+4,
      ny_total=ny+4; ncomp=3.'
  - step_id: step_03_coriolis_setup
    step_kind: pointwise_process
    operation_ref: channel_coriolis_setup
    inputs:
    - Omega
    - theta0
    - a
    - channel_axis
    - x_c
    - y_c
    - L_x
    - L_y
    outputs:
    - f0
    - beta
    - f_cell
    description: 'beta-plane Coriolis parameter, evaluated once at setup at every interior cell centre
      and time-invariant: f0 = 2 Omega sin(theta0), beta = 2 Omega cos(theta0)/a, f_cell(i,j) = f0 + beta
      (r_ij - L_r/2) with r_ij = y_c(j) for channel_axis=x and x_c(i) for channel_axis=y. Signed Omega
      and theta0 are used as given (no mapping onto another sign).'
  - step_id: step_04_initial_state
    step_kind: pointwise_process
    operation_ref: channel_initial_state
    inputs:
    - flow_profile
    - g
    - gh0
    - zonal_sign
    - a
    - eta0
    - shift_x_fraction
    - u_jet
    - theta0
    - f0
    - beta
    - f_cell
    - sigma
    - x_c
    - y_c
    - L_x
    - L_y
    - dx
    - dy
    - channel_axis
    outputs:
    - h
    - hu
    - hv
    description: Initial state at the cell centres by flow_profile, using the derived_field_rules initial_tc2_zonal_uniform,
      initial_tc3_compact_jet, initial_tc2_zonal_perturbed and initial_tc4_translating_low (h0 = gh0/g,
      u0 = zonal_sign*2*pi*a/(12*86400)). The along-channel momentum is h*u_s and the cross-channel momentum
      is h*u_r (hu = h u_s, hv = h u_r for channel_axis=x; hu = h u_r, hv = h u_s for channel_axis=y).
      After filling, h > 0 is required in every interior cell; otherwise setup stops with an error (the
      channel is outside the positivity bound of the profile); the state is never clipped or floored.
  - step_id: step_05_tc4_setup
    step_kind: pointwise_process
    operation_ref: channel_tc4_setup
    inputs:
    - flow_profile
    - u_jet
    - zonal_sign
    - gh0
    - g
    - a
    - theta0
    - f0
    - beta
    - f_cell
    - sigma
    - x_c
    - y_c
    - L_x
    - L_y
    - channel_axis
    outputs:
    - hbar
    - ubar
    - dubar
    - dfdr
    - psi0
    - R_low
    - c_tr
    - s_c0
    - r_c
    - L_along
    description: 'Only for flow_profile=tc4_translating_low (skipped otherwise): the setup-time per-cell
      background arrays and the parameters of the low, by the derived_field_rules of the same names, passed
      unchanged to the forcing component at every stage. dfdr and dubar are the closed forms (beta and
      U_j k sin(2 k r)), never differences of arrays.'
  - step_id: step_06_dt_rule
    step_kind: reduction
    operation_ref: channel_dt_rule
    inputs:
    - h
    - hu
    - hv
    - g
    - dx
    - dy
    - t_start
    - t_end
    - cfl_target
    - dt_scale
    - dt_rule_kind
    outputs:
    - lambda0
    - dt_raw
    - n_step_plan
    - dt
    description: "dt_rule kind cfl_ceil (tests.md \xA73), evaluated once from the initial state: lambda0\
      \ = max_ij((|hu/h|+sqrt(g h))/dx + (|hv/h|+sqrt(g h))/dy); dt_raw = dt_scale*cfl_target/lambda0;\
      \ n_step_plan = ceil((t_end - t_start)/dt_raw); dt = (t_end - t_start)/n_step_plan. cfl_target and\
      \ dt_scale are the case values."
  - step_id: step_07_run_init
    step_kind: diagnostic
    operation_ref: channel_step_stack
    inputs:
    - h
    - hu
    - hv
    outputs:
    - U_n
    description: 'At the start of __step: U_n = (h, hu, hv) stacked as (ncomp, nx, ny) with component
      order 1=h, 2=hu, 3=hv.'
  - step_id: step_08_time_integrate
    step_kind: time_integrate
    operation_ref: dynamics_shallow_water_time_update_2d_rk4__advance
    inputs:
    - ncomp
    - nx
    - ny
    - U_n
    - t_n
    - dt
    outputs:
    - U_np1
    - guard_pass
    description: 'One RK4 step: dynamics_shallow_water_time_update_2d_rk4__advance(3, nx, ny, U_n, rhs,
      t_n, dt, U_np1, guard_pass) with t_n = t_start + n*dt evaluated from n (not accumulated). The component
      evaluates the four stages, their states and their times itself; this node never evaluates a stage.
      The procedure argument rhs is channel_rhs, a procedure of this node''s generated model written for
      this purpose and the only procedure ever passed (a dependency operation is never passed as rhs).
      channel_rhs matches the prototype dynamics_shallow_water_time_update_2d_rk4_rhs argument for argument
      (names are this node''s): ncomp integer intent(in) scalar; nx integer intent(in) scalar; ny integer
      intent(in) scalar; t real(kind dp) intent(in) scalar (the stage time); U real(kind dp) intent(in)
      rank 3 explicit shape (ncomp, nx, ny) (the stage state of the interior cells); dUdt real(kind dp)
      intent(out) rank 3 explicit shape (ncomp, nx, ny). channel_rhs performs steps 09 to 16 in that order
      on U_stage = U and t_stage = t. For an evaluation reporting no error, dUdt depends only on its arguments
      and on run-fixed data (case parameters, dx, dy, f_cell, x_c, y_c, the tc4 setup arrays and parameters);
      how rhs is bound to those data and how it reports an error to the step is the backend''s choice.'
  - step_id: step_09_rhs_wet_check
    step_kind: diagnostic
    operation_ref: channel_rhs_wet_check
    inputs:
    - U_stage
    outputs:
    - wet_ok
    description: 'Wet-domain invariant at every stage: if any interior h of the stage state is <= 0, the
      tendency evaluation reports an error (wet_ok false) before the value reaches the flux component,
      and the run stops with an error after the step returns; no clipping or flooring.'
  - step_id: step_10_boundary_apply
    step_kind: boundary_apply
    operation_ref: dynamics_shallow_water_boundary_2d_channel_mirror__apply
    inputs:
    - U_stage
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    - wall_axis
    - boundary_kind
    outputs:
    - W_h
    - W_hu
    - W_hv
    - grid_valid
    description: 'Copy each component of U_stage into the interior (indices ng+1..ng+nx, ng+1..ng+ny)
      of a ghost-extended work array (nx_total x ny_total) and fill its ghosts with dynamics_shallow_water_boundary_2d_channel_mirror__apply(nx,
      ny, 2, nx_total, ny_total, wall_axis, odd_at_wall, U_in, U_out, grid_valid), one call per component:
      periodic along the channel, mirror ghost across it (the boundary_kind of every case). wall_axis
      = 2 for channel_axis=x, 1 for y. odd_at_wall: h false; along-channel momentum false; cross-channel
      momentum true (hu false, hv true for x; hu true, hv false for y). grid_valid false is an error.'
  - step_id: step_11_reconstruct
    step_kind: reconstruct
    operation_ref: dynamics_shallow_water_reconstruction_2d_muscl_mc__reconstruct
    inputs:
    - W_h
    - W_hu
    - W_hv
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    outputs:
    - UL_h
    - UR_h
    - UB_h
    - UT_h
    - UL_hu
    - UR_hu
    - UB_hu
    - UT_hu
    - UL_hv
    - UR_hv
    - UB_hv
    - UT_hv
    - grid_valid
    description: 'p1 MUSCL reconstruction with the MC limiter of each conserved component separately (never
      the primitive variables, never switched at runtime): dynamics_shallow_water_reconstruction_2d_muscl_mc__reconstruct(nx,
      ny, 2, nx_total, ny_total, U_in, U_L, U_R, U_B, U_T, grid_valid), one call per component on the
      ghost-filled work array. x interface m (m=1..nx+1) is the west face of interior cell m (m<=nx) or
      the east face of cell nx (m=nx+1); y interface n likewise in y. No hydrostatic reconstruction (flat
      bottom).'
  - step_id: step_12_flux_compute
    step_kind: flux_compute
    operation_ref: dynamics_shallow_water_flux_2d_rusanov__compute_flux
    inputs:
    - UL_h
    - UR_h
    - UB_h
    - UT_h
    - UL_hu
    - UR_hu
    - UB_hu
    - UT_hu
    - UL_hv
    - UR_hv
    - UB_hv
    - UT_hv
    - g
    outputs:
    - F_star
    - G_star
    - guard_ok
    description: 'Rusanov flux, one call of dynamics_shallow_water_flux_2d_rusanov__compute_flux(U_L,
      U_R, U_B, U_T, g, F_star, G_star, a_x, a_y, guard_ok) per interface on 3-component states (h, hu,
      hv). At x interface (m,j), m=1..nx+1: U_L = (UL_h, UL_hu, UL_hv)(m,j), U_R = (UR_*)(m,j), U_B =
      U_L, U_T = U_R; its F_star output is F_star(:,m,j). At y interface (i,n), n=1..ny+1: U_B = (UB_*)(i,n),
      U_T = (UT_*)(i,n), U_L = U_B, U_R = U_T; its G_star output is G_star(:,i,n). Other outputs of each
      call are unused; guard_ok false is an error.'
  - step_id: step_13_flux_difference
    step_kind: pointwise_process
    operation_ref: channel_flux_difference
    inputs:
    - F_star
    - G_star
    - dx
    - dy
    outputs:
    - L_flux
    description: 'On every interior cell and component c: L_flux(c,i,j) = -(F_star(c,i+1,j) - F_star(c,i,j))/dx
      - (G_star(c,i,j+1) - G_star(c,i,j))/dy with the interface numbering of step 11 (dx for the x difference,
      dy for the y difference).'
  - step_id: step_14_coriolis_source
    step_kind: source_term
    operation_ref: dynamics_shallow_water_source_2d_coriolis__apply
    inputs:
    - ncomp
    - nx
    - ny
    - f_cell
    - U_stage
    outputs:
    - S_cor
    - cor_guard
    description: 'dynamics_shallow_water_source_2d_coriolis__apply(3, nx, ny, f_cell, U_stage, S_cor,
      cor_guard) at the stage state with the setup-time per-cell f: S = [0, f hv, -f hu]. cor_guard false
      is an error.'
  - step_id: step_15_tc4_forcing
    step_kind: source_term
    operation_ref: dynamics_shallow_water_source_2d_tc4_forcing__apply
    inputs:
    - flow_profile
    - ncomp
    - nx
    - ny
    - along_axis
    - x_c
    - y_c
    - t_stage
    - f_cell
    - dfdr
    - ubar
    - dubar
    - hbar
    - g
    - L_along
    - psi0
    - R_low
    - c_tr
    - s_c0
    - r_c
    outputs:
    - Q_force
    - frc_guard
    description: 'For flow_profile=tc4_translating_low only: dynamics_shallow_water_source_2d_tc4_forcing__apply(
      3, nx, ny, along_axis, x_c, y_c, t_stage, f_cell, dfdr, ubar, dubar, hbar, g, L_along, psi0, R_low,
      c_tr, s_c0, r_c, Q_force, frc_guard) with along_axis = 1 for channel_axis=x and 2 for y, t_stage
      the stage time received by rhs (never the step start time, never frozen), and the setup-time arrays
      and parameters of step 05. For every other flow_profile Q_force = 0 and the component is not called.
      frc_guard false is an error. The stage time enters no other term.'
  - step_id: step_16_tendency_assemble
    step_kind: pointwise_process
    operation_ref: channel_rhs_assemble
    inputs:
    - L_flux
    - S_cor
    - Q_force
    outputs:
    - dUdt
    description: dUdt = L_flux + S_cor + Q_force on every interior cell and component; this is the value
      channel_rhs returns to the time-update component.
  - step_id: step_17_commit
    step_kind: diagnostic
    operation_ref: channel_step_commit
    inputs:
    - U_np1
    - guard_pass
    - wet_ok
    outputs:
    - h
    - hu
    - hv
    - ok
    description: '__step''s result: ok is false if guard_pass is false or any stage reported an error
      (wet domain, grid or flux guard), the state left as received; otherwise (h, hu, hv) = U_np1 components
      1..3 and ok is true. The driver commits on true.'
  ordering:
  - step_01_setup_validate
  - step_02_grid_setup
  - step_03_coriolis_setup
  - step_04_initial_state
  - step_05_tc4_setup
  - step_06_dt_rule
  - step_07_run_init
  - step_08_time_integrate
  - step_09_rhs_wet_check
  - step_10_boundary_apply
  - step_11_reconstruct
  - step_12_flux_compute
  - step_13_flux_difference
  - step_14_coriolis_source
  - step_15_tc4_forcing
  - step_16_tendency_assemble
  - step_17_commit
  control_condition: Setup (steps 01-06) is shallow_water2d_channel__init, once per case. shallow_water2d_channel__step
    advances the state by one RK4 step (step 08, whose four stage evaluations each run the rhs steps 09-16)
    and reports its result (step 17). The driver's loop runs n_step_plan steps and ends on the last committed
    state when a step reports false (guard_pass false, wet-domain, grid or flux guard).
  iteration_contract:
    loop_variable: n
    start: 0
    stop_condition: n >= n_step_plan
    step_count_rule: n_step_plan = ceil((t_end - t_start)/dt_raw) from the dt rule of step 06; the time
      passed at step n is t_start + n*dt
    body_steps:
    - step_08_time_integrate
    - step_09_rhs_wet_check
    - step_10_boundary_apply
    - step_11_reconstruct
    - step_12_flux_compute
    - step_13_flux_difference
    - step_14_coriolis_source
    - step_15_tc4_forcing
    - step_16_tendency_assemble
    - step_17_commit
    stage_note: steps 09-16 form the procedure channel_rhs, evaluated by step 08 at each of its four RK4
      stages
  update_semantics:
    target_variables:
    - h
    - hu
    - hv
    update_order: sequential
  temporaries:
  - name: U_n
    shape_expr: '[ncomp, nx, ny]'
  - name: U_np1
    shape_expr: '[ncomp, nx, ny]'
  - name: U_stage
    shape_expr: '[ncomp, nx, ny]'
  - name: dUdt
    shape_expr: '[ncomp, nx, ny]'
  - name: t_stage
    shape_expr: scalar
  - name: W_h
    shape_expr: '[nx_total, ny_total]'
  - name: W_hu
    shape_expr: '[nx_total, ny_total]'
  - name: W_hv
    shape_expr: '[nx_total, ny_total]'
  - name: UL_h
    shape_expr: '[nxp1, ny]'
  - name: UR_h
    shape_expr: '[nxp1, ny]'
  - name: UL_hu
    shape_expr: '[nxp1, ny]'
  - name: UR_hu
    shape_expr: '[nxp1, ny]'
  - name: UL_hv
    shape_expr: '[nxp1, ny]'
  - name: UR_hv
    shape_expr: '[nxp1, ny]'
  - name: UB_h
    shape_expr: '[nx, nyp1]'
  - name: UT_h
    shape_expr: '[nx, nyp1]'
  - name: UB_hu
    shape_expr: '[nx, nyp1]'
  - name: UT_hu
    shape_expr: '[nx, nyp1]'
  - name: UB_hv
    shape_expr: '[nx, nyp1]'
  - name: UT_hv
    shape_expr: '[nx, nyp1]'
  - name: F_star
    shape_expr: '[ncomp, nxp1, ny]'
  - name: G_star
    shape_expr: '[ncomp, nx, nyp1]'
  - name: L_flux
    shape_expr: '[ncomp, nx, ny]'
  - name: S_cor
    shape_expr: '[ncomp, nx, ny]'
  - name: Q_force
    shape_expr: '[ncomp, nx, ny]'
  - name: wet_ok
    shape_expr: scalar
  - name: grid_valid
    shape_expr: scalar
  - name: guard_ok
    shape_expr: scalar
  - name: cor_guard
    shape_expr: scalar
  - name: frc_guard
    shape_expr: scalar
  - name: guard_pass
    shape_expr: scalar
  derived_field_rules:
  - name: ncomp
    rule: 3 conserved components, order 1=h, 2=hu, 3=hv in every (ncomp, nx, ny) array
  - name: nx_total
    rule: nx + 2*ng (ng = 2)
  - name: ny_total
    rule: ny + 2*ng (ng = 2)
  - name: nxp1
    rule: nx + 1 (number of x interfaces per row)
  - name: nyp1
    rule: ny + 1 (number of y interfaces per column)
  - name: dx
    rule: L_x / nx
  - name: dy
    rule: L_y / ny
  - name: x_c
    rule: x_c(i) = (i - 1/2) dx, i = 1..nx, shape [nx]
  - name: y_c
    rule: y_c(j) = (j - 1/2) dy, j = 1..ny, shape [ny]
  - name: sigma
    rule: 'orientation sign: +1 for channel_axis=x, -1 for channel_axis=y; s = x, r = y, L_s = L_x, L_r
      = L_y, u_s = u, u_r = v for x; s = y, r = x, L_s = L_y, L_r = L_x, u_s = v, u_r = u for y. Geostrophic
      balance reads g dh/dr = -sigma f u_s'
  - name: wall_axis
    rule: 'array axis across the channel: 2 for channel_axis=x, 1 for channel_axis=y'
  - name: along_axis
    rule: 'array axis along the channel: 1 for channel_axis=x, 2 for channel_axis=y'
  - name: f0
    rule: 2 * Omega * sin(theta0) (signed inputs)
  - name: beta
    rule: 2 * Omega * cos(theta0) / a
  - name: f_cell
    rule: f(i,j) = f0 + beta * (r_ij - L_r/2), r_ij = y_c(j) for channel_axis=x, x_c(i) for channel_axis=y;
      shape [nx, ny]; setup-time, time-invariant
  - name: h0
    rule: gh0 / g (gh0 is the case input)
  - name: u0
    rule: zonal_sign * 2 * pi * a / (12 * 86400) (tc2_zonal_uniform, tc3_compact_jet, tc2_zonal_perturbed)
  - name: initial_tc2_zonal_uniform
    rule: u_s = u0, u_r = 0, h(r) = h0 - sigma*(u0/g)*[f0*(r - L_r/2) + (beta/2)*(r - L_r/2)^2] at each
      cell centre r; along-channel momentum h*u0, cross-channel momentum 0
  - name: initial_tc3_compact_jet
    rule: r_b = L_r/8, r_e = 7 L_r/8, x_e = 0.3, zeta(r) = x_e (r - r_b)/(r_e - r_b), b(z) = 0 for z <=
      0 and exp(-1/z) for z > 0 (the branch-free form exp(-1/max(z, 1.0e-300)) is equal at every cell
      centre and may be used); u_s(r) = u0 b(zeta) b(x_e - zeta) exp(4/x_e), u_r = 0; h(r_j) = h0 - (sigma/g)
      * integral_0^{r_j} f(r') u_s(r') dr' with f(r') = f0 + beta (r' - L_r/2), evaluated by composite
      Simpson quadrature on a uniform sub-grid of spacing dr/64 (dr = dy for channel_axis=x, dx for y)
      from 0 to the cell-centre r_j = (j - 1/2) dr, i.e. over 64 j - 32 sub-intervals (this quadrature
      is part of the definition of the discrete initial state, not an implementation choice); along-channel
      momentum h u_s, cross-channel momentum 0. Beyond the jet the depth equals h_N = h0 - sigma (f0 u0
      exp(4/x_e)/g)((r_e - r_b)/x_e) C with C = 1.12064479227927e-7 to round-off; before the jet h = h0
      exactly.
  - name: initial_tc2_zonal_perturbed
    rule: h(s,r) = h_TC2(r) + eta0 * sin(2*pi*(s/L_s - shift_x_fraction)) with h_TC2 of initial_tc2_zonal_uniform
      (the shift is along the channel, along y for channel_axis=y); u_s = u0, u_r = 0; along-channel momentum
      h*u0, cross-channel momentum 0
  - name: initial_tc4_translating_low
    rule: 'prescribed flow at t = 0 at the cell centres: h = h_tilde, hu = h_tilde*u_tilde, hv = h_tilde*v_tilde
      with h_tilde = hbar + f*psi/g; channel_axis=x: u_tilde = ubar - psi_y, v_tilde = psi_x; channel_axis=y:
      u_tilde = -psi_y, v_tilde = ubar + psi_x; (psi_x, psi_y) = (psi_s, psi_r) for x and (psi_r, psi_s)
      for y (see psi0 rule)'
  - name: Uj
    rule: zonal_sign * u_jet (tc4_translating_low)
  - name: k_wave
    rule: pi / L_r
  - name: hbar
    rule: hbar(r) = h0 - sigma*(Uj/g)*[F(r) - F(L_r/2)], F(r) = f0*(r/2 - sin(2kr)/(4k)) + beta*(r^2/4
      - L_r r/4 - (r - L_r/2) sin(2kr)/(4k) - (cos(2kr) - 1)/(8k^2)), k = k_wave, per cell at r_ij; shape
      [nx, ny]
  - name: ubar
    rule: Uj * sin(k r)^2 per cell (background velocity along the channel); shape [nx, ny]
  - name: dubar
    rule: Uj * k * sin(2 k r) per cell, closed form (not a difference of ubar); shape [nx, ny]
  - name: dfdr
    rule: beta in every cell, closed form; shape [nx, ny]
  - name: psi0
    rule: psi0 = -0.03 * gh0 / f0; the low psi(s,r,t) = psi0 exp(-rho^2/R_low^2), rho^2 = (L_s/pi)^2 sin^2(xi)
      + (r - r_c)^2, xi = pi (s - s_c0 - c_tr t)/L_s, psi_s = -(L_s/(pi R_low^2)) sin(2 xi) psi, psi_r
      = -2 (r - r_c)/R_low^2 psi
  - name: R_low
    rule: 2 * a / 12.74244
  - name: c_tr
    rule: Uj * cos(theta0)
  - name: s_c0
    rule: L_s / 2
  - name: r_c
    rule: L_r / 2
  - name: L_along
    rule: L_s (L_x for channel_axis=x, L_y for channel_axis=y)
  - name: lambda0
    rule: max_ij((|hu/h| + sqrt(g h))/dx + (|hv/h| + sqrt(g h))/dy) at the initial state
  - name: dt_raw
    rule: dt_scale * cfl_target / lambda0
  - name: n_step_plan
    rule: ceil((t_end - t_start) / dt_raw)
  - name: dt
    rule: (t_end - t_start) / n_step_plan
  - name: t_n
    rule: t_start + n * dt at step n = 0..n_step_plan-1, evaluated from n (not accumulated)
  - name: cfl_index
    rule: dt * max_ij((|u| + c)/dx + (|v| + c)/dy), u = hu/h, v = hv/h, c = sqrt(g h)
  invariants:
  - 'Wet domain: h > 0 in every interior cell at every stage and step; h <= 0 is a runtime error that
    stops the run before the flux component sees it; no clip, floor, limiter or filter on h'
  - 'Mass conservation: wall mass flux is exactly zero, along-channel interfaces periodic, Coriolis has
    no h component, so sum(h) is conserved to round-off except for tc4_translating_low, whose change per
    step is dt*sum(Q_h)'
  - Uniformity along the channel for tc2_zonal_uniform and tc3_compact_jet; translation equivariance along
    the channel for every profile but tc4_translating_low
  - 'Axis-exchange equivariance (channel_axis x<->y, nx<->ny, L_x<->L_y, Omega -> -Omega): state (h, hv,
    hu) transposed; mirror equivariance along the channel (Omega, zonal_sign negated, shift_x_fraction
    -> 1/2 - shift) and across it (theta0 negated; tc3 with gh0 -> g h_N)'
  - 'No work by the Coriolis source: hu*S_2 + hv*S_3 = 0 in every cell'
  - 'A channel_axis=y case is computed in that orientation: never transpose the state, grid or coordinates
    to x and back; signed Omega, theta0 and zonal_sign are evaluated as given, never mapped onto another
    case'
  - Only channel_rhs is passed as rhs; Q is evaluated at the stage time t received by rhs and is zero
    unless flow_profile=tc4_translating_low; no bottom topography, no other forcing
  splitting_policy:
    kind: none
    description: 'method of lines: the full tendency L_flux + S + Q is evaluated at each RK4 stage (no
      operator splitting)'
  state_variables:
  - name: h
    shape_expr: '[nx, ny]'
  - name: hu
    shape_expr: '[nx, ny]'
  - name: hv
    shape_expr: '[nx, ny]'
  required_update_paths:
  - h
  - hu
  - hv
  diagnostics_from_state: true
  fallback_policy: fail_closed
dependency:
  node_key: problem/shallow_water2d_channel_subcycled@0.1.0
  direct_deps:
  - kind: problem
    node_key: problem/shallow_water2d_channel@0.4.1
    operations:
    - shallow_water2d_channel__init
    - shallow_water2d_channel__step
io_contract:
  inputs:
  - name: nx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.nx; interior cells along x (steps 02, 08-16)
  - name: ny
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.ny; interior cells along y
  - name: L_x
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.L_x; domain length along x (dx, L_s or L_r)
  - name: L_y
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.L_y; domain length along y (dy, L_s or L_r)
  - name: ng
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.ng = 2; ghost width of the work arrays and of the boundary/reconstruction
      calls
  - name: t_start
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.time.t_start; start time of the run, dt rule and t_n
  - name: t_end
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.time.t_end; end time, fixes n_step_plan and dt
  - name: dt_rule_kind
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.dt_rule.kind = cfl_ceil; selects the dt rule of step 06
  - name: cfl_target
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.dt_rule.cfl_target; dt_raw factor (step 06)
  - name: dt_scale
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.dt_rule.dt_scale; dt_raw factor (step 06)
  - name: g
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.g; gravity in h0, wave speed, flux, forcing
  - name: Omega
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.Omega; signed rotation rate, fixes f0 and beta
  - name: a
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.a; radius in beta, u0 and R_low
  - name: theta0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.constants.theta0; signed reference latitude, fixes f0, beta, c_tr
  - name: boundary_kind
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.boundary.kind; the channel boundary realized by step 10
  - name: channel_axis
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'inputs.boundary.channel_axis; orientation x or y: s/r mapping, sigma, wall_axis, along_axis,
      odd_at_wall'
  - name: coriolis_profile
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.coriolis.coriolis_profile = beta_plane (step 03)
  - name: flow_profile
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.initial.flow_profile; selects the initial state (step 04) and whether the forcing
      is applied (steps 05, 15)
  - name: zonal_sign
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.initial.zonal_sign; sign of u0 and Uj
  - name: gh0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.initial.gh0; h0 = gh0/g, psi0
  - name: eta0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.initial.eta0 (tc2_zonal_perturbed); perturbation amplitude
  - name: shift_x_fraction
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.initial.shift_x_fraction (tc2_zonal_perturbed); along-channel phase shift
  - name: u_jet
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.initial.u_jet (tc4_translating_low); jet maximum, Uj = zonal_sign*u_jet
  - description: inputs.boundary.along_axis; 1 for channel_axis=x, 2 for channel_axis=y
    evidence_ref: spec.ir.yaml
    name: along_axis
    shape_expr: scalar
  - description: inputs.initial.flow_profile_id; 1 tc2_zonal_uniform, 2 tc3_compact_jet, 3 tc2_zonal_perturbed,
      4 tc4_translating_low
    evidence_ref: spec.ir.yaml
    name: flow_profile_id
    shape_expr: scalar
  - name: substeps
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.subcycle.substeps: the number of member steps of length dt / substeps one
      call of the step makes; below 1 is refused'
  outputs:
  - name: h
    shape_expr: '[nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - h
    description: water depth at the capture time
  - name: hu
    shape_expr: '[nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - hu
    description: x momentum at the capture time
  - name: hv
    shape_expr: '[nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - hv
    description: y momentum at the capture time
  - evidence_ref: raw/state_snapshots
    name: dt
    raw_variables:
    - dt
    shape_expr: scalar
  - evidence_ref: raw/state_snapshots
    name: n_step_plan
    raw_variables:
    - n_step_plan
    shape_expr: scalar
  - evidence_ref: raw/state_snapshots
    name: init_ok
    raw_variables:
    - init_ok
    shape_expr: scalar
  - evidence_ref: raw/state_snapshots
    name: ok
    raw_variables:
    - ok
    shape_expr: scalar
  raw_requirements:
    required_evidence:
    - artifact: state_snapshots
