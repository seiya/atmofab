    expr: maxabs(final.hv - comparand.final.hv) / max(maxabs(final.hu), maxabs(final.hv), maxabs(comparand.final.hu),
      maxabs(comparand.final.hv), 1.0)
    op: le
    value: 1.0e-10
    per_case: true
    target_cases:
    - chs_tc2_ref_n032_dts100_m2
    - chs_zrepeat_n032_dts100_m2
  - test_id: l0_substeps_refusal_xfail
    quantity: ok
    target_cases: &id003
    - chs_guard_n032_dts100_m0
    - chs_guard_n032_dts100_mneg1
    per_case: true
    expr: final.ok
    op: eq
    value: 0
  - test_id: l0_substeps_refusal_xfail
    quantity: run.first_call_refused
    target_cases: *id003
    per_case: true
    expr: final.step + max(maxabs(final.h - initial.h), maxabs(final.hu - initial.hu), maxabs(final.hv
      - initial.hv))
    op: eq
    value: 0
  - test_id: l0_init_refusal_xfail
    quantity: init_ok
    expr: initial.init_ok
    op: eq
    value: 0
    per_case: true
    target_cases:
    - chs_tc2_ref_n032_dts100_m2_badprofile
  - test_id: l0_wet_domain_refusal_xfail
    quantity: ok
    expr: final.ok
    op: eq
    value: 0
    per_case: true
    target_cases:
    - chs_dry_n032_dts1600_m2
  - test_id: l0_wet_domain_refusal_xfail
    quantity: run.state_moved
    expr: maxabs(final.h - initial.h)
    op: gt
    value: 0
    per_case: true
    target_cases:
    - chs_dry_n032_dts1600_m2
