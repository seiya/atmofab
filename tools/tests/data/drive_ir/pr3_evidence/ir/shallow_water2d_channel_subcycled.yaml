    derived:
      nx_g: inputs.grid.nx
      ny_g: inputs.grid.ny
  - case_id: chs_zrepeat_n032_dts100_m2
    inputs:
      grid:
        nx: 32
        ny: 32
        L_x: 6000000.0
        L_y: 6000000.0
        ng: 2
      time:
        t_start: 0.0
        t_end: 86400.0
      dt_rule:
        kind: cfl_ceil
        cfl_target: 0.45
        dt_scale: 1.0
      constants:
        g: 9.80616
        Omega: 7.292e-05
        a: 6371220.0
        theta0: 0.7853981633974483
      boundary:
        kind: channel_periodic_along_mirror_wall_across
        channel_axis: x
        along_axis: 1
      coriolis:
        coriolis_profile: beta_plane
      initial:
        flow_profile: tc2_zonal_uniform
        zonal_sign: 1
        gh0: 29400.0
        flow_profile_id: 1
        eta0: 0.0
        shift_x_fraction: 0.0
        u_jet: 0.0
      test_profile_id: shallow_water2d_channel_subcycled_baseline
      test_profile_version: 0.1.0
