      Fr: f0 * (y / 2 - sin(2 * k * y) / (4 * k)) + beta * (y ** 2 / 4 - Lr * y / 4 - (y - Lr / 2) * sin(2
        * k * y) / (4 * k) - (cos(2 * k * y) - 1) / (8 * k ** 2))
      Fc: f0 * (rc / 2 - sin(2 * k * rc) / (4 * k)) + beta * (rc ** 2 / 4 - Lr * rc / 4 - (rc - Lr / 2)
        * sin(2 * k * rc) / (4 * k) - (cos(2 * k * rc) - 1) / (8 * k ** 2))
      hbar: h0 - (Uj / g) * (Fr - Fc)
      ubar: Uj * sin(k * y) ** 2
      fr: f0 + beta * (y - Lr / 2)
      psi0: -0.03 * inputs.initial.gh0 / f0
      Rl: 2 * inputs.constants.a / 12.74244
      ctr: Uj * cos(inputs.constants.theta0)
      tt: inputs.time.t_end
      xi: pi * (x - Ls / 2 - ctr * tt) / Ls
      psi: psi0 * exp(-((Ls / pi) ** 2 * sin(xi) ** 2 + (y - rc) ** 2) / Rl ** 2)
      ps: -(Ls / (pi * Rl ** 2)) * sin(2 * xi) * psi
      pr: -(2 * (y - rc) / Rl ** 2) * psi
      hr: hbar + fr * psi / g
      hur: hr * (ubar - pr)
      hvr: hr * ps
      mh1: sum(abs(final.h - hr)) / sum(abs(hr))
      mh2: norm2(final.h - hr) / norm2(hr)
      mhi: maxabs(final.h - hr) / maxabs(hr)
      mu1: sum(abs(final.hu - hur)) / sum(abs(hur))
      mu2: norm2(final.hu - hur) / norm2(hur)
      mui: maxabs(final.hu - hur) / maxabs(hur)
      mv1: sum(abs(final.hv - hvr)) / sum(abs(hvr))
      mv2: norm2(final.hv - hvr) / norm2(hvr)
      mvi: maxabs(final.hv - hvr) / maxabs(hvr)
    expr: mv2
    op: ge
    value:
      per_case:
        chs_tc4_ref_n032_dts100_m1: 0.27
