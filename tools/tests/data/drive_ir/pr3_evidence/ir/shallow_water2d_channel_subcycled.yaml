      schema:
        variables:
        - name: h
          shape_expr: '[nx, ny]'
        - name: hu
          shape_expr: '[nx, ny]'
        - name: hv
          shape_expr: '[nx, ny]'
        - name: dt
          shape_expr: scalar
        - name: n_step_plan
          shape_expr: scalar
        - name: init_ok
          shape_expr: scalar
        - name: ok
          shape_expr: scalar
        time_variable: t
        time_shape_expr: scalar
        coordinates:
        - name: x
          axis: 0
          count: inputs.grid.nx
          length: inputs.grid.L_x
          placement: cell_center
        - name: y
          axis: 1
          count: inputs.grid.ny
          length: inputs.grid.L_y
          placement: cell_center
    - artifact: state_history
    - artifact: step_series
      names:
      - step
      - h_min
      - h_max
      - hu_min
      - hu_max
      - hv_min
      - hv_max
