      f0: 2 * inputs.constants.Omega * sin(inputs.constants.theta0)
      beta: 2 * inputs.constants.Omega * cos(inputs.constants.theta0) / inputs.constants.a
      h0: inputs.initial.gh0 / g
      Uj: inputs.initial.zonal_sign * inputs.initial.u_jet
      Lr: inputs.grid.L_x
      Ls: inputs.grid.L_y
      k: pi / Lr
      rc: Lr / 2
      Fr: f0 * (x / 2 - sin(2 * k * x) / (4 * k)) + beta * (x ** 2 / 4 - Lr * x / 4 - (x - Lr / 2) * sin(2
        * k * x) / (4 * k) - (cos(2 * k * x) - 1) / (8 * k ** 2))
      Fc: f0 * (rc / 2 - sin(2 * k * rc) / (4 * k)) + beta * (rc ** 2 / 4 - Lr * rc / 4 - (rc - Lr / 2)
        * sin(2 * k * rc) / (4 * k) - (cos(2 * k * rc) - 1) / (8 * k ** 2))
      hbar: h0 + (Uj / g) * (Fr - Fc)
      ubar: Uj * sin(k * x) ** 2
      fr: f0 + beta * (x - Lr / 2)
      psi0: -0.03 * inputs.initial.gh0 / f0
      Rl: 2 * inputs.constants.a / 12.74244
      ctr: Uj * cos(inputs.constants.theta0)
      tt: '0.0'
      xi: pi * (y - Ls / 2 - ctr * tt) / Ls
      psi: psi0 * exp(-((Ls / pi) ** 2 * sin(xi) ** 2 + (x - rc) ** 2) / Rl ** 2)
      ps: -(Ls / (pi * Rl ** 2)) * sin(2 * xi) * psi
      pr: -(2 * (x - rc) / Rl ** 2) * psi
      hr: hbar + fr * psi / g
      ur: -ps
      vr: ubar + pr
    expr: maxabs(initial.h - hr) / maxabs(hr)
