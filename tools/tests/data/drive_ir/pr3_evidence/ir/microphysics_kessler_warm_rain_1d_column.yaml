      cvv: inputs.constants.cpvap - inputs.constants.rvap
      dv: final.qv - initial.qv
    expr: maxabs(interior * (final.temp - initial.temp + dv * (L00 + initial.temp * (cvv - inputs.constants.cl)) / final.cvtot))
    op: le
    value: 2.0e-13
