      L00: inputs.constants.lhv0 - (inputs.constants.cpvap - inputs.constants.cl) * inputs.constants.tem00
      qs_final: inputs.constants.psat0 * exp(log(final.temp / inputs.constants.tem00) * (inputs.constants.cpvap - inputs.constants.cl)
        / inputs.constants.rvap + L00 / inputs.constants.rvap * (1 / inputs.constants.tem00 - 1 / final.temp)) / (final.dens
        * inputs.constants.rvap * final.temp)
      dqs_final: qs_final / final.temp * ((inputs.constants.lhv0 + (inputs.constants.cpvap - inputs.constants.cl) * (final.temp
        - inputs.constants.tem00)) / (inputs.constants.rvap * final.temp) - 1)
