algorithm:
  algorithm_id: kessler_warm_rain_column
  execution_mode: conditional
  description: 'One call of one of the two published operations on one column of ka cells (k = 1..ka, interior k = ks..ke,
    the others halo cells that no operation reads). __adjustment performs one explicit Kessler warm-rain step over qv, qc,
    qr (autoconversion, accretion, rain evaporation, three ordered limiters, explicit update of T, cptot, cvtot) followed
    by the dependency''s saturation adjustment; __terminal_velocity evaluates the terminal velocity of cloud water (zero)
    and rain. Source: ATMOS_PHY_MP_kessler_adjustment / ATMOS_PHY_MP_kessler_terminal_velocity of scale_atmos_phy_mp_kessler
    (scale-met/scale-dev dc58155, EXACT thermodynamics, double precision). Every array argument has rank 1 and extent ka;
    every constant is an argument with no default value.'
  steps:
  - step_id: s_adj_01_guard
    step_kind: pointwise_process
    operation_ref: kessler_adjustment_input_guard
    inputs:
    - ka
    - ks
    - ke
    - dt
    - qv
    - qc
    - qr
    - cptot
    - cvtot
    outputs:
    - guard_pass
    description: __adjustment input guard, evaluated before any array is read outside 1..ka and before any state is written.
      Refuse (guard_pass = false) when ks < 1, ke > ka, ks > ke or dt <= 0 (these four first, so that no out-of-range cell
      is ever indexed), or when at any interior cell k = ks..ke qv(k) < 0, qc(k) < 0, qr(k) < 0, cptot(k) <= 0 or cvtot(k)
      <= 0. On refusal jump to s_adj_09_refusal. ka, ks, ke fix the column extent and the interior range of every later step;
      dt fixes the time step of the limiters and the update (case input time.dt). No negative value is silently clipped and
      the program is never terminated.
  - step_id: s_adj_02_save_state
    step_kind: pointwise_process
    operation_ref: kessler_adjustment_save_state
    inputs:
    - temp
    - qv
    - qc
    - qr
    - cptot
    - cvtot
    outputs:
    - temp_in
    - qv_in
    - qc_in
    - qr_in
    - cptot_in
    - cvtot_in
    description: Copy the six input-updated arrays, all ka cells, into temp_in, qv_in, qc_in, qr_in, cptot_in, cvtot_in, so
      that a later refusal (dependency guard false, or non-convergence, which happen after step 3 has rewritten the state)
      can restore every cell to its input value. These copies are also the input values T, qv, qc, qr, Cp, Cv of the formulas
      below.
  - step_id: s_adj_03_qsat
    step_kind: pointwise_process
    operation_ref: microphysics_saturation_liquid_1d_column__dens2qsat_liq
    inputs:
    - ka
    - ks
    - ke
    - temp
    - dens
    - rvap
    - cpvap
    - cl
    - lhv0
    - psat0
    - tem00
    outputs:
    - qsat_col
    - guard_qsat
    description: 'Dependency call microphysics_saturation_liquid_1d_column__dens2qsat_liq(ka, ks, ke, temp, dens, rvap, cpvap,
      cl, lhv0, psat0, tem00, qsat_col, guard_qsat) at the INPUT temp and dens, passing the six constants unchanged (case
      inputs constants.*). It returns q_s = qsat_col(k) at every interior cell. guard_qsat = false (it covers dens <= 0 and
      temp <= 0 at an interior cell) makes __adjustment refuse: jump to s_adj_09_refusal. No other saturation computation
      is allowed.'
  - step_id: s_adj_04_rates
    step_kind: source_term
    operation_ref: kessler_rates
    inputs:
    - qv_in
    - qc_in
    - qr_in
    - dens
    - pres
    - qsat_col
    - eps
    outputs:
    - d_auto
    - d_accr
    - s_ratio
    - d_evap
    description: 'For each interior cell, with rho = dens(k), p = pres(k), qv, qc, qr the input values and q_s = qsat_col(k):
      d_auto = 1.0e-3 * max(qc - 1.0e-3, 0); d_accr = 2.2 * qc * qr**0.875; S = qv / max(q_s, eps) (eps = case input constants.eps,
      the floor of the saturation mixing ratio); d_evap = (1 - min(S, 1)) * (1.6 + 124.9 * (rho*qr)**0.2046) * (rho*qr)**0.525
      * p*q_s / (rho * (5.4e5 * p*q_s + 2.55e8)). All rates in kg/kg/s. The numbers 1.0e-3, 2.2, 0.875, 1.6, 124.9, 0.2046,
      0.525, 5.4e5, 2.55e8 are constants of the scheme and part of the definition. qr**x at qr = 0 is 0.'
  - step_id: s_adj_05_limiters
    step_kind: source_term
    operation_ref: kessler_limited_tendencies
    inputs:
    - d_auto
    - d_accr
    - d_evap
    - qv_in
    - qc_in
    - qr_in
    - dt
    outputs:
    - dqc_t
    - dqr_t
    - dqv_t
    description: 'Limited tendencies, strictly in this order (reordering is forbidden), per interior cell: dqc_t = max(-d_auto
      - d_accr, -qc/dt); dqr_t = max(d_auto + d_accr - d_evap, -qr/dt); dqv_t = max(-(dqc_t + dqr_t), -qv/dt). dt is the case''s
      time step (time.dt). No further clipping of any result to non-negative is allowed beyond these limiters (a limited variable
      may end at about -1e-19 from rounding, as in the source).'
  - step_id: s_adj_06_update
    step_kind: time_integrate
    operation_ref: kessler_explicit_update
    inputs:
    - dqv_t
    - dqc_t
    - dqr_t
    - temp_in
    - qv_in
    - qc_in
    - qr_in
    - cptot_in
    - cvtot_in
    - dens
    - dt
    - cpvap
    - cl
    - cvv
    - L00
    outputs:
    - qv
    - qc
    - qr
    - temp
    - cptot
    - cvtot
    - rhoe_t
    - qc_star
    description: 'Per interior cell, from the input values: qv <- qv + dqv_t*dt; qc <- qc + dqc_t*dt; qr <- qr + dqr_t*dt;
      edot = -L00*dqv_t; Cp'' = Cp + (cpvap*dqv_t + cl*(dqc_t + dqr_t))*dt; Cv'' = Cv + (cvv*dqv_t + cl*(dqc_t + dqr_t))*dt;
      T <- (T*Cv + edot*dt)/Cv'' where Cv is the value BEFORE its own update; cptot <- Cp'', cvtot <- Cv''; rhoe_t(k) = rho*edot.
      Then qc_star(k) = qc after this step (the q_c* of the spec). Halo cells are not written.'
  - step_id: s_adj_07_saturation
    step_kind: iterative_solve
    operation_ref: microphysics_saturation_liquid_1d_column__saturation_adjustment
    inputs:
    - ka
    - ks
    - ke
    - dens
    - temp
    - qv
    - qc
    - cptot
    - cvtot
    - rvap
    - cpvap
    - cl
    - lhv0
    - psat0
    - tem00
    outputs:
    - temp
    - qv
    - qc
    - cptot
    - cvtot
    - rhoe_d
    - converged
    - guard_satadj
    description: 'Dependency call microphysics_saturation_liquid_1d_column__saturation_adjustment(ka, ks, ke, dens, temp,
      qv, qc, cptot, cvtot, rvap, cpvap, cl, lhv0, psat0, tem00, rhoe_d, converged, guard_satadj) on the state after s_adj_06,
      the six constants passed unchanged. It updates temp, qv, qc, cptot, cvtot of the interior cells in place (Newton iteration
      on temp with stop |delta| < 1e-6 K, owned by the dependency) and returns rhoe_d = -L00*dqv_sat*rho, the density of internal
      energy released over its own change of qv. qr is not passed and is not touched. guard_satadj = false or converged =
      false makes __adjustment refuse: jump to s_adj_09_refusal (the state has already been rewritten, so the restore is required).'
  - step_id: s_adj_08_finalize
    step_kind: diagnostic
    operation_ref: kessler_finalize_outputs
    inputs:
    - rhoe_t
    - rhoe_d
    - qc
    - qc_star
    - dens
    - dt
    - dwatr
    - ka
    - ks
    - ke
    outputs:
    - rhoe_t
    - pcsat
    - evaporate
    - guard_pass
    description: 'Per interior cell: rhoe_t <- rhoe_t + rhoe_d/dt; pcsat = (qc - qc_star)/dt, qc the value after the saturation
      step; evaporate = max(-pcsat, 0) * rho / ((4/3)*pi*dwatr*rc**3) with the droplet radius rc = 8.0e-6 m (dwatr = case
      input constants.dwatr). At every halo cell (k < ks or k > ke) rhoe_t, evaporate and pcsat are set to 0; the input-updated
      arrays keep their input values at halo cells (no step writes them). guard_pass = true.'
  - step_id: s_adj_09_refusal
    step_kind: pointwise_process
    operation_ref: kessler_adjustment_refusal
    inputs:
    - temp_in
    - qv_in
    - qc_in
    - qr_in
    - cptot_in
    - cvtot_in
    outputs:
    - temp
    - qv
    - qc
    - qr
    - cptot
    - cvtot
    - guard_pass
    - rhoe_t
    - evaporate
    - pcsat
    description: 'Reached only on a refusal. guard_pass = false. If the state was saved (refusal at or after s_adj_03), restore
      temp, qv, qc, qr, cptot, cvtot from the saved copies at EVERY cell (whole column); a refusal in s_adj_01 writes no input-updated
      array at all. The outputs rhoe_t, evaporate, pcsat are not defined by the spec on a refusal; set them to 0 at every
      cell 1..ka so that no non-finite value is published (when ks, ke are out of range, only 1..ka is written). Return normally:
      never terminate the program.'
  - step_id: s_tv_01_guard
    step_kind: pointwise_process
    operation_ref: kessler_terminal_velocity_input_guard
    inputs:
    - ka
    - ks
    - ke
    - dens
    - refstate_dens
    outputs:
    - guard_pass
    description: '__terminal_velocity input guard: refuse (guard_pass = false) when ks < 1, ke > ka or ks > ke (checked first,
      before any array access), or when dens(k) <= 0 or refstate_dens(k) <= 0 at any interior cell k = ks..ke. On refusal
      vterm_c, vterm_r are not defined by the spec; set them to 0 at every cell 1..ka and return without terminating.'
  - step_id: s_tv_02_vterm
    step_kind: pointwise_process
    operation_ref: kessler_terminal_velocity
    inputs:
    - ka
    - ks
    - ke
    - dens
    - rhoq_c
    - rhoq_r
    - refstate_dens
    outputs:
    - vterm_c
    - vterm_r
    - guard_pass
    description: 'For k = ks..ke: vterm_c(k) = 0; qr = rhoq_r(k)/dens(k); z = 1 when qr < 1.0e-12, z = 0 otherwise; vterm_r(k)
      = -36.34 * (dens(k)*(qr + z))**0.1364 * refstate_dens(ks)/refstate_dens(k) * (1 - z) (m/s, negative downward). rhoq_c
      is part of the signature and is NOT read. At every halo cell vterm_c = vterm_r = 0. guard_pass = true. Pointwise in
      k except the read of refstate_dens(ks) in every cell.'
  ordering:
  - s_adj_01_guard
  - s_adj_02_save_state
  - s_adj_03_qsat
  - s_adj_04_rates
  - s_adj_05_limiters
  - s_adj_06_update
  - s_adj_07_saturation
  - s_adj_08_finalize
  - s_adj_09_refusal
  - s_tv_01_guard
  - s_tv_02_vterm
  control_condition:
    dispatch: 'The case input `operation` selects the published operation case_run calls once: `adjustment` -> microphysics_kessler_warm_rain_1d_column__adjustment
      (steps s_adj_01 .. s_adj_09), `terminal_velocity` -> microphysics_kessler_warm_rain_1d_column__terminal_velocity (steps
      s_tv_01, s_tv_02). The case''s grid.ka, grid.ks, grid.ke are passed as ka, ks, ke, time.dt as dt (adjustment only),
      constants.* as the eight constant arguments (adjustment only; terminal_velocity takes no constant).'
    adjustment_branches:
    - s_adj_01_guard refuses -> s_adj_09_refusal (no state written, nothing to restore)
    - guard_qsat false after s_adj_03 -> s_adj_09_refusal (restore from saved copies)
    - guard_satadj false or converged false after s_adj_07 -> s_adj_09_refusal (restore from saved copies)
    - otherwise s_adj_08_finalize; s_adj_09_refusal is skipped
    terminal_velocity_branches:
    - s_tv_01_guard refuses -> return with guard_pass false
    - otherwise s_tv_02_vterm
  iteration_contract:
    kind: none
    reason: Each operation is a single evaluation of one column with no top-level loop; the stepping is a problem runner's.
      The Newton iteration of the saturation step is internal to the dependency call s_adj_07_saturation.
  update_semantics:
    target_variables:
    - temp
    - qv
    - qc
    - qr
    - cptot
    - cvtot
    - rhoe_t
    - evaporate
    - pcsat
    - vterm_c
    - vterm_r
    - guard_pass
    update_order: sequential
    in_place:
    - temp
    - qv
    - qc
    - qr
    - cptot
    - cvtot
    notes: temp, qv, qc, qr, cptot, cvtot are intent inout (updated in place at interior cells, kept at halo cells); rhoe_t,
      evaporate, pcsat (adjustment) and vterm_c, vterm_r (terminal_velocity) are intent out (0 at halo cells); guard_pass
      is a logical out. A variable the called operation does not publish keeps its setup value.
  temporaries:
  - name: temp_in
    shape_expr: '[ka]'
  - name: qv_in
    shape_expr: '[ka]'
  - name: qc_in
    shape_expr: '[ka]'
  - name: qr_in
    shape_expr: '[ka]'
  - name: cptot_in
    shape_expr: '[ka]'
  - name: cvtot_in
    shape_expr: '[ka]'
  - name: qsat_col
    shape_expr: '[ka]'
  - name: guard_qsat
    shape_expr: scalar
  - name: qc_star
    shape_expr: '[ka]'
  - name: rhoe_d
    shape_expr: '[ka]'
  - name: converged
    shape_expr: scalar
  - name: guard_satadj
    shape_expr: scalar
  derived_field_rules:
  - name: cvv
    expression: cvv = cpvap - rvap
    description: Specific heat of water vapour at constant volume, from the case's constants.
  - name: L00
    expression: L00 = lhv0 - (cpvap - cl) * tem00
    description: Latent heat of vaporization extrapolated to 0 K, from the case's constants.
  - name: d_auto
    shape_expr: '[ka]'
    expression: d_auto(k) = 1.0e-3 * max(qc_in(k) - 1.0e-3, 0)
    description: Autoconversion rate (kg/kg/s); max is a non-differentiable operation.
  - name: d_accr
    shape_expr: '[ka]'
    expression: d_accr(k) = 2.2 * qc_in(k) * qr_in(k)**0.875
    description: Accretion rate (kg/kg/s); the power at qr = 0 is non-differentiable.
  - name: s_ratio
    shape_expr: '[ka]'
    expression: s_ratio(k) = qv_in(k) / max(qsat_col(k), eps)
    description: Saturation ratio with the floor eps on the saturation mixing ratio.
  - name: d_evap
    shape_expr: '[ka]'
    expression: d_evap(k) = (1 - min(s_ratio(k), 1)) * (1.6 + 124.9*(dens(k)*qr_in(k))**0.2046) * (dens(k)*qr_in(k))**0.525
      * pres(k)*qsat_col(k) / (dens(k) * (5.4e5*pres(k)*qsat_col(k) + 2.55e8))
    description: Rain evaporation rate (kg/kg/s); min(S, 1) keeps it non-negative above saturation.
  - name: dqc_t
    shape_expr: '[ka]'
    expression: dqc_t = max(-d_auto - d_accr, -qc_in/dt)
    description: Limited cloud tendency, first of the three ordered limiters.
  - name: dqr_t
    shape_expr: '[ka]'
    expression: dqr_t = max(d_auto + d_accr - d_evap, -qr_in/dt)
    description: Limited rain tendency, second limiter.
  - name: dqv_t
    shape_expr: '[ka]'
    expression: dqv_t = max(-(dqc_t + dqr_t), -qv_in/dt)
    description: Limited vapour tendency, third limiter; where it binds total water is not conserved, as in the source.
  - name: case_initial_state
    expression: 'For every state variable X: X(k) = initial.setup.X at every k = 1..ka; then a initial.columns.X rule replaces
      cells k = 2..7 (always these six cells, built with ks = 2, ke = 7 whatever grid.ks, grid.ke the case passes to the operation):
      a two-number list [a, b] gives X(k) = a + b*(k - 2); a mapping {cells: [v1..v6]} gives X(k) = v_(k-1) literally. When
      the case has a columns.qv rule, cells 2..7 of cptot and cvtot are the moist mixture qd = 1 - qv - qc - qr, cptot = qd*cpdry
      + cpvap*qv + cl*(qc + qr), cvtot = qd*(cpdry - rdry) + (cpvap - rvap)*qv + cl*(qc + qr), with cpdry, rdry the case''s
      air.cpdry, air.rdry and cpvap, rvap, cl the case''s constants. Finally each initial.overrides entry {var, k, value}
      sets X(k) = value after every other rule.'
    description: case_setup's construction of the bound state from the case inputs (initial.setup, initial.columns, initial.overrides,
      air, constants); the outputs rhoe_t, evaporate, pcsat, vterm_c, vterm_r start at the sentinel -999 of setup, and every
      halo sentinel is positive for the inputs. These fix temp, dens, pres, qv, qc, qr, cptot, cvtot, rhoq_c, rhoq_r, refstate_dens
      before the call.
  - name: guard_pass_record
    expression: guard_pass = -1.0 after case_setup; 1.0 when the called operation returned guard_pass true; 0.0 when it returned
      false
    description: The checks module records the operation's logical guard_pass result as a number (a bound state variable is
      real); -1 means the operation was not called.
  - name: perf_counters
    expression: steps = 1; cells_updated = ke - ks + 1 on an accepted call, 0 on a refused one
    description: case_run's perf counters for a single-evaluation component, from the case's grid.ks, grid.ke.
  invariants:
  - 'On a call guard_pass accepts: temp, qv, qc, qr, cptot, cvtot keep their input values at every halo cell, and rhoe_t,
    evaporate, pcsat, vterm_c, vterm_r hold 0 at every halo cell.'
  - On a refusal guard_pass is false and temp, qv, qc, qr, cptot, cvtot hold their input values at EVERY cell, including after
    step 3 rewrote them and the dependency then refused or did not converge.
  - No operation reads or writes a halo cell other than as stated; __terminal_velocity reads refstate_dens(ks) in every interior
    cell.
  - Where the dqv_t limiter does not bind, step 3 conserves qv + qc + qr and T*Cv + qv*L00; the saturation step conserves
    qv + qc and T*Cv + qv*L00 to within its 1e-6 K threshold; so rhoe_t*dt = -rho*L00*(qv_final - qv_input).
  - No constant has a default value and none is read from anything but the arguments; no saturation computation other than
    the dependency's two operations; the limiter order is fixed and no extra clipping to non-negative is applied.
  - The program is never terminated on a refusal, an invalid input is never silently completed, and no non-finite value is
    published.
  - 'AD readiness: max/min of the rates and limiters, the switch z of terminal_velocity, the powers of qr at qr = 0, the dependency''s
    iteration, and the refusal are non-differentiable operations.'
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
