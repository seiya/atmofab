  - test_id: l0_alt_constants_pass
    quantity: alt_constants
    target_cases:
    - l0_alt_evaporation
    - l0_alt_cloud
    case: l0_alt_evaporation
    bind:
      interior: min(1, max(0, floor(c) - (inputs.grid.ks - 2))) * min(1, max(0, inputs.grid.ke - floor(c)))
      halo: 1 - interior
      L00: inputs.constants.lhv0 - (inputs.constants.cpvap - inputs.constants.cl) * inputs.constants.tem00
      qs: inputs.constants.psat0 * exp(log(initial.temp / inputs.constants.tem00) * (inputs.constants.cpvap - inputs.constants.cl)
        / inputs.constants.rvap + L00 / inputs.constants.rvap * (1 / inputs.constants.tem00 - 1 / initial.temp)) / (initial.dens
        * inputs.constants.rvap * initial.temp)
      sliq: initial.qv / max(qs, inputs.constants.eps)
      pq: initial.pres * qs
      dq_evap: (1 - min(sliq, 1)) * (1.6 + 124.9 * (initial.dens * initial.qr) ** 0.2046) * (initial.dens * initial.qr) **
        0.525 * pq / (initial.dens * (5.4e5 * pq + 2.55e8))
      ref: dq_evap * inputs.time.dt
      dv: final.qv - initial.qv
    expr: max(interior * abs(dv - ref) / (ref + halo))
    op: le
    value: 1.0e-12
  - test_id: l0_alt_constants_pass
