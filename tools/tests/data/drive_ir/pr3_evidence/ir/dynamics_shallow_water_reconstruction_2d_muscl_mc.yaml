    deps: spec/component/dynamics/shallow_water/dynamics_shallow_water_reconstruction_2d_muscl_mc/deps.yaml
  description: 'Piecewise-linear (MUSCL, p1) reconstruction of one ghost-filled scalar field with the monotonized-central
    (MC) limiter: x-interface states U_L/U_R and y-interface states U_B/U_T of the interior. Dimensionless (no grid spacing
    enters). No ghost fill, no flux, no time integration. Expected-array case inputs (inputs.expected.*) are nested lists
    whose OUTER index is the FIRST array index (m or i) and whose inner index is the second (j or n), matching the captured
    array shapes [nx_plus_1, ny] and [nx, ny_plus_1].'
