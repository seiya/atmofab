    reads no element of U_in; otherwise it computes the MC-limited slopes along x and along y (steps 03-04) and the interface
    states (steps 05-06).
  steps:
  - step_id: step_02_input_guard
    step_kind: diagnostic
    operation_ref: muscl_mc_input_guard
    inputs:
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    outputs:
    - grid_valid_flag
    - U_L
    - U_R
    - U_B
    - U_T
    description: 'First action of dynamics_shallow_water_reconstruction_2d_muscl_mc__reconstruct (controlled spec section
      4). grid_valid_flag = NOT (ng < 2 OR nx < 1 OR ny < 1 OR nx_total /= nx + 2*ng OR ny_total /= ny + 2*ng). The two padded-extent
      clauses are EQUALITY tests (an inequality such as nx_total <= nx+2*ng is wrong: it accepts the too-small extent). When
      grid_valid_flag is false: set every element of U_L, U_R, U_B, U_T to exactly 0, return grid_valid = .false., and read
      NO element of U_in (steps 03-06 are skipped). ng < 2 is invalid because the slope of the ghost cell adjacent to the
      interior reads the ghost cell beyond it.'
  - step_id: step_03_slope_x
    step_kind: reconstruct
    operation_ref: muscl_mc_slope_x
    inputs:
    - U_in
    - nx
    - ny
    - ng
    - grid_valid_flag
    outputs:
    - sigma_x
    description: 'Only when grid_valid_flag is true. For every interior padded row r = ng+1..ng+ny and every padded column
      c = ng..ng+nx+1: a = U_in(c,r) - U_in(c-1,r), b = U_in(c+1,r) - U_in(c,r), sigma_x(c,r) = mc_slope(a, b) (derived rule
      mc_slope). Reads columns ng-1..ng+nx+2 only. Each cell''s slope is one value, computed from that cell''s own three values
      along its own row, and used on both of its faces. Not divided by any grid spacing.'
  - step_id: step_04_slope_y
    step_kind: reconstruct
    operation_ref: muscl_mc_slope_y
    inputs:
    - U_in
    - nx
    - ny
    - ng
    - grid_valid_flag
    outputs:
    - sigma_y
    description: 'Only when grid_valid_flag is true. For every interior padded column q = ng+1..ng+nx and every padded row
      c = ng..ng+ny+1: a = U_in(q,c) - U_in(q,c-1), b = U_in(q,c+1) - U_in(q,c), sigma_y(q,c) = mc_slope(a, b) (derived rule
      mc_slope). Reads rows ng-1..ng+ny+2 only. Same limiter function as the x direction, evaluated along the y axis of the
      field itself (no transposition of the input in place of a call).'
  - step_id: step_05_x_interface_states
    step_kind: reconstruct
    operation_ref: muscl_mc_x_interface_states
    inputs:
    - U_in
    - sigma_x
    - nx
    - ny
    - ng
    - grid_valid_flag
    outputs:
    - U_L
    - U_R
    description: 'Only when grid_valid_flag is true. For m = 1..nx+1 and j = 1..ny, with c_L = ng+m-1, c_R = ng+m and padded
      row r = ng+j: U_L(m,j) = U_in(c_L,r) + 0.5*sigma_x(c_L,r); U_R(m,j) = U_in(c_R,r) - 0.5*sigma_x(c_R,r). Interface 1
      is the west face of the first interior cell (its left cell ng is a ghost), interface nx+1 the east face of the last
      interior cell (its right cell ng+nx+1 is a ghost). U_in is never written.'
  - step_id: step_06_y_interface_states
    step_kind: reconstruct
    operation_ref: muscl_mc_y_interface_states
    inputs:
    - U_in
    - sigma_y
    - nx
    - ny
    - ng
    - grid_valid_flag
    outputs:
    - U_B
    - U_T
    description: 'Only when grid_valid_flag is true. For i = 1..nx and n = 1..ny+1, with c_B = ng+n-1, c_T = ng+n and padded
      column q = ng+i: U_B(i,n) = U_in(q,c_B) + 0.5*sigma_y(q,c_B); U_T(i,n) = U_in(q,c_T) - 0.5*sigma_y(q,c_T). On valid
      input the operation returns grid_valid = .true.'
  ordering:
  - step_02_input_guard
  - step_03_slope_x
  - step_04_slope_y
  - step_05_x_interface_states
  - step_06_y_interface_states
  control_condition: 'If grid_valid (step_02) is false, steps 03-06 are skipped: the operation has written zeros into U_L,
    U_R, U_B, U_T, returns grid_valid false and reads no element of U_in. Otherwise steps 03-06 run.'
  iteration_contract: {}
  update_semantics:
    target_variables:
    - U_L
    - U_R
    - U_B
    - U_T
    - grid_valid
    update_order: sequential
    description: The four interface arrays are pure outputs written once per call (separate from U_in, so no cell is read
      after being written); U_in is intent(in) and never modified.
  temporaries:
  - name: sigma_x
    shape_expr: '[nx_plus_2, ny]'
    description: MC-limited x slope at padded columns ng..ng+nx+1 (nx_plus_2 = nx + 2 values) of each interior row.
  - name: sigma_y
    shape_expr: '[nx, ny_plus_2]'
    description: MC-limited y slope at padded rows ng..ng+ny+1 (ny_plus_2 = ny + 2 values) of each interior column.
  - name: grid_valid_flag
    shape_expr: scalar
    description: The operation's logical grid_valid output argument.
  derived_field_rules:
  - name: mc_slope
    consumed_by:
    - step_03_slope_x
    - step_04_slope_y
    definition: mc_slope(a, b) = 0 if a*b <= 0; otherwise sign(a) * min(2*abs(a), 2*abs(b), 0.5*abs(a+b)).
    description: 'Monotonized-central (MC) limiter of controlled spec section 3. The three arguments are the two one-sided
      differences doubled and the central difference (a+b)/2, all in absolute value (omitting the absolute values is wrong:
      it fails for negative differences). Odd in the field: mc_slope(-a,-b) = -mc_slope(a,b). Forbidden: minmod, van Leer,
      superbee, the unlimited central difference, or no limiter. The branch on sign(a*b), the min and sign are the non-differentiable
      discrete operations (AD preparation: ad_readiness.enabled = true, made explicit). Properties: constant field -> slope
      0; linear field -> slope equals its exact difference (reconstruction exact); local extremum or flat side of a step ->
      slope 0, so no interface state lies outside the range of the two cell values it is built from.'
  - name: padded_extent_dims
    consumed_by:
    - step_02_input_guard
    definition: nx_plus_1 = nx + 1; ny_plus_1 = ny + 1; nx_plus_2 = nx + 2; ny_plus_2 = ny + 2; valid padded extents satisfy
      nx_total = nx + 2*ng and ny_total = ny + 2*ng.
    description: Named dimension symbols used by shape_expr tokens. U_L, U_R have shape (nx+1, ny); U_B, U_T have shape (nx,
      ny+1); U_in has shape (nx_total, ny_total) as allocated by the caller.
  invariants:
  - 'Index convention: padded i=1..nx_total, j=1..ny_total; interior i=ng+1..ng+nx, j=ng+1..ng+ny. x interface m (1..nx+1)
    lies between padded columns ng+m-1 and ng+m; y interface n (1..ny+1) between padded rows ng+n-1 and ng+n.'
  - The operation reads U_in only at padded columns ng-1..ng+nx+2 and padded rows ng-1..ng+ny+2, and never re-derives or overwrites
    a ghost value; it reads no element of U_in on a rejected input.
  - A cell's slope is its own (from its own three cell values along the face axis) on both of its faces; never a neighbouring
    cell's or a different row's/column's.
  - 'No grid spacing enters: the slope is a difference of neighbouring cell values and an interface state is the cell value
    plus or minus half of it.'
  - A call is never computed through another call (no detecting that U_in is a transpose or reversal of another field). Applying
    one axis routine along each axis in turn is allowed; each set of interface states is reconstructed along its own axis.
  - 'On a rejected input (ng<2, nx<1, ny<1, nx_total/=nx+2*ng, ny_total/=ny+2*ng): grid_valid is false and every element of
    U_L, U_R, U_B, U_T is exactly 0.'
  - With a mirror ghost at a y wall, the wall-interface states are equal for an even field and opposite for an odd field (known
    property, controlled spec section 2).
  - The published procedure header carries no prefix the signature block does not declare (e.g. no pure attribute).
  splitting_policy:
    kind: none
    description: Each axis is reconstructed directly; no operator splitting.
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
