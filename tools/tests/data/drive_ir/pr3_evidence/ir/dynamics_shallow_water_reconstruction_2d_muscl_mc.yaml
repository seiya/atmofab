    description: Ghost width, inputs.grid.ng; integer argument; must be >= 2.
  - name: nx_total
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: Padded x extent, inputs.grid.nx_total; integer argument and first allocated extent of U_in; must equal nx
      + 2*ng.
  - name: ny_total
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: Padded y extent, inputs.grid.ny_total; integer argument and second allocated extent of U_in; must equal ny
      + 2*ng.
  - name: U_in
