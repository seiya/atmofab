algorithm:
  algorithm_id: rusanov_p0_interface_flux
  execution_mode: sequence
  description: 'One pointwise call of the published operation dynamics_shallow_water_flux_2d_rusanov_p0__compute_flux per
    interface pair: given the x-interface left/right states U_L, U_R, the y-interface bottom/top states U_B, U_T (each U =
    [h, hu, hv], first-order p0 reconstruction already done by the caller) and g, it returns the Rusanov fluxes F_star (x)
    and G_star (y), each ordered [h, hu, hv], the wave speeds a_x, a_y, and the input guard guard_ok. No time stepping, no
    boundary handling, no grid loop (vectorisation over a grid is the caller''s).'
  steps:
  - step_id: step_01_input_guard
    step_kind: pointwise_process
    operation_ref: input_guard
    inputs:
    - U_L
    - U_R
    - U_B
    - U_T
    outputs:
    - guard_ok
    description: "guard_ok = (U_L(1) > 0) and (U_R(1) > 0) and (U_B(1) > 0) and (U_T(1) > 0), i.e. every one of the four depths\
      \ h (component 1 of each state, 1-based) is strictly positive. h <= 0 in any state is invalid input and an error (controlled_spec\
      \ \xA74): guard_ok = false and steps 02-04 are NOT executed (no sqrt of a non-positive depth, no division by h). The\
      \ values of F_star, G_star, a_x, a_y on a rejected input are not defined by the spec; the implementation still assigns\
      \ every out argument a defined finite value (zero) on that path so no undefined memory is returned. Per case the four\
      \ states are the case inputs initial.U_L/U_R/U_B/U_T; in l0_invalid_dry U_L has h = 0, so the guard rejects it."
  - step_id: step_02_wave_speed
    step_kind: pointwise_process
    operation_ref: rusanov_wave_speed
    inputs:
    - U_L
    - U_R
    - U_B
    - U_T
    - g
    outputs:
    - u_L
    - u_R
    - v_B
    - v_T
    - c_L
    - c_R
    - c_B
    - c_T
    - a_x
    - a_y
    description: 'Normal velocities and gravity-wave speeds per derived_field_rules: u_L = hu_L/h_L, u_R = hu_R/h_R (x interface,
      normal component hu), v_B = hv_B/h_B, v_T = hv_T/h_T (y interface, normal component hv), c_S = sqrt(g*h_S) for each
      side S in {L, R, B, T} with g the case input constants.g. a_x = max(|u_L| + c_L, |u_R| + c_R), a_y = max(|v_B| + c_B,
      |v_T| + c_T). The absolute value is required (a = u + c without abs is wrong); max and abs are explicit non-differentiable
      operations (AD readiness).'
  - step_id: step_03_physical_flux
    step_kind: flux_compute
    operation_ref: physical_flux_xy
    inputs:
    - U_L
    - U_R
    - U_B
    - U_T
    - g
    outputs:
    - F_L
    - F_R
    - G_B
    - G_T
    description: 'Physical shallow-water fluxes from each interface''s own two states: x flux F(U) = [hu, hu*hu/h + g*h*h/2,
      hu*hv/h] evaluated at U_L (-> F_L) and U_R (-> F_R); y flux G(U) = [hv, hu*hv/h, hv*hv/h + g*h*h/2] evaluated at U_B
      (-> G_B) and U_T (-> G_T); g is the case input constants.g.'
  - step_id: step_04_rusanov_flux
    step_kind: flux_compute
    operation_ref: rusanov_flux_2d
    inputs:
    - F_L
    - F_R
    - G_B
    - G_T
    - U_L
    - U_R
    - U_B
    - U_T
    - a_x
    - a_y
    outputs:
    - F_star
    - G_star
    description: 'Rusanov (local Lax-Friedrichs) numerical flux, component-wise over [h, hu, hv]: F_star = 0.5*(F_L + F_R)
      - 0.5*a_x*(U_R - U_L); G_star = 0.5*(G_B + G_T) - 0.5*a_y*(U_T - U_B). The x flux is dissipated with a_x and the y flux
      with a_y (never swapped). Output order is [h, hu, hv], aligned with U.'
  ordering:
  - step_01_input_guard
  - step_02_wave_speed
  - step_03_physical_flux
  - step_04_rusanov_flux
  control_condition: step_01_input_guard always runs; steps 02, 03 and 04 run only when guard_ok is true (all four depths
    h > 0). When guard_ok is false the operation returns immediately with guard_ok = false and every other out argument assigned
    zero.
  iteration_contract:
    applies: false
    rationale: Single pointwise call per interface pair; no loop counter and no stop condition. Time marching belongs to the
      caller.
  update_semantics:
    target_variables:
    - F_star
    - G_star
    - a_x
    - a_y
    - guard_ok
    update_order: sequential
    notes: All outputs are intent(out) arguments written once per call; the input states are never modified.
  temporaries:
  - name: u_L
    shape_expr: scalar
  - name: u_R
    shape_expr: scalar
  - name: v_B
    shape_expr: scalar
  - name: v_T
    shape_expr: scalar
  - name: c_L
    shape_expr: scalar
  - name: c_R
    shape_expr: scalar
  - name: c_B
    shape_expr: scalar
  - name: c_T
    shape_expr: scalar
  - name: F_L
    shape_expr: '[3]'
  - name: F_R
    shape_expr: '[3]'
  - name: G_B
    shape_expr: '[3]'
  - name: G_T
    shape_expr: '[3]'
  derived_field_rules:
  - name: u_L
    rule: u_L = U_L(2) / U_L(1)
    description: x-normal velocity of the left state (hu/h); consumed by step_02_wave_speed.
  - name: u_R
    rule: u_R = U_R(2) / U_R(1)
    description: x-normal velocity of the right state (hu/h).
  - name: v_B
    rule: v_B = U_B(3) / U_B(1)
    description: y-normal velocity of the bottom state (hv/h).
  - name: v_T
    rule: v_T = U_T(3) / U_T(1)
    description: y-normal velocity of the top state (hv/h).
  - name: c_L
    rule: c_S = sqrt(g * U_S(1)) for S in {L, R, B, T} (c_L, c_R, c_B, c_T)
    description: Gravity-wave speed of each side; g is the operation's g argument (case input constants.g).
  - name: a_x
    rule: a_x = max(abs(u_L) + c_L, abs(u_R) + c_R)
    description: Rusanov wave speed of the x interface (published output).
  - name: a_y
    rule: a_y = max(abs(v_B) + c_B, abs(v_T) + c_T)
    description: Rusanov wave speed of the y interface (published output).
  - name: F_L
    rule: F(U) = [U(2), U(2)*U(2)/U(1) + g*U(1)*U(1)/2, U(2)*U(3)/U(1)]; F_L = F(U_L), F_R = F(U_R)
    description: Physical x flux of each side of the x interface.
  - name: G_B
    rule: G(U) = [U(3), U(2)*U(3)/U(1), U(3)*U(3)/U(1) + g*U(1)*U(1)/2]; G_B = G(U_B), G_T = G(U_T)
    description: Physical y flux of each side of the y interface.
  - name: F_star
    rule: F_star = 0.5*(F_L + F_R) - 0.5*a_x*(U_R - U_L)
    description: Rusanov x-interface numerical flux, ordered [h, hu, hv].
  - name: G_star
    rule: G_star = 0.5*(G_B + G_T) - 0.5*a_y*(U_T - U_B)
    description: Rusanov y-interface numerical flux, ordered [h, hu, hv].
  invariants:
  - 'Reconstruction is fixed to first-order p0: the supplied interface states are used as-is; no automatic switching of the
    reconstruction order and no limiter, implicit or explicit.'
  - Each flux is evaluated from its own interface's two states exactly as defined; a call is never computed through another
    call (no detection of exchanged/mirrored/side-swapped inputs followed by transforming another configuration's fluxes back).
  - 'Evaluating both the x and y flux with one routine written in normal/tangential momentum (states passed as [h, normal,
    tangential], results put back as [h, hu, hv]) is permitted: each flux is still evaluated from its own two states.'
  - With U_L == U_R the dissipation term vanishes and F_star == F(U_L); with U_B == U_T, G_star == G(U_B).
  - a_x >= 0 and a_y >= 0 whenever guard_ok is true.
  - guard_ok is false iff some depth h <= 0 among U_L, U_R, U_B, U_T; then no flux is computed.
  - No boundary conditions are applied; the operation is pointwise per interface and independent of its position.
  - 'AD readiness: ad_readiness.enabled = true; max and abs are explicit non-differentiable operations.'
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
  inputs:
  - name: U_L
    shape_expr: '[3]'
    evidence_ref: raw/state_snapshots
    description: Interface state [h, hu, hv]; before the call the case input initial.U_L.
  - name: U_R
    shape_expr: '[3]'
    evidence_ref: raw/state_snapshots
    description: Interface state [h, hu, hv]; before the call the case input initial.U_R.
  - name: U_B
