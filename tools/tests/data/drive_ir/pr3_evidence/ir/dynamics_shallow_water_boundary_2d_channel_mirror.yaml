algorithm:
  algorithm_id: channel_mirror_ghost_mapping
  execution_mode: conditional
  steps:
  - step_id: step_01_input_guard
    step_kind: diagnostic
    operation_ref: input_guard
    inputs:
    - nx
    - ny
    - ng
    - wall_axis
    outputs:
    - grid_valid_op
    description: First action of dynamics_shallow_water_boundary_2d_channel_mirror__apply (controlled spec section
      4). grid_valid_op = (nx >= 2) and (ny >= 2) and (ng >= 1) and (ng <= nx) and (ng <= ny) and (wall_axis ==
      1 or wall_axis == 2). Every clause is checked independently of wall_axis, so ng>nx and ng>ny are refused in
      either orientation. If grid_valid_op is false the operation returns immediately with grid_valid = false, performs
      no index access into U_in, and U_out is not a valid mapping (it must still be assigned, e.g. left as a copy-free
      defined value such as zeros; no test reads it). No fallback to another boundary treatment.
  - step_id: step_02_periodic_wrap
    step_kind: boundary_apply
    operation_ref: periodic_wrap
    inputs:
    - U_in
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    - wall_axis
    outputs:
    - U_out
    description: 'Step 1 of __apply, only when grid_valid_op is true: the periodic mapping along the axis that is
      NOT wall_axis, reading interior cells of U_in only (ghost cells of U_in are never read). wall_axis = 2 (periodic
      in i): for every interior row j = ng+1..ng+ny: U_out(i,j) = U_in(i,j) for i = ng+1..ng+nx; U_out(k,j) = U_in(k+nx,j)
      for k = 1..ng; U_out(ng+nx+k,j) = U_in(ng+k,j) for k = 1..ng. wall_axis = 1 (periodic in j): for every interior
      column i = ng+1..ng+nx: U_out(i,j) = U_in(i,j) for j = ng+1..ng+ny; U_out(i,k) = U_in(i,k+ny) for k = 1..ng;
      U_out(i,ng+ny+k) = U_in(i,ng+k) for k = 1..ng. Each orientation is computed along its own axes; realising
      one through the other (transpose, map at the other wall_axis, transpose back) is forbidden. The axis is chosen
      from wall_axis alone.'
  - step_id: step_03_wall_mirror
    step_kind: boundary_apply
    operation_ref: wall_mirror
    inputs:
    - U_out
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    - wall_axis
    - odd_at_wall
    - s
    outputs:
    - U_out
    description: 'Step 2 of __apply, after step_02 and only when grid_valid_op is true: the mirror (free-slip wall)
      mapping along wall_axis, READ FROM U_out as completed by step_02 (never from U_in), with s = -1 when odd_at_wall
      is true and s = +1 when false. wall_axis = 2 (walls at the ends of j): for every column i = 1..nx_total and
      k = 1..ng: U_out(i, ng-k+1) = s*U_out(i, ng+k); U_out(i, ng+ny+k) = s*U_out(i, ng+ny-k+1). wall_axis = 1 (walls
      at the ends of i): for every row j = 1..ny_total and k = 1..ng: U_out(ng-k+1, j) = s*U_out(ng+k, j); U_out(ng+nx+k,
      j) = s*U_out(ng+nx-k+1, j). Because the mirror runs over every line including the periodic ghost lines of
      step_02, the corner ghost cells are the (signed) mirror of the periodic images and every cell of U_out is
      defined. Interior cells are never sign-reversed. Then grid_valid = true is returned. No periodic fallback
      on the wall axis, no extrapolated ghost, no direct wall flux.'
  ordering:
  - step_01_input_guard
  - step_02_periodic_wrap
  - step_03_wall_mirror
  control_condition:
  - 'step_01_input_guard: if grid_valid_op is false, skip step_02 and step_03 and return grid_valid = false'
  - 'step_02 and step_03 dispatch on wall_axis: wall_axis == 2 selects the periodic-in-i / mirror-in-j formulas,
    wall_axis == 1 the periodic-in-j / mirror-in-i formulas'
  - the sign s of step_03 is selected by odd_at_wall alone
  iteration_contract:
    applies: false
    rationale: the operation maps one field once; there is no time loop or iteration in this component
  update_semantics:
    target_variables:
    - U_out
    - grid_valid
    update_order: sequential
    notes: U_out is intent(out), separate from U_in (intent(in)); no in-place mapping and no aliasing of the two
  temporaries:
  - name: grid_valid_op
    shape_expr: scalar
  derived_field_rules:
  - name: s
    rule: s = -1 when odd_at_wall is true, s = +1 when odd_at_wall is false (odd reflection for the wall-normal
      momentum, even for h and the wall-tangential momentum). The case's boundary.wall_sign carries the same number
      for the host's predicates only; the kernel must decide the sign from odd_at_wall alone.
  - name: nx_total
    rule: padded extent along the first array axis, nx_total = nx + 2*ng, passed by the caller (case grid.nx_total);
      the padded index range is i = 1..nx_total, interior i = ng+1..ng+nx
  - name: ny_total
    rule: padded extent along the second array axis, ny_total = ny + 2*ng, passed by the caller (case grid.ny_total);
      the padded index range is j = 1..ny_total, interior j = ng+1..ng+ny
  invariants:
  - the ghost cells of U_in are never read by dynamics_shallow_water_boundary_2d_channel_mirror__apply
  - 'on a valid grid every cell of U_out is defined: interior cells equal U_in, periodic ghosts are copies of interior
    cells, wall ghosts and corners are s times copies of step-1 results'
  - "the mapping at wall_axis=1 of V with extents (nx, ny) equals the transpose of the mapping at wall_axis=2 of\
    \ V^T with extents (ny, nx), cell by cell; it also commutes with reversal of either array axis \u2014 properties\
    \ checked by tests, not an implementation route"
  - 'the mapping is linear in U_in and AD-ready: index wrap and sign reversal are explicit discrete operations'
  - grid_valid is false for nx<2, ny<2, ng<1, ng>nx, ng>ny, or wall_axis not in {1,2}, in either orientation
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
  inputs:
  - name: nx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: interior extent along the first axis (case grid.nx)
  - name: ny
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: interior extent along the second axis (case grid.ny)
  - name: ng
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: ghost width (case grid.ng)
  - name: nx_total
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: padded first-axis extent (case grid.nx_total)
  - name: ny_total
