  - test_id: l0_periodic_x_wrap_pass
    quantity: x_wrap
    target_cases:
    - l0_ng1_even
    - l0_ng1_odd
    - l0_ng2_even
    - l0_ng2_odd
    - l0_ngeqny_even
    - l0_ngeqny_odd
    - l0_ngeqnx_even
    - l0_ngeqnx_odd
    - l0_large_even
    - l0_large_odd
    per_case: true
    bind:
      ci: x + 0.5
      cj: y + 0.5
      mL: max(0, min(1, inputs.grid.ng + 1 - ci))
      mR: max(0, min(1, ci - inputs.grid.ng - inputs.grid.nx))
      mXi: 1 - mL - mR
      mB: max(0, min(1, inputs.grid.ng + 1 - cj))
      mT: max(0, min(1, cj - inputs.grid.ng - inputs.grid.ny))
      mYi: 1 - mB - mT
      W: mL * roll(initial.U_in, -inputs.grid.nx, 0) + mR * roll(initial.U_in, inputs.grid.nx, 0) + mXi * initial.U_in
    expr: max(mYi * abs(final.U_out - W))
    op: eq
    value: 0.0
  - test_id: l0_periodic_x_wrap_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_ng1_even
    - l0_ng1_odd
    - l0_ng2_even
    - l0_ng2_odd
    - l0_ngeqny_even
    - l0_ngeqny_odd
    - l0_ngeqnx_even
    - l0_ngeqnx_odd
    - l0_large_even
    - l0_large_odd
    per_case: true
    expr: maxabs(final.U_out - comparand.final.U_out) / max(maxabs(final.U_out), maxabs(comparand.final.U_out),
      1.0)
    op: le
    value: 1.0e-12
