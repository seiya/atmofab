algorithm:
  algorithm_id: shallow_water2d_hydrostatic_rusanov_p0_ssprk2
  execution_mode: iterative
  description: 'Conservative 2D shallow water equations on the doubly periodic domain [0,L_x) x [0,L_y): d(h)/dt + d(hu)/dx
    + d(hv)/dy = 0; d(hu)/dt + d(hu^2 + g h^2/2)/dx + d(huv)/dy = -g h d(z_b)/dx; d(hv)/dt + d(huv)/dx + d(hv^2 + g h^2/2)/dy
    = -g h d(z_b)/dy. Uniform cell-centred finite volumes, dx = L_x/nx, dy = L_y/ny, state U = (h, hu, hv), well-balanced
    first-order (p0) hydrostatic reconstruction of Audusse et al. (2004), Rusanov interface flux (dependency), periodic ghost
    copy (dependency), and an SSPRK2 step composed by this node from two calls of the forward stage update (dependency). The
    published operation shallow_water2d__step advances the state h, hu, hv (inout) by ONE SSPRK2 step (steps 06-21) with z_b
    (in), the grid, g, dt and t, and returns the logical ok (false on a runtime error, the state then undefined and not committed
    by the driver). The host evaluates the topography, the initial condition and the dt rule (steps 01, 02, 04) as initial_state
    / derived; the host-rendered driver runs the loop n = 1 .. derived.n_step, commits each step, and samples history / step_series.
    Cell indices are 0-based: interior cell (i, j), i = 0..nx-1, j = 0..ny-1, centre x_i = (i + 1/2) dx, y_j = (j + 1/2) dy;
    halo-extended arrays carry one ghost layer (ng = 1) at index -1 and nx (resp. ny). Each case is computed in its own orientation
    from its inputs as given.'
  steps:
  - step_id: step_01_topography_setup
    step_kind: pointwise_process
    operation_ref: setup_topography
    inputs:
    - nx
    - ny
    - L_x
    - L_y
    - topography_profile
    - x_c_fraction
    - y_c_fraction
    - H_0
    - dx
    - dy
    outputs:
    - z_b
    - z_b_ext
    description: 'Host-evaluated (case.test_case_set[].initial_state.z_b): z_b is time-invariant. topography_profile selects
      the closed form: flat -> z_b = 0 in every cell; williamson_tc5_cone -> z_b(x_i, y_j) by rule z_b_cone with x_c = x_c_fraction*L_x,
      y_c = y_c_fraction*L_y, r_0 = min(L_x, L_y)/6, h_s = 0.2*H_0, evaluated at the cell centres ((i+1/2)dx, (j+1/2)dy) of
      this case''s own grid. Any other topography_profile value, a fraction outside [0,1), or a cone whose discretized z_b
      has no cell with z_b > 0 is a setup error (fail closed, no implicit completion). Inside shallow_water2d__step, z_b_ext
      is z_b on the halo-extended grid, its ghost layer the periodic image (z_b_ext(-1,j) = z_b(nx-1,j), z_b_ext(nx,j) = z_b(0,j),
      likewise in j), so that the reconstruction of step 2 is defined at the domain seam. z_b is never passed to the boundary
      component.'
  - step_id: step_02_initial_condition
    step_kind: pointwise_process
    operation_ref: setup_initial_condition
    inputs:
    - nx
    - ny
    - L_x
    - L_y
    - initial_profile
    - eta0
    - wave_sign
    - shift_x_fraction
    - shift_y_fraction
    - H_0
    - g
    - z_b
    - dx
    - dy
    outputs:
    - h
    - hu
    - hv
    description: 'Host-evaluated (case.test_case_set[].initial_state): h, hu, hv at the cell centres from initial_profile
      by rule initial_condition_profiles (with c_0 = sqrt(g*H_0)); wave_sign is read only by linear_wave_x / linear_wave_y,
      eta0 by every profile but lake_at_rest.'
  - step_id: step_04_dt_rule
    step_kind: reduction
    operation_ref: compute_dt_rule
    inputs:
    - h
    - hu
    - hv
    - g
    - dx
    - dy
    - dt_scale
    - cfl_target
    - t_start
    - t_end
    outputs:
    - lam0
    - dt_raw
    - n_step
    - dt
    description: 'Host-evaluated (case.test_case_set[].derived): tests.md §3 dt procedure, from the initial state, by rule
      dt_rule: lam0 = max_ij((|u|+sqrt(g h))/dx + (|v|+sqrt(g h))/dy), dt_raw = dt_scale*cfl_target/lam0, n_step = ceil((t_end
      - t_start)/dt_raw), dt = (t_end - t_start)/n_step. dt is fixed for the whole run.'
  - step_id: step_06_step_start
    step_kind: pointwise_process
    operation_ref: pack_step_state
    inputs:
    - h
    - hu
    - hv
    outputs:
    - U_n
    description: 'U_n(0,:,:) = h, U_n(1,:,:) = hu, U_n(2,:,:) = hv: the state U^n at the start of step n (component-first
      layout [ncomp, nx, ny], ncomp = 3).'
  - step_id: step_07_s1_halo_fill
    step_kind: pointwise_process
    operation_ref: fill_halo_interior
    inputs:
    - U_n
    outputs:
    - W_ext
    description: 'Stage 1: copy the stage state U_n into the interior (0..nx-1, 0..ny-1) of the halo-extended stage array
      W_ext [ncomp, nx_total, ny_total].'
  - step_id: step_08_s1_boundary
    step_kind: boundary_apply
    operation_ref: dynamics_shallow_water_boundary_2d_periodic_copy__apply
    inputs:
    - W_ext
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    outputs:
    - W_ext
    - grid_valid
    description: 'Step 1 of controlled_spec §5 (realizes the case input boundary.kind = periodic, the only boundary allowed):
      call dynamics_shallow_water_boundary_2d_periodic_copy__apply(nx, ny, ng=1, nx_total, ny_total, U_in, U_out, grid_valid)
      once per component k = 0, 1, 2 with U_in = W_ext(k,:,:) and the result written back to W_ext(k,:,:). Only U is mapped;
      z_b is not passed. grid_valid = false is a runtime error (stop, fail closed).'
  - step_id: step_09_s1_reconstruct
    step_kind: reconstruct
    operation_ref: hydrostatic_reconstruction_p0
    inputs:
    - W_ext
    - z_b_ext
    outputs:
    - hs_e_L
    - hs_e_R
    - hs_n_B
    - hs_n_T
    - U_L
    - U_R
    - U_B
    - U_T
    description: 'Step 2 of controlled_spec §5, at the stage state W_ext, by rule hydrostatic_reconstruction: for every interior
      cell (i, j) its east face (i+1/2, j) (neighbour i+1, the ghost nx for i = nx-1) and its north face (i, j+1/2) (neighbour
      j+1, the ghost ny for j = ny-1). Builds the interface states U_L, U_R (x face) and U_B, U_T (y face) from the reconstructed
      depths times the CELL velocities. Wet-domain check: any reconstructed depth <= 0 is a runtime error, detected here before
      the value reaches the flux component; the run stops with an error.'
  - step_id: step_10_s1_flux
    step_kind: flux_compute
    operation_ref: dynamics_shallow_water_flux_2d_rusanov_p0__compute_flux
    inputs:
    - U_L
    - U_R
    - U_B
    - U_T
    - g
    outputs:
    - F_e
    - G_n
    - a_x
    - a_y
    - guard_ok
    description: 'Step 3 of controlled_spec §5: for every interior cell (i, j) call dynamics_shallow_water_flux_2d_rusanov_p0__compute_flux(U_L,
      U_R, U_B, U_T, g, F_star, G_star, a_x, a_y, guard_ok) with the reconstructed states of step 2 of that cell''s east face
      (U_L, U_R) and north face (U_B, U_T); store F_e(:,i,j) = F_star (= F*_{i+1/2,j}) and G_n(:,i,j) = G_star (= G*_{i,j+1/2}).
      The component''s contract is unchanged: it consumes the states the caller supplies. guard_ok = false is a runtime error
      (stop).'
  - step_id: step_11_s1_source
    step_kind: source_term
    operation_ref: hydrostatic_bed_source
    inputs:
    - hs_e_L
    - hs_e_R
    - hs_n_B
    - hs_n_T
    - g
    - dx
    - dy
    outputs:
    - S_b
    description: Step 4 of controlled_spec §5, source part, by rule bed_source_S_b, from the SAME reconstructed depths step
      2 built at this stage state.
  - step_id: step_12_s1_flux_difference
    step_kind: pointwise_process
    operation_ref: flux_difference
    inputs:
    - F_e
    - G_n
    - dx
    - dy
    outputs:
    - L_flux
    description: Step 4 of controlled_spec §5, flux part, by rule flux_difference_L_flux.
  - step_id: step_13_s1_advance
    step_kind: time_integrate
    operation_ref: dynamics_shallow_water_time_update_2d_ssprk2__advance
    inputs:
    - U_n
    - L_flux
    - S_b
    - z_b
    - dt
    - dx
    - dy
    - ncomp
    - nx
    - ny
    outputs:
    - U_1
    - guard_pass
    description: 'First call of step 5 of controlled_spec §5: dynamics_shallow_water_time_update_2d_ssprk2__advance(ncomp=3,
      nx, ny, U_n, L_flux(U_n), S_b(U_n), z_b, dt, dx, dy, U_np1 -> U_1, guard_pass); at the component''s L0 profile one call
      is U_1 = U_n + dt*(L_flux + S_b). z_b is passed but inert there. guard_pass = false is a runtime error (stop).'
  - step_id: step_14_s2_halo_fill
    step_kind: pointwise_process
    operation_ref: fill_halo_interior
    inputs:
    - U_1
    outputs:
    - W_ext
    description: 'Stage 2: copy the stage state U_1 into the interior of W_ext; steps 15-19 re-evaluate the whole right-hand
      side L(U_1) at this stage state.'
  - step_id: step_15_s2_boundary
    step_kind: boundary_apply
    operation_ref: dynamics_shallow_water_boundary_2d_periodic_copy__apply
    inputs:
    - W_ext
    - nx
    - ny
    - ng
    - nx_total
    - ny_total
    outputs:
    - W_ext
    - grid_valid
    description: As step_08, at the stage state U_1 (periodic ghost copy of each component of W_ext).
  - step_id: step_16_s2_reconstruct
    step_kind: reconstruct
    operation_ref: hydrostatic_reconstruction_p0
    inputs:
    - W_ext
    - z_b_ext
    outputs:
    - hs_e_L
    - hs_e_R
    - hs_n_B
    - hs_n_T
    - U_L
    - U_R
    - U_B
    - U_T
    description: As step_09, at the stage state U_1 (rule hydrostatic_reconstruction, wet-domain check included).
  - step_id: step_17_s2_flux
    step_kind: flux_compute
    operation_ref: dynamics_shallow_water_flux_2d_rusanov_p0__compute_flux
    inputs:
    - U_L
    - U_R
    - U_B
    - U_T
    - g
    outputs:
    - F_e
    - G_n
    - a_x
    - a_y
    - guard_ok
    description: As step_10, at the stage state U_1.
  - step_id: step_18_s2_source
    step_kind: source_term
    operation_ref: hydrostatic_bed_source
    inputs:
    - hs_e_L
    - hs_e_R
    - hs_n_B
    - hs_n_T
    - g
    - dx
    - dy
    outputs:
    - S_b
    description: 'As step_11, at the stage state U_1: S_b(U_1), never the S_b(U_n) of stage 1.'
  - step_id: step_19_s2_flux_difference
    step_kind: pointwise_process
    operation_ref: flux_difference
    inputs:
    - F_e
    - G_n
    - dx
    - dy
    outputs:
    - L_flux
    description: As step_12, at the stage state U_1.
  - step_id: step_20_s2_advance
    step_kind: time_integrate
    operation_ref: dynamics_shallow_water_time_update_2d_ssprk2__advance
    inputs:
    - U_1
    - L_flux
    - S_b
    - z_b
    - dt
    - dx
    - dy
    - ncomp
    - nx
    - ny
    outputs:
    - U_2
    - guard_pass
    description: 'Second call of step 5: advance(U_1; L_flux(U_1), S_b(U_1)) -> U_2 = U_1 + dt*L(U_1). guard_pass = false
      is a runtime error (stop).'
  - step_id: step_21_ssprk2_average
    step_kind: time_integrate
    operation_ref: ssprk2_average
    inputs:
    - U_n
    - U_2
    outputs:
    - h
    - hu
    - hv
    description: 'Step 5 composition owned by this node, rule ssprk2_composition: U^{n+1} = (1/2) U_n + (1/2) U_2, unpacked
      into h = U^{n+1}(0), hu = U^{n+1}(1), hv = U^{n+1}(2) (the committed state). A step made of one advance call with the
      fields of U^n (forward Euler) is NOT this step.'
  ordering:
  - step_01_topography_setup
  - step_02_initial_condition
  - step_04_dt_rule
  - step_06_step_start
  - step_07_s1_halo_fill
  - step_08_s1_boundary
  - step_09_s1_reconstruct
  - step_10_s1_flux
  - step_11_s1_source
  - step_12_s1_flux_difference
  - step_13_s1_advance
  - step_14_s2_halo_fill
  - step_15_s2_boundary
  - step_16_s2_reconstruct
  - step_17_s2_flux
  - step_18_s2_source
  - step_19_s2_flux_difference
  - step_20_s2_advance
  - step_21_ssprk2_average
  control_condition: Steps 01, 02 and 04 are host-evaluated per case (initial_state, derived). The driver calls shallow_water2d__step
    (steps 06-21) once per step for n = 1 .. derived.n_step; a false ok (grid_valid, guard_ok or guard_pass false, or a reconstructed
    depth <= 0) stops the loop with the last committed state, final.step counting the committed steps.
  iteration_contract:
    loop_variable: n
    start: 1
    stop_condition: n > derived.n_step
    step_count_rule: derived.n_step = ceil((t_end - t_start)/dt_raw) from rule dt_rule; derived.dt = (t_end - t_start)/derived.n_step;
      drive.loop runs n = 1 .. derived.n_step
    body_steps:
    - step_06_step_start
    - step_07_s1_halo_fill
    - step_08_s1_boundary
    - step_09_s1_reconstruct
    - step_10_s1_flux
    - step_11_s1_source
    - step_12_s1_flux_difference
    - step_13_s1_advance
    - step_14_s2_halo_fill
    - step_15_s2_boundary
    - step_16_s2_reconstruct
    - step_17_s2_flux
    - step_18_s2_source
    - step_19_s2_flux_difference
    - step_20_s2_advance
    - step_21_ssprk2_average
    stage_composition:
      kind: fixed_stage_composition
      stages: 2
      description: two advance calls per step, the right-hand side re-evaluated at the stage state, then the average with
        U^n
  update_semantics:
    target_variables:
    - h
    - hu
    - hv
    - ok
    update_order: sequential
    form: 'U_next = F(U_now, params): h, hu, hv replaced by the committed SSPRK2 state after each step; z_b is never updated'
  temporaries:
  - name: z_b_ext
    shape_expr: '[nx_total, ny_total]'
  - name: U_n
    shape_expr: '[ncomp, nx, ny]'
  - name: U_1
    shape_expr: '[ncomp, nx, ny]'
  - name: U_2
    shape_expr: '[ncomp, nx, ny]'
  - name: W_ext
    shape_expr: '[ncomp, nx_total, ny_total]'
  - name: grid_valid
    shape_expr: scalar
  - name: hs_e_L
    shape_expr: '[nx, ny]'
  - name: hs_e_R
    shape_expr: '[nx, ny]'
  - name: hs_n_B
    shape_expr: '[nx, ny]'
  - name: hs_n_T
    shape_expr: '[nx, ny]'
  - name: U_L
    shape_expr: '[3]'
  - name: U_R
    shape_expr: '[3]'
  - name: U_B
    shape_expr: '[3]'
  - name: U_T
    shape_expr: '[3]'
  - name: F_e
    shape_expr: '[ncomp, nx, ny]'
  - name: G_n
    shape_expr: '[ncomp, nx, ny]'
  - name: a_x
    shape_expr: scalar
  - name: a_y
    shape_expr: scalar
  - name: guard_ok
    shape_expr: scalar
  - name: L_flux
    shape_expr: '[ncomp, nx, ny]'
  - name: S_b
    shape_expr: '[ncomp, nx, ny]'
  - name: guard_pass
    shape_expr: scalar
  derived_field_rules:
  - name: ncomp
    rule: ncomp = 3, the components (h, hu, hv) of U
  - name: ng
    rule: ng = 1, the ghost-layer width (p0 reconstruction needs one neighbour)
  - name: nx_total
    rule: nx_total = nx + 2*ng
  - name: ny_total
    rule: ny_total = ny + 2*ng
  - name: dx
    rule: dx = L_x / nx (case inputs grid.L_x, grid.nx)
  - name: dy
    rule: dy = L_y / ny (case inputs grid.L_y, grid.ny)
  - name: z_b_cone
    rule: 'topography_profile = williamson_tc5_cone: x_c = x_c_fraction*L_x, y_c = y_c_fraction*L_y, d_x(x) = min(|x - x_c|,
      L_x - |x - x_c|), d_y(y) = min(|y - y_c|, L_y - |y - y_c|), r = sqrt(d_x^2 + d_y^2), z_b = h_s * max(0, 1 - r/r_0),
      r_0 = min(L_x, L_y)/6, h_s = 0.2*H_0, at x = (i+1/2)dx, y = (j+1/2)dy. topography_profile = flat: z_b = 0. Only these
      two values are allowed; no other bottom function or parameter.'
  - name: initial_condition_profiles
    rule: 'c_0 = sqrt(g*H_0); phases phi_x = 2*pi*(x/L_x - shift_x_fraction), phi_y = 2*pi*(y/L_y - shift_y_fraction). linear_wave_x:
      eta = H_0 + eta0*sin(phi_x), h = eta - z_b, u = wave_sign*(eta0*c_0/H_0)*sin(phi_x), v = 0. linear_wave_y: eta = H_0
      + eta0*sin(phi_y), h = eta - z_b, u = 0, v = wave_sign*(eta0*c_0/H_0)*sin(phi_y). oblique_mode: eta = H_0 + eta0*sin(2*pi*(x/L_x
      + y/L_y - shift_x_fraction - shift_y_fraction)), h = eta - z_b, u = v = 0. lake_at_rest: eta = H_0, h = H_0 - z_b, u
      = v = 0. Then hu = h*u, hv = h*v, all at the cell centres x = (i+1/2)dx, y = (j+1/2)dy of the case grid.'
  - name: dt_rule
    rule: 'Case input dt_rule (kind cfl_ceil_n_step, dt_scale, cfl_target): lam0 = max_ij((|u_ij| + sqrt(g h_ij))/dx + (|v_ij|
      + sqrt(g h_ij))/dy) at the initial state with u = hu/h, v = hv/h; dt_raw = dt_scale*cfl_target/lam0; n_step = ceil((t_end
      - t_start)/dt_raw); dt = (t_end - t_start)/n_step (t_start, t_end from case input time).'
  - name: hydrostatic_reconstruction
    rule: 'At the x face (i+1/2, j) between cells i and i+1 of the stage state W = (h, hu, hv) on the halo-extended grid:
      z_face = max(z_b(i,j), z_b(i+1,j)); hs_e_L(i,j) = max(0, h(i,j) + z_b(i,j) - z_face) (h*_{i+1/2,j,L}); hs_e_R(i,j) =
      max(0, h(i+1,j) + z_b(i+1,j) - z_face) (h*_{i+1/2,j,R}); U_L = [hs_e_L, hs_e_L*u(i,j), hs_e_L*v(i,j)], U_R = [hs_e_R,
      hs_e_R*u(i+1,j), hs_e_R*v(i+1,j)], u = hu/h, v = hv/h of the cell. At the y face (i, j+1/2): z_face = max(z_b(i,j),
      z_b(i,j+1)); hs_n_B(i,j) = max(0, h(i,j) + z_b(i,j) - z_face) (h*_{i,j+1/2,B}), hs_n_T(i,j) = max(0, h(i,j+1) + z_b(i,j+1)
      - z_face) (h*_{i,j+1/2,T}); U_B = [hs_n_B, hs_n_B*u(i,j), hs_n_B*v(i,j)], U_T = [hs_n_T, hs_n_T*u(i,j+1), hs_n_T*v(i,j+1)].
      The in-cell state stays piecewise constant (p0, never switched). max(0, .) is the definitional positivity guard on the
      DERIVED interface depth only, never applied to the cell state h; it must not activate: a reconstructed depth <= 0 at
      any interface is a runtime error (wet-domain invariant), never clipped, floored, replaced or continued with a zero-depth
      flux.'
  - name: bed_source_S_b
    rule: S_b(0,i,j) = 0; S_b(1,i,j) = g/(2 dx) * (hs_e_L(i,j)^2 - hs_e_R(i-1,j)^2); S_b(2,i,j) = g/(2 dy) * (hs_n_B(i,j)^2
      - hs_n_T(i,j-1)^2), i.e. the two reconstructed depths of cell (i,j) itself at its right/left x faces (h*_{i+1/2,j,L},
      h*_{i-1/2,j,R}) and its top/bottom y faces (h*_{i,j+1/2,B}, h*_{i,j-1/2,T}); the west face of cell 0 is the east face
      of cell nx-1 and the south face of row 0 the north face of row ny-1 (explicit periodic-index wrap). The analytic gradient
      of z_b is never used.
  - name: flux_difference_L_flux
    rule: L_flux(:,i,j) = -(F_e(:,i,j) - F_e(:,i-1,j))/dx - (G_n(:,i,j) - G_n(:,i,j-1))/dy, F_e(:,i,j) = F*_{i+1/2,j}, G_n(:,i,j)
      = G*_{i,j+1/2}, with the periodic-index wrap i-1 = -1 -> nx-1 and j-1 = -1 -> ny-1 (the face shared with the periodic
      image). The mass flux of each face is single-valued, so sum h is conserved to round-off. The x difference is divided
      by dx and the y difference by dy.
  - name: ssprk2_composition
    rule: L(U) = L_flux(U) + S_b(U), every term (ghost update, reconstruction, flux, source) evaluated at the state U. U_1
      = advance(U_n; L_flux(U_n), S_b(U_n)) = U_n + dt*L(U_n); U_2 = advance(U_1; L_flux(U_1), S_b(U_1)) = U_1 + dt*L(U_1);
      U^{n+1} = U_n/2 + U_2/2.
  - name: cfl_index
    rule: cfl = dt * max_ij((|u_ij| + c_ij)/dx + (|v_ij| + c_ij)/dy), u = hu/h, v = hv/h, c = sqrt(g h), the stability index
      of controlled_spec §5
  - name: t
    rule: 't = t_start + step*dt, written by the driver: t_start in the initial capture, t_start + n*dt after committed step
      n'
  - name: cells_updated
    rule: 'driver perf counters: steps = committed steps, cells_updated = nx*ny*steps'
  invariants:
  - 'Wet domain: every reconstructed interface depth h* > 0 at every stage of every step; drying/wetting is out of scope and
    a violation is a runtime error (fail closed).'
  - 'Well-balanced (lake at rest): with eta = h + z_b uniform and u = v = 0 the two reconstructed depths at each face are
    equal, the flux difference cancels S_b and h, hu, hv stay unchanged to round-off.'
  - 'Flat reduction: topography_profile = flat gives h* = h, S_b = 0 and the plain p0 Rusanov scheme.'
  - 'Mass conservation: the mass component of S_b is zero and each face''s mass flux is single-valued, so sum_ij h_ij is conserved
    to round-off.'
  - 'Axis-exchange equivariance: the case with nx<->ny, L_x<->L_y, x_c_fraction<->y_c_fraction and the transposed state with
    momenta exchanged has, at every step, the transposed state of the original, to round-off; x and y are treated by the same
    rule.'
  - Mirror equivariance in x (x_c_fraction -> 1 - x_c_fraction, state reflected along x, hu sign-reversed) and in y (the same
    along y, hv sign-reversed) hold to round-off.
  - 'Prohibited: computing a case by transposing/reflecting its state, grid, coordinates or topography to another case''s
    orientation and transforming back; any clip/limiter/filter on h; a non-periodic boundary; automatic switching of topography_profile
    or of the discretization; a forcing other than the bed source; the analytic z_b gradient.'
  - 'Allowed: one routine computing both directions (momenta handed in normal/tangential order or arrays transposed per direction)
    when it is applied the same way in every case.'
  - 'AD readiness: U_next = F(U_now, params); max, abs, ceil and the periodic-index wrap are explicit non-differentiable operations.'
  splitting_policy:
    kind: none
    description: 'unsplit: both directions enter one right-hand side L(U) per stage'
  state_variables:
  - name: h
    shape_expr: '[nx, ny]'
  - name: hu
    shape_expr: '[nx, ny]'
  - name: hv
    shape_expr: '[nx, ny]'
  required_update_paths:
  - h
  - hu
  - hv
  diagnostics_from_state: true
  fallback_policy: fail_closed
dependency:
  node_key: problem/shallow_water2d@0.4.7
  direct_deps:
  - node_key: component/dynamics_shallow_water_boundary_2d_periodic_copy@0.2.1
    kind: component
    operations:
    - dynamics_shallow_water_boundary_2d_periodic_copy__apply
  - node_key: component/dynamics_shallow_water_flux_2d_rusanov_p0@0.2.1
    kind: component
    operations:
    - dynamics_shallow_water_flux_2d_rusanov_p0__compute_flux
  - node_key: component/dynamics_shallow_water_time_update_2d_ssprk2@0.4.1
    kind: component
    operations:
    - dynamics_shallow_water_time_update_2d_ssprk2__advance
io_contract:
  inputs:
  - name: nx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.grid.nx: cells along x; fixes dx = L_x/nx and the array extent'
  - name: ny
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.grid.ny: cells along y; fixes dy = L_y/ny and the array extent'
  - name: L_x
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.grid.L_x: domain length in x (m)'
  - name: L_y
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.grid.L_y: domain length in y (m)'
  - name: t_start
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.time.t_start: start time, enters rule dt_rule and the reported time'
  - name: t_end
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.time.t_end: end time, enters rule dt_rule (n_step_target, dt)'
  - name: dt_scale
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.dt_rule.dt_scale: multiplies cfl_target/lam0 in rule dt_rule'
  - name: cfl_target
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.dt_rule.cfl_target (0.45): target CFL of rule dt_rule'
  - name: initial_profile
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.initial.initial_profile: selects the rule initial_condition_profiles branch (linear_wave_x,
      linear_wave_y, oblique_mode, lake_at_rest)'
  - name: eta0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.initial.eta0: wave amplitude of the initial profile'
  - name: wave_sign
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.initial.wave_sign (+1/-1, linear waves only): travel direction, sign of the initial velocity'
  - name: shift_x_fraction
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.initial.shift_x_fraction: phase shift of the initial profile in x'
  - name: shift_y_fraction
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.initial.shift_y_fraction: phase shift of the initial profile in y'
  - name: topography_profile
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.topography.topography_profile: flat or williamson_tc5_cone (rule z_b_cone)'
  - name: x_c_fraction
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.topography.x_c_fraction (cone only): x_c = x_c_fraction*L_x'
  - name: y_c_fraction
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.topography.y_c_fraction (cone only): y_c = y_c_fraction*L_y'
  - name: g
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.constants.g = 9.81: gravity in the flux, the source, the wave speed and the initial velocity'
  - name: H_0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.constants.H_0 = 1.0: reference depth of the initial profiles and h_s = 0.2*H_0'
  - name: every
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: 'case inputs.history.every = 38: the driver writes a state_history sample every `every` committed steps (tests.md
      §3 history line)'
  outputs:
  - name: h
    shape_expr: '[nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - h
    description: water depth after setup and after the run
  - name: hu
    shape_expr: '[nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - hu
  - name: hv
    shape_expr: '[nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - hv
  - name: z_b
    shape_expr: '[nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - z_b
  - name: ok
    shape_expr: scalar
    evidence_ref: raw/state_snapshots
    raw_variables:
    - ok
    description: the result logical of shallow_water2d__step, written by the driver as 1 / 0
  raw_requirements:
    required_evidence:
    - artifact: state_snapshots
      required: true
      schema:
        variables:
        - name: h
          shape_expr: '[nx, ny]'
        - name: hu
          shape_expr: '[nx, ny]'
        - name: hv
          shape_expr: '[nx, ny]'
        - name: z_b
          shape_expr: '[nx, ny]'
        - name: ok
          shape_expr: scalar
        time_variable: t
        time_shape_expr: scalar
        coordinates:
        - name: x
          axis: 0
          count: inputs.grid.nx
          length: inputs.grid.L_x
          placement: cell_center
        - name: y
          axis: 1
          count: inputs.grid.ny
          length: inputs.grid.L_y
          placement: cell_center
    - artifact: state_history
    - artifact: step_series
      names:
      - t
      - step
      - h_min
      - h_max
      - hu_min
      - hu_max
      - hv_min
      - hv_max
      - z_b_min
      - z_b_max
  semantic_dependency:
    required_sources:
    - h
    - hu
    - hv
    - z_b
  tests:
  - test_id: l1_refinement_mass_and_positivity
    expected_outcome: pass
    target_cases:
    - swe2d_ref_n032_sx000_sy000_dts100
    - swe2d_ref_n064_sx000_sy000_dts100
    - swe2d_ref_n128_sx000_sy000_dts100
    - swe2d_ref_n256_sx000_sy000_dts100
    quantities:
    - cfl.max
    - convergence.restricted.n032_to_n064.eta_l1_order
    - convergence.restricted.n032_to_n064.eta_l2_order
    - convergence.restricted.n032_to_n064.eta_linf_order
    - convergence.restricted.n032_to_n064.hu_l1_order
    - convergence.restricted.n032_to_n064.hu_l2_order
    - convergence.restricted.n032_to_n064.hu_linf_order
    - convergence.restricted.n032_to_n064.hv_l1_order
    - convergence.restricted.n032_to_n064.hv_l2_order
    - convergence.restricted.n032_to_n064.hv_linf_order
    - convergence.restricted.n064_to_n128.eta_l1_order
    - convergence.restricted.n064_to_n128.eta_l2_order
    - convergence.restricted.n064_to_n128.eta_linf_order
    - convergence.restricted.n064_to_n128.hu_l1_order
    - convergence.restricted.n064_to_n128.hu_l2_order
