      z_b: 0.0
    derived:
      dx: inputs.grid.L_x / inputs.grid.nx
      dy: inputs.grid.L_y / inputs.grid.ny
      lam0: max((abs(initial.hu / initial.h) + sqrt(inputs.constants.g * initial.h)) / derived.dx + (abs(initial.hv / initial.h)
