      grid:
        ncomp: 3
        nx: 4
        ny: 3
      coriolis:
        f_0: -0.00014
        f_j: 2.0e-05
        f_i: -3.0e-06
      test_profile_id: dynamics_shallow_water_source_2d_coriolis_l0
      test_profile_version: 0.5.0
    initial_state:
      U: ((kc - 1.5) * (kc - 2.5) / 2) * (1 + 0.1*(xc + 0.5) + 0.05*(4-(yc + 0.5)))
        + ((kc - 0.5) * (2.5 - kc)) * (0.1*(xc + 0.5) - 0.2*(4-(yc + 0.5))) + ((kc
        - 0.5) * (kc - 1.5) / 2) * (-(0.3*(4-(yc + 0.5)) - 0.05*(xc + 0.5)))
