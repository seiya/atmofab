  - case_id: l0_ncomp2
    inputs:
      grid:
        ncomp: 2
        nx: 4
        ny: 3
      coriolis:
        f_0: 0.0001
        f_j: 2.0e-05
        f_i: 0.0
      test_profile_id: dynamics_shallow_water_source_2d_coriolis_l0
      test_profile_version: 0.5.0
    initial_state:
      U: ((1.5 - kc)) * (1 + 0.1*(xc + 0.5) + 0.05*(yc + 0.5)) + ((kc - 0.5)) * (0.1*(xc
        + 0.5) - 0.2*(yc + 0.5))
      S: -999.0
    derived:
      f: inputs.coriolis.f_0 + inputs.coriolis.f_j * (yc - 0.5) + inputs.coriolis.f_i
        * (xc - 0.5)
  - case_id: l0_ncomp4
    inputs:
      grid:
        ncomp: 4
        nx: 4
        ny: 3
      coriolis:
        f_0: 0.0001
        f_j: 2.0e-05
        f_i: 0.0
      test_profile_id: dynamics_shallow_water_source_2d_coriolis_l0
      test_profile_version: 0.5.0
    initial_state:
      U: ((kc - 1.5) * (kc - 2.5) * (kc - 3.5) / (-6)) * (1 + 0.1*(xc + 0.5) + 0.05*(yc
        + 0.5)) + ((kc - 0.5) * (kc - 2.5) * (kc - 3.5) / 2) * (0.1*(xc + 0.5) - 0.2*(yc
        + 0.5)) + ((kc - 0.5) * (kc - 1.5) * (kc - 3.5) / (-2)) * (0.3*(yc + 0.5)
        - 0.05*(xc + 0.5))
      S: -999.0
    derived:
      f: inputs.coriolis.f_0 + inputs.coriolis.f_j * (yc - 0.5) + inputs.coriolis.f_i
        * (xc - 0.5)
  - case_id: l0_min_extent
    inputs:
      grid:
        ncomp: 3
        nx: 1
        ny: 1
      coriolis:
        f_0: 0.0001
        f_j: 2.0e-05
        f_i: 3.0e-06
      test_profile_id: dynamics_shallow_water_source_2d_coriolis_l0
      test_profile_version: 0.5.0
    initial_state:
      U: ((kc - 1.5) * (kc - 2.5) / 2) * (1 + 0.1*(xc + 0.5) + 0.05*(yc + 0.5)) +
        ((kc - 0.5) * (2.5 - kc)) * (0.1*(xc + 0.5) - 0.2*(yc + 0.5)) + ((kc - 0.5)
        * (kc - 1.5) / 2) * (0.3*(yc + 0.5) - 0.05*(xc + 0.5))
      S: -999.0
    derived:
      f: inputs.coriolis.f_0 + inputs.coriolis.f_j * (yc - 0.5) + inputs.coriolis.f_i
        * (xc - 0.5)
  - case_id: l0_nx0
    inputs:
      grid:
        ncomp: 3
        nx: 0
        ny: 3
      coriolis:
        f_0: 0.0001
        f_j: 2.0e-05
        f_i: 3.0e-06
      test_profile_id: dynamics_shallow_water_source_2d_coriolis_l0
      test_profile_version: 0.5.0
    initial_state:
      U: ((kc - 1.5) * (kc - 2.5) / 2) * (1 + 0.1*(xc + 0.5) + 0.05*(yc + 0.5)) +
        ((kc - 0.5) * (2.5 - kc)) * (0.1*(xc + 0.5) - 0.2*(yc + 0.5)) + ((kc - 0.5)
        * (kc - 1.5) / 2) * (0.3*(yc + 0.5) - 0.05*(xc + 0.5))
      S: -999.0
    derived:
      f: inputs.coriolis.f_0 + inputs.coriolis.f_j * (yc - 0.5) + inputs.coriolis.f_i
        * (xc - 0.5)
  - case_id: l0_ny0
    inputs:
      grid:
        ncomp: 3
        nx: 4
        ny: 0
      coriolis:
        f_0: 0.0001
        f_j: 2.0e-05
        f_i: 3.0e-06
      test_profile_id: dynamics_shallow_water_source_2d_coriolis_l0
      test_profile_version: 0.5.0
    initial_state:
      U: ((kc - 1.5) * (kc - 2.5) / 2) * (1 + 0.1*(xc + 0.5) + 0.05*(yc + 0.5)) +
        ((kc - 0.5) * (2.5 - kc)) * (0.1*(xc + 0.5) - 0.2*(yc + 0.5)) + ((kc - 0.5)
        * (kc - 1.5) / 2) * (0.3*(yc + 0.5) - 0.05*(xc + 0.5))
      S: -999.0
    derived:
      f: inputs.coriolis.f_0 + inputs.coriolis.f_j * (yc - 0.5) + inputs.coriolis.f_i
        * (xc - 0.5)
algorithm:
  algorithm_id: shallow_water_source_coriolis_apply
  execution_mode: sequence
  steps:
  - step_id: step_01_input_guard
    step_kind: diagnostic
    operation_ref: coriolis_input_guard
    description: 'Part of dynamics_shallow_water_source_2d_coriolis__apply. Sets guard_pass
      = (ncomp == 3) .and. (nx >= 1) .and. (ny >= 1). If guard_pass is false the operation
      returns immediately: S is not a valid source field (its content is undefined)
      and step_02 is not executed. h <= 0 is NOT checked (h does not enter the source).
      The extents ncomp / nx / ny are the case''s inputs.grid.ncomp / nx / ny (l0_ncomp2
      has ncomp=2 and l0_ncomp4 has ncomp=4, both rejected; all other cases ncomp=3).'
    inputs:
    - ncomp
    - nx
    - ny
    outputs:
    - guard_pass
  - step_id: step_02_coriolis_source
    step_kind: source_term
    operation_ref: coriolis_source_pointwise
    description: 'Part of dynamics_shallow_water_source_2d_coriolis__apply, run only
      when guard_pass is true. For every interior cell i=1..nx, j=1..ny (no ghost
      cells): S(1,i,j) = 0; S(2,i,j) = f(i,j)*U(3,i,j) (= f*hv); S(3,i,j) = -f(i,j)*U(2,i,j)
      (= -f*hu), with U ordered [h, hu, hv] along its first extent. Pointwise: S(:,i,j)
      depends only on U(:,i,j) and the cell''s own f(i,j). Explicit evaluation at
      the supplied state (no rotation by a time step, no implicit/semi-implicit treatment).
      f is used per cell as received (never evaluated from a profile and never read
      as a per-row or per-column value). U is intent(in) and never written; S is a
      separate output array. The momentum form f*hv is used (not f*hv/h, not f*h*hv).
      No contribution to the h component.'
    inputs:
    - ncomp
    - nx
    - ny
    - f
    - U
    outputs:
    - S
  ordering:
  - step_01_input_guard
  - step_02_coriolis_source
  control_condition: step_02_coriolis_source runs only when guard_pass is true (ncomp
    == 3, nx >= 1, ny >= 1); otherwise the operation returns with guard_pass false
    and S undefined
  iteration_contract: {}
  update_semantics:
    target_variables:
    - S
    - guard_pass
    update_order: sequential
  temporaries: []
  derived_field_rules:
  - name: f
    rule: 'Coriolis parameter per interior cell, shape [nx, ny], unit 1/s, evaluated
      by the host as derived.f: f(i,j) = f_0 + f_j*(j-1) + f_i*(i-1) for i=1..nx,
      j=1..ny, with f_0 / f_j / f_i = inputs.coriolis.f_0 / f_j / f_i. It is passed
      to the operation as received; the operation itself never evaluates a profile.'
  - name: U
    rule: 'Conserved state, shape [ncomp, nx, ny], the host-evaluated initial_state.U:
      component 1 = the h formula, 2 = hu, 3 = hv, each evaluated at 1-based cell
      indices i=1..nx, j=1..ny (the transformed cases carry their own already-transformed
      formulas). l0_ncomp2 holds two components (h, hu); l0_ncomp4 holds four (h,
      hu, hv, then 0 as inputs.initial.c4).'
  - name: S
    rule: Source field [ncomp, nx, ny], its initial_state pre-call content -999 at
      every element before the call, and then written by the operation (S(1)=0, S(2)=f*hv,
      S(3)=-f*hu).
  - name: guard_pass
    rule: The operation's logical output guard_pass, written by the driver into the
      scalar state guard_pass as 1 / 0 after the call (0 before it).
  invariants:
  - S(1,i,j) == 0 at every interior cell when guard_pass is true (no source in the
    h component)
  - '(hu)*S(2) + (hv)*S(3) == 0 at every cell, identically: the Coriolis source does
    no work'
  - S is linear in U and in f; f = 0 gives S = 0 exactly
  - the operation never reads a cell of S it has written and never writes U
  - 'sign convention: f>0 turns a +x velocity toward -y and a +y velocity toward +x;
    the caller passes -f for a reflected or axis-exchanged frame'
  splitting_policy:
    kind: none
  diagnostics_from_state: false
  fallback_policy: fail_closed
io_contract:
  inputs:
  - name: ncomp
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.ncomp; number of conserved components (must be 3), first
      extent of U and S; checked by step_01
  - name: nx
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.nx; number of interior cells along x (first extent of
      f, second extent of U and S); checked by step_01
  - name: ny
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.grid.ny; number of interior cells along y; checked by step_01
  - name: f_0
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.coriolis.f_0; constant term of the affine f rule (derived_field_rules
      f)
  - name: f_j
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.coriolis.f_j; coefficient of (j-1) in the f rule
  - name: f_i
    shape_expr: scalar
    evidence_ref: spec.ir.yaml
    description: inputs.coriolis.f_i; coefficient of (i-1) in the f rule
  - name: U
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
    description: conserved state [h, hu, hv] built from inputs.initial (derived_field_rules
      U)
  outputs:
  - name: S
    shape_expr: '[ncomp, nx, ny]'
    evidence_ref: raw/state_snapshots
    raw_variables:
    - S
  - name: guard_pass
    shape_expr: scalar
    evidence_ref: raw/state_snapshots
    raw_variables:
    - guard_pass
  raw_requirements:
    required_evidence:
    - artifact: state_snapshots
      required: true
      schema:
        variables:
        - name: U
          shape_expr: '[ncomp, nx, ny]'
        - name: S
          shape_expr: '[ncomp, nx, ny]'
        - name: guard_pass
          shape_expr: scalar
        time_variable: t
        time_shape_expr: scalar
        coordinates:
        - name: kc
          axis: 0
          count: inputs.grid.ncomp
          length: inputs.grid.ncomp
          placement: cell_center
        - name: xc
          axis: 1
          count: inputs.grid.nx
          length: inputs.grid.nx
          placement: cell_center
        - name: yc
          axis: 2
          count: inputs.grid.ny
          length: inputs.grid.ny
          placement: cell_center
  semantic_dependency:
    required_sources:
    - f
    - U
  tests:
  - test_id: l0_zero_f_gives_zero_source_pass
    expected_outcome: pass
    target_cases:
    - l0_zero_f
    quantities:
    - guard_pass
    - max_abs_s
  - test_id: l0_pointwise_formula_pass
    expected_outcome: pass
    target_cases:
    - l0_row_f
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    - l0_min_extent
    quantities:
    - guard_pass
    - pointwise_max_dev
  - test_id: l0_energy_neutral_pass
    expected_outcome: pass
    target_cases:
    - l0_row_f
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    - l0_min_extent
    quantities:
    - energy_max_abs
    - guard_pass
  - test_id: l0_symmetry_pairs_pass
    expected_outcome: pass
    target_cases:
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    quantities:
    - guard_pass
    - pair_residual
  - test_id: l0_invalid_ncomp_xfail
    expected_outcome: xfail
    target_cases:
    - l0_ncomp2
    quantities:
    - guard_pass
  - test_id: l0_invalid_ncomp_above_xfail
    expected_outcome: xfail
    target_cases:
    - l0_ncomp4
    quantities:
    - guard_pass
  - test_id: l0_invalid_nx_xfail
    expected_outcome: xfail
    target_cases:
    - l0_nx0
    quantities:
    - guard_pass
  - test_id: l0_invalid_ny_xfail
    expected_outcome: xfail
    target_cases:
    - l0_ny0
    quantities:
    - guard_pass
  predicates:
  - test_id: l0_zero_f_gives_zero_source_pass
    quantity: guard_pass
    target_cases:
    - l0_zero_f
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1.0
  - test_id: l0_zero_f_gives_zero_source_pass
    quantity: max_abs_s
    target_cases:
    - l0_zero_f
    per_case: true
    expr: maxabs(final.S)
    op: eq
    value: 0.0
  - test_id: l0_zero_f_gives_zero_source_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_zero_f
    per_case: true
    expr: maxabs(final.S - comparand.final.S) / max(maxabs(final.S), maxabs(comparand.final.S),
      1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_pointwise_formula_pass
    quantity: guard_pass
    target_cases:
    - l0_row_f
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    - l0_min_extent
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1.0
  - test_id: l0_pointwise_formula_pass
    quantity: pointwise_max_dev
    target_cases:
    - l0_row_f
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    - l0_min_extent
    per_case: true
    bind:
      fc: inputs.coriolis.f_0 + inputs.coriolis.f_j * (yc - 0.5) + inputs.coriolis.f_i
        * (xc - 0.5)
      m1: (kc - 0.5) * (2.5 - kc)
      m2: (kc - 0.5) * (kc - 1.5) / 2
      ref: m1 * fc * roll(initial.U, -1, 0, 0) - m2 * fc * roll(initial.U, 1, 0, 0)
    expr: maxabs(final.S - ref)
    op: le
    value: 1.0e-12
  - test_id: l0_pointwise_formula_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_row_f
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    - l0_min_extent
    per_case: true
    expr: maxabs(final.S - comparand.final.S) / max(maxabs(final.S), maxabs(comparand.final.S),
      1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_energy_neutral_pass
    quantity: energy_max_abs
    target_cases:
    - l0_row_f
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    - l0_min_extent
    per_case: true
    bind:
      m1: (kc - 0.5) * (2.5 - kc)
      p: initial.U * final.S
      w: m1 * (p + roll(p, -1, 0, 0))
    expr: maxabs(w)
    op: le
    value: 1.0e-12
  - test_id: l0_energy_neutral_pass
    quantity: guard_pass
    target_cases:
    - l0_row_f
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    - l0_min_extent
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 1.0
  - test_id: l0_energy_neutral_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_row_f
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    - l0_min_extent
    per_case: true
    expr: maxabs(final.S - comparand.final.S) / max(maxabs(final.S), maxabs(comparand.final.S),
      1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_symmetry_pairs_pass
    quantity: guard_pass
    target_cases:
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    expr: final.guard_pass
    op: eq
    value: 1.0
    per_case: true
  - test_id: l0_symmetry_pairs_pass
    quantity: pair_residual
    target_cases:
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    case: l0_general_f_axis
    bind:
      a: transpose(at('l0_general_f').final.S, 1, 2)
      m0: (kc - 1.5) * (kc - 2.5) / 2
      m1: (kc - 0.5) * (2.5 - kc)
      m2: (kc - 0.5) * (kc - 1.5) / 2
      tb: m0 * a + m1 * roll(a, -1, 0, 0) + m2 * roll(a, 1, 0, 0)
    expr: norm2(final.S - tb) / norm2(at('l0_general_f').final.S)
    op: le
    value: 1.0e-12
  - test_id: l0_symmetry_pairs_pass
    quantity: pair_residual
    target_cases:
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    case: l0_general_f_xmir
    bind:
      m1: (kc - 0.5) * (2.5 - kc)
      tb: (1 - 2 * m1) * flip(at('l0_general_f').final.S, 1)
    expr: norm2(final.S - tb) / norm2(at('l0_general_f').final.S)
    op: le
    value: 1.0e-12
  - test_id: l0_symmetry_pairs_pass
    quantity: pair_residual
    target_cases:
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    case: l0_general_f_ymir
    bind:
      m2: (kc - 0.5) * (kc - 1.5) / 2
      tb: (1 - 2 * m2) * flip(at('l0_general_f').final.S, 2)
    expr: norm2(final.S - tb) / norm2(at('l0_general_f').final.S)
    op: le
    value: 1.0e-12
  - test_id: l0_symmetry_pairs_pass
    quantity: cross_target_state_agreement
    target_cases:
    - l0_general_f
    - l0_general_f_axis
    - l0_general_f_xmir
    - l0_general_f_ymir
    per_case: true
    expr: maxabs(final.S - comparand.final.S) / max(maxabs(final.S), maxabs(comparand.final.S),
      1.0)
    op: le
    value: 1.0e-12
  - test_id: l0_invalid_ncomp_xfail
    quantity: guard_pass
    target_cases:
    - l0_ncomp2
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 0.0
  - test_id: l0_invalid_ncomp_above_xfail
    quantity: guard_pass
    target_cases:
    - l0_ncomp4
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 0.0
  - test_id: l0_invalid_nx_xfail
    quantity: guard_pass
    target_cases:
    - l0_nx0
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 0.0
  - test_id: l0_invalid_ny_xfail
    quantity: guard_pass
    target_cases:
    - l0_ny0
    per_case: true
    expr: final.guard_pass
    op: eq
    value: 0.0
