schema_version: '1.0'
meta:
  node_key: component/dynamics_shallow_water_source_2d_coriolis@0.2.0
  spec_kind: component
  spec_id: dynamics_shallow_water_source_2d_coriolis
  spec_version: 0.2.0
  source_refs:
    controlled_spec: spec/component/dynamics/shallow_water/dynamics_shallow_water_source_2d_coriolis/controlled_spec.md
    tests: spec/component/dynamics/shallow_water/dynamics_shallow_water_source_2d_coriolis/tests.md
    deps: spec/component/dynamics/shallow_water/dynamics_shallow_water_source_2d_coriolis/deps.yaml
case:
  test_case_set:
  - case_id: l0_zero_f
    inputs:
      grid:
        ncomp: 3
        nx: 4
        ny: 3
      coriolis:
        f_0: 0.0
        f_j: 0.0
        f_i: 0.0
      test_profile_id: dynamics_shallow_water_source_2d_coriolis_l0
      test_profile_version: 0.5.0
    initial_state:
      U: ((kc - 1.5) * (kc - 2.5) / 2) * (1 + 0.1*(xc + 0.5) + 0.05*(yc + 0.5)) +
        ((kc - 0.5) * (2.5 - kc)) * (0.1*(xc + 0.5) - 0.2*(yc + 0.5)) + ((kc - 0.5)
        * (kc - 1.5) / 2) * (0.3*(yc + 0.5) - 0.05*(xc + 0.5))
      S: -999.0
    derived:
      f: inputs.coriolis.f_0 + inputs.coriolis.f_j * (yc - 0.5) + inputs.coriolis.f_i
        * (xc - 0.5)
  - case_id: l0_row_f
