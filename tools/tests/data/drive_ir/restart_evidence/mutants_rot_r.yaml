# Issue #632 P6 V-a — the model mutants of `mutants_rot.yaml` (subject `rot`, P2 restart bench),
# RE-EXPRESSED as patches to the CERTIFIED generated model of run R of 2026-11-13
# (`workspace/pipelines/problem__shallow_water2d_rotating__0.1.1/fortran_cpu/
# shallow-water2d-rotating_20261113_001/source/src_20261113_002/src/
# shallow_water2d_rotating_model.f90`, not committed: it is `workspace/` state), certified under
# its lineage's IR. The P2 patches target the R-S model of rotating@0.1.0
# (`.../shallow-water2d-rotating_20261112_001/source/src_20261112_001/...`).
# Same ids, same `class`, same defect, same `expect_base_first` / `expect_axis_first`; not every
# P2 patch applies verbatim, because the generated text spells the same program differently:
# the private state is `f_private` / `coriolis_ok` (was `rot_f` / `ok_source_state`), the copy of
# f into it is fused into the pack loop, the step comments are spelled `step_0N`, and the
# tendency's `S` is allocatable. Each patch here was written from the defect's title and the P2
# patch before any run, and none was changed after one. `note` records where the generated text
# makes the re-expression differ from the P2 patch.
#
# The numbers the titles state were checked against run R's certified captures before any run:
# the 22 base cases sorting before `swr_shear_n064_restart` commit 1745 steps and 11 of them
# end on a refused call (the same as R-S); `rotation.every` 2 and K 61 are unchanged; the case
# before the base is still `swr_shear_n064_rect`. The model's call structure is that of R-S
# (guard, member, firing rule, then the firing-only RK4 step), so "the calls that reach the
# firing rule" are the same calls.

rot-step-counter:
  title: >-
    the firing rule reads a private step counter (module variable, +1 per call, set to 0 when
    the call's t is 0, i.e. at a case's first call since every case starts at t = 0) in place
    of the `step` argument. In an uncut run it equals `step` at every call; a continuation's
    first call is at t_K > 0, so its counter keeps the value 0 a fresh process gives it and
    the phase is off by K: with K = 61 and rotation.every = 2 the parity flips.
  class: must_catch
  note: the module variable is declared after `coriolis_ok` (the R-S anchor `ok_source_state` is absent).
  patches:
    - old: "logical :: coriolis_ok = .true."
      new: "logical :: coriolis_ok = .true.\n  integer, save :: my_step = 0"
    - old: "fire = (rotation == 1) .and. (mod(step + 1, rotation_every) == 0)"
      new: "if (t == 0.0_dp) my_step = 0\n    fire = (rotation == 1) .and. (mod(my_step + 1, rotation_every) == 0)\n    my_step = my_step + 1"

rot-phase-counter:
  title: >-
    the rotation phase is a private call counter nothing resets (counts the calls that reach
    the firing rule since program start). In pass 1 the base's phase is offset by every call of
    the cases before it (1745 committed steps in the default subset, measured from the
    baseline's captures), in the continuation's own process by -K; the two offsets differ by
    1745 + 61 = 1806, even, so with rotation.every 2 the base and the continuation fire on the
    same steps at K = 61 and the restart test cannot see it there (at K = 62 they differ by
    1807, odd). Caught at K = 61 by tests on other cases, whose phase the offset moves.
  class: must_catch
  note: >-
    the module variable is declared after `coriolis_ok`. 1745 holds on run R (its certified
    captures); the counter counts the same calls as in R-S (those that pass the guard and the
    member and reach the firing rule).
  patches:
    - old: "logical :: coriolis_ok = .true."
      new: "logical :: coriolis_ok = .true.\n  integer, save :: n_calls = 0"
    - old: "fire = (rotation == 1) .and. (mod(step + 1, rotation_every) == 0)"
      new: "fire = (rotation == 1) .and. (mod(n_calls + 1, rotation_every) == 0)\n    n_calls = n_calls + 1"

rot-stale-stage:
  title: >-
    RK4's first-stage tendency (stage 1 of the Coriolis rhs) is kept (module save) and the
    current firing uses the PREVIOUS firing's stage-1 tendency in its place (the fresh one is
    computed and kept for the next firing); a process's first firing at a grid shape uses
    its fresh one. The continuation's first firing (driver step n = 62, the call with `step` 61) is fresh where the base's used
    the stage-1 tendency of step 60.
  class: must_catch
  note: the module variables are declared after `coriolis_ok`; otherwise the P2 patch applies as written.
  patches:
    - old: "logical :: coriolis_ok = .true."
      new: "logical :: coriolis_ok = .true.\n  real(dp), allocatable, save :: k1_prev(:, :, :)\n  integer, save :: stage_no = 0"
    - old: "dt_rot = real(rotation_every, dp) * dt"
      new: "dt_rot = real(rotation_every, dp) * dt\n    stage_no = 0"
    - old: "    dUdt = S"
      new: |-
            stage_no = stage_no + 1
            if (stage_no == 1) then
              if (allocated(k1_prev)) then
                if (all(shape(k1_prev) == shape(S))) then
                  dUdt = k1_prev
                else
                  dUdt = S
                end if
                deallocate(k1_prev)
              else
                dUdt = S
              end if
              allocate(k1_prev, source=S)
            else
              dUdt = S
            end if

rot-ref-first-call:
  title: >-
    a reference depth h_ref cached from the state (after the member step) the first call of a
    process sees, re-cached whenever the grid shape differs from the cached array's (so a
    smaller grid never reads a larger one's array), and read every call in a weak relaxation
    h += 1e-6 (h_ref - h). The case before the base in pass 1 is `swr_shear_n064_rect`
    (64 x 48), so the base re-caches from its own first call (its state after step 1); the
    continuation's own process caches the base's state after step K+1. The cases before it
    relax towards the first case of each run of one shape (`swr_off_cone_n064_twin` and
    `swr_off_flat_n064` towards `swr_off_cone_n064`'s state, `swr_shear_n064_axis` towards
    `swr_shear_n064`'s), which tests on those cases may see.
  class: must_catch
  note: >-
    inserted before the comment `! step_03: firing rule from the driver's committed step
    count.` (R-S: `! step 03: firing rule`), the same point (after the member's ok check,
    before the firing rule); the module variable is declared after `coriolis_ok`.
  patches:
    - old: "logical :: coriolis_ok = .true."
      new: "logical :: coriolis_ok = .true.\n  real(dp), allocatable, save :: h_ref(:, :)"
    - old: "    ! step_03: firing rule from the driver's committed step count."
      new: |-
            if (.not. allocated(h_ref)) then
              allocate(h_ref, source=h)
            else if (size(h_ref, 1) /= nx .or. size(h_ref, 2) /= ny) then
              deallocate(h_ref)
              allocate(h_ref, source=h)
            end if
            h = h + 1.0e-6_dp * (h_ref - h)

            ! step_03: firing rule from the driver's committed step count.

rot-f-first-call:
  title: >-
    f is cached at the first FIRING call of a process at a grid shape (`rot_f = f` once,
    re-cached only when nx or ny differs from the cached array's, never refreshed otherwise)
    and the Coriolis tendency reads the cache; the continuation's own process caches the base's
    true f. A first expression that cached once per process with no shape key read the first
    firing n032 case's 32 x 32 array as 64 x 64 (out of bounds, non-finite state), so it measured
    an out-of-bounds read, not the declared defect; it was replaced by this one before the
    recorded run. In the subset's pass 1 the first firing 64 x 64 case is `swr_shear_n064`,
    whose f equals the base's (same rotation inputs), so the base runs with its own f; the
    case after it with another f is `swr_shear_n064_axis`. When the base is the FIRST case of
    its process its cache is its own f, and so is the continuation's: missed.
  class: must_catch
  expect_base_first: missed
  expect_axis_first: caught
  note: >-
    the cache is `f_private` (R-S: `rot_f`). R-S copied f in its own loop, which the P2 patch
    replaced whole; here the copy `f_private(i, j) = f(i, j)` is fused into the pack loop, so
    the patch replaces the deallocate/allocate pair with the shape-keyed cache (allocate and
    `f_private = f` only when not allocated at this shape) and deletes the copy from the pack
    loop, leaving the pack of h, hu, hv as it was.
  patches:
    - old: |-
        if (allocated(f_private)) deallocate (f_private)
        allocate (f_private(nx, ny))
      new: |-
        if (allocated(f_private)) then
          if (size(f_private, 1) /= nx .or. size(f_private, 2) /= ny) deallocate (f_private)
        end if
        if (.not. allocated(f_private)) then
          allocate (f_private(nx, ny))
          f_private = f
        end if
    - old: "        f_private(i, j) = f(i, j)\n"
      new: ""

ctl-dead-counter:
  title: a private counter incremented every call and never read
  class: control
  note: >-
    declared after `coriolis_ok`; incremented before the comment `! step_03: firing rule from
    the driver's committed step count.` (R-S: `! step 03: firing rule`), the same point.
  patches:
    - old: "logical :: coriolis_ok = .true."
      new: "logical :: coriolis_ok = .true.\n  integer, save :: dead_count = 0"
    - old: "    ! step_03: firing rule from the driver's committed step count."
      new: "    dead_count = dead_count + 1\n\n    ! step_03: firing rule from the driver's committed step count."

# Added after the first recorded table of P2 (the lead's review of it, as Part 1's r1-* rows
# were): `rot-f-first-call` above was realised per grid shape, so the declared class — a value
# cached ONCE per process — had no row of its own. This row is that class, as a scalar, so no
# shape key is needed.
rot-dtrot-once:
  title: >-
    the rotation's step k*dt is cached at the first firing call of a process (`dt_rot` kept in
    a module variable, set once, never refreshed). In the suite's pass 1 the first firing case
    precedes the base and has another dt, so the base rotates with that case's step; the
    continuation's own process caches the base's. When the base is the first case of its
    process both cache the base's own step: missed.
  class: must_catch
  expect_base_first: missed
  patches:
    - old: "real(dp) :: dt_rot"
      new: "real(dp) :: dt_rot\n    real(dp), save :: dt_rot_once = -1.0_dp"
    - old: "dt_rot = real(rotation_every, dp) * dt"
      new: "if (dt_rot_once < 0.0_dp) dt_rot_once = real(rotation_every, dp) * dt\n    dt_rot = dt_rot_once"

# Added after P2 review round 2 (a reviewer's counterexample to 2-13's first wording): the same
# never-reset phase counter as `rot-phase-counter`, counted at the top of every call, so the
# refused calls of the cases before the base count too.
rot-phase-counter-all-calls:
  title: >-
    the rotation phase is a private counter of EVERY call since program start (incremented
    before the guards, so a refused call counts). In pass 1 it adds the 11 refused calls of the
    cases before the base to the 1745 committed steps; 1756 + 61 is odd, so with
    rotation.every 2 the base and the continuation fire on different steps at K = 61.
  class: must_catch
  note: >-
    declared after `coriolis_ok`; incremented before the comment `! step_01: input guard of
    this spec, before the member.` (R-S: `! step 01: guards of this spec, before anything
    else`), the same point. 11 holds on run R: 11 of the 22 cases end with `ok` 0 in its
    certified captures.
  patches:
    - old: "logical :: coriolis_ok = .true."
      new: "logical :: coriolis_ok = .true.\n  integer, save :: n_all = 0"
    - old: "    ! step_01: input guard of this spec, before the member."
      new: "    n_all = n_all + 1\n    ! step_01: input guard of this spec, before the member."
    - old: "fire = (rotation == 1) .and. (mod(step + 1, rotation_every) == 0)"
      new: "fire = (rotation == 1) .and. (mod(n_all, rotation_every) == 0)"
