[pytest]
# The `slow` marker names the wall-clock-bound leaf/stream/deadline tests. It is OPT-OUT, not
# opt-in. The original reason — "this repository has no CI, so a default that deselects tests
# means those tests are run by nobody" — expired when `.github/workflows/tests.yml` landed
# (issue #161). The rest of it did not, and is now the whole reason: the tests marked here are the
# regression guards for the deadline, abandon and teardown properties, and those have NO OTHER
# WITNESS. Deselecting them by default would leave the only check of those properties to whoever
# remembers to opt in.
#
# CI runs the full set, `slow` included, for the same reason. A wall-clock margin that fails on a
# shared runner is a statement about the budget, and the answer to it is to re-measure the budget
# — not to deselect the test and not to retry the job. Skip them explicitly for a fast local loop:
#   python3 -m pytest tools/tests/ -q -m "not slow"
markers =
    slow: wall-clock-bound leaf/stream/deadline tests; run by default, deselect with -m "not slow"
# `pytest` with NO argument must behave like `pytest tools/tests`. Not tidiness: pytest
# loads `tools/tests/conftest.py` as an INITIAL conftest only when an argument leads to
# it, and without that the operator-environment guard's `--keep-operator-env` option is
# unregistered (a hard argparse error) and its "I stripped these" header never prints —
# while the strip itself still happens during collection. Measured on pytest 8.3.5: the
# bare form gave a silent strip and `error: unrecognized arguments`, which is the exact
# defect issue #84's round 1 fixed for the explicit form. `pytest .` still bypasses this,
# because an explicit argument overrides `testpaths`; that form is documented nowhere here
# and is recorded in TODO.md rather than defended.
testpaths =
    tools/tests
addopts =
    -p no:randomly
