# Sample leaf-LLM configuration: EVERY LLM leaf — both `compile`, both `generate`, and
# `validate.judge` — on the hosted Anthropic Messages API. `defaults` stays on the Claude Code
# CLI, and the reason is not the leaves: see the ALL-HTTP note below.
#
# Copy it to `./llm.yaml` — the operator-owned file `run_workflow.py` loads when nobody passes
# `--llm-config`:
#
#     cp docs/examples/llm_anthropic_api.example.yaml llm.yaml
#
# WHY EVERY LEAF. Every LLM leaf is a WORKSHOP leaf (issue #534), and on an HTTP provider the
# HOST runs its tool-use loop (issue #534 PR-J3-b): it declares five file tools (`read_file`,
# `write_file`, `edit_file`, `list_files`, `grep_file`) over the lineage's work tree — and on a
# producing substep the host's operations — executes every tool call a reply makes, and asks
# again until the model answers with no tool call. Each entry states its bounds on the substep
# only. On a PRODUCING substep (`compile.generate`, `generate.generate`), the block reads:
#
#       generate:
#         provider: anthropic_api
#         api_key_env: ANTHROPIC_API_KEY
#         model: claude-opus-5
#         effort: high
#         max_output_tokens: 32768
#         max_wrapper_calls: 30      # host-operation calls per lineage (cold launch + repairs)
#         lineage_timeout_s: 2700    # seconds per lineage, from its cold launch
#
# On a JUDGING substep (`compile.verify`, `generate.verify`, `validate.judge`) no host operation
# is served, so `max_wrapper_calls` is refused there:
#
#       judge:
#         provider: anthropic_api
#         api_key_env: ANTHROPIC_API_KEY
#         model: claude-opus-5
#         effort: high
#         max_output_tokens: 32768
#         lineage_timeout_s: 2700    # seconds per lineage, from its cold launch
#
# On a workshop entry `max_output_tokens` bounds ONE reply, and a reply that writes a file
# carries it whole: one `write_file` of a 60 KB source is about 15-20k output tokens, so 32768
# holds one (a reply cut at the limit runs none of its tool calls; the tool surface tells the
# leaf to write one file per reply and to change a long file with `edit_file`). `timeout_s`
# bounds each request, and `lineage_timeout_s` the lineage: a request in flight when the
# lineage's time runs out ends the launch as the lineage's timeout. Each request marks two prompt-cache breakpoints (`cache_control` on the
# system block and on the last user block); a gateway that rejects the field fails the launch
# as a transport error. Every tool result and tree file the leaf reads is sent to the endpoint
# in each request (`docs/ORCHESTRATION.md` §workshop leaf, "On the HTTP providers").
#
# `defaults` MAY be an HTTP provider since issue #169: the one launch it serves, the
# `escalate` diagnostician, is a READING workshop leaf (issue #534 PR-J4-a), so the rule on it
# is `llm_config_defaults_not_workshop`. `init` and the
# preflight still take one CLI backend token, and it is resolved from whatever the file can
# launch (`LlmConfig.cli_launch_identity`) rather than from `defaults`, so an HTTP `defaults`
# beside a CLI leaf runs. ONE thing still stands between this file and an ALL-HTTP run — that
# single CLI backend token, which a file naming no CLI provider at all cannot supply
# (`llm_config_no_cli_backend`, refused at run start). It is why `defaults` here is the CLI
# provider rather than the endpoint every leaf uses.
#
# The two GENERATE leaves are additionally gated at run time on the node having a CodegenBundle
# SHAPE (`Conductor._bundle_shape`: `m3c` for a physics node, `harness` for an `infrastructure`
# self-test since issue #169). Every node the spec catalog holds has one; a hand-crafted IR with
# no shape fails that node closed (`node_has_no_bundle_shape`). The two COMPILE leaves carry no
# such condition — the Compile contract does not depend on the node kind.
#
# EVERY phase, substep and provider is written out. The substep entries are REQUIRED: each
# states its own bounds (`lineage_timeout_s`, and `max_wrapper_calls` on a producing substep),
# which no level inherits, so a substep left out is refused at load
# (`llm_config_workshop_bound_missing`). The provider would inherit from `defaults`; it is
# written out anyway because the file is the answer to "what runs where" — a reader should get
# that answer by reading it, not by re-deriving it from an inheritance chain.
#
# HOW THIS PROVIDER DIFFERS from `openai_compatible` (see `llm_openai_compatible.example.yaml`):
#
#   base_url    Optional, and omitted below. The Messages API has one canonical endpoint,
#               https://api.anthropic.com, which the entry takes by default. Setting it is for
#               a gateway or a proxy — and it must be a BARE host, because the request appends
#               /v1/messages (the OpenAI-compatible provider is the opposite: it appends
#               /chat/completions, so its `base_url` carries the version segment itself).
#   effort      Applies, and reaches the request as `output_config: {"effort": "<level>"}`
#               (`low` | `medium` | `high` | `xhigh` | `max`, the levels of the provider's
#               effort page, https://platform.claude.com/docs/en/build-with-claude/effort). A
#               word outside that list is refused at load (`llm_config_invalid_field`). The
#               DEFAULT is the MODEL's: `high` on `claude-opus-5` and `claude-sonnet-5`,
#               `medium` on Claude Opus 5.5 and Claude Haiku 5.5. An absent `effort` sends no
#               `output_config` and leaves that default in force. Not every model takes every
#               level: one the named model lacks is refused by the endpoint as an HTTP 400 on
#               the first request, which fails the launch closed with no retry. These models
#               have no thinking TOKEN BUDGET to set — `max_output_tokens` is the hard cap on
#               thinking and reply together, and `effort` is soft guidance on how much of it goes
#               to thinking. (Until issue #560 this field was refused here, on the premise that
#               the API had a thinking budget and no level.)
#   command     Does not apply, and is rejected with `llm_config_field_not_applicable`: there
#               is no child process to wrap.
#
#   stream      Applies here exactly as it does there, and is on by default for the same reason:
#               a non-streaming completion writes nothing until the whole answer exists, so an
#               intermediary bounding the interval between upstream reads cuts it long before
#               the model is done (measured elsewhere as three `HTTP 504`s on requests of
#               613.6 s / 612.3 s / 611.8 s, while the entry's own 2400 s bound never fired). No `stream_options` counterpart is
#               needed: this API reports usage in the stream natively, input tokens in
#               `message_start` and output tokens in `message_delta` (with the share spent
#               thinking, recorded as `reasoning_tokens`). Set `false` only for a
#               gateway that cannot speak server-sent events.
#
#   api_key_env The NAME of the environment variable holding the key, never the key. A
#               configuration file is read, copied and diffed; a key in it is a key leaked.
#   model       Required, and an exact slug: an HTTP endpoint has no alias to resolve at runtime
#               the way `claude --model opus` does.
defaults:
  provider: claude_cli
  model: opus
  effort: medium
  # `defaults` also serves the `escalate` diagnostician, a READING workshop leaf: this bounds
  # its lineage (required; no substep entry inherits it).
  lineage_timeout_s: 2700

phases:
  compile:
    substeps:
      # The IR producer. The host seeds the controlled spec, the tests, the dependency
      # declaration and the phase contract into its tree; the leaf writes the whole IR there as
      # `spec.ir.yaml` (or `compile_fail.json`) and checks it with `check_ir`. Every seed page it
      # reads stays in the conversation each later request re-sends, so the seeds are the floor
      # of its context, and a BOUND, not a constant: most of their bytes are
      # `docs/workflow/phases/phase_01_compile.md` in full (so it moves whenever that document
      # is edited) and the reviewer's also carry the IR under review (so they move per node and
      # per attempt). Measured on `problem/shallow_water2d@0.4.0` with that document at
      # 63,222 B, as the context a pure leaf was given inline: 127,273 bytes for this leaf across
      # all 7 IR directories on disk, and 150,912 to 171,200 for the reviewer below. This
      # endpoint's window accommodates it; a 32k-token one does not.
      generate:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-opus-5
        # `high` is the API default of `claude-opus-5` and `claude-sonnet-5`, so this line runs
        # exactly as omitting it would ("Setting `effort` explicitly to the model's default is
        # equivalent to omitting it", the provider's thinking page); it is written so the level
        # is read here rather than looked up. The default is the MODEL's, so a changed slug can
        # change what this line means (Claude Opus 5.5 defaults to `medium`): restate it from
        # the new model's effort page. The four entries below follow this one. Overriding the
        # default needs quality evidence on the model that will run; no run recorded here is that.
        effort: high
        # Bounds ONE reply, and a reply that writes `spec.ir.yaml` carries what it writes whole.
        # The artifact, over a NAMED population: the 7 `shallow_water2d` IRs under the live
        # `workspace/` run 42,721 to 63,009 bytes of YAML (widen the scope to the archived
        # `workspace_2026*/` snapshots and it is 25 from 20,850; the MAXIMUM is 63,009 either
        # way). The larger `shallow_water2d_channel` 0.2.4 IR, 168,735 bytes of JSON, was
        # written at 85,325 output tokens as the CLI result envelope reported them — more than
        # one reply at this cap holds, so on a node that size the leaf builds the file across
        # replies with `edit_file`, as its tool surface tells it to. 65536 is a BOUND taken from
        # the part-split leaf that wrote 60,447 bytes of that IR in one call (issue #526; the
        # split went with the pure leaf in PR #557), not a requirement — re-measure against the
        # node you run. The timeout moves with it.
        max_output_tokens: 65536
        timeout_s: 4800
        max_wrapper_calls: 30      # wrapper calls per lineage (its cold launch + resumes)
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch
      # The IR reviewer. Writes `verdict.json`, the same verdict document the generate
      # reviewer writes.
      verify:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-sonnet-5
        effort: high
        # Bounds ONE reply, and on a reading leaf most of a reply is thinking. Issue #560's
        # table, from `orch_20261028T235119Z_492e5092` (main 25c6ce26; the small node
        # `dynamics_shallow_water_time_update_2d_rk4`; every reading entry then at 16384 and no
        # `effort`, so the model's `high`), output / thinking tokens summed per lineage:
        #   compile.verify   claude-sonnet-5  17,198 / 16,703  cut
        #                                     16,835 / 16,477  cut
        #                                     16,804 / 16,450  cut
        #                                     17,028 / 16,520  cut
        #                                     29,840 / 28,818
        #   generate.verify  claude-opus-5    15,868 / 14,965
        #   validate.judge   claude-opus-5     8,832 /  3,565
        # Each cut lineage ended on one reply that reached 16384 output tokens, 16382 to 16384
        # of them thinking, with a thinking block as its only content. Such a reply runs no
        # tool call and is refused, so the cost was a fresh lineage and a whole compile re-run,
        # not a wrong verdict. Those four are CENSORED at 16384: how much thinking they wanted
        # is unknown. Per REPLY (read off the same run's `loop_turns.jsonl`, 2026-10-30), the
        # largest that finished was 14,980 tokens here, 8,607 on `generate.verify` and 4,461 on
        # `validate.judge`. 32768 doubles the cap the cuts hit; it is a bound from one censored
        # run, not a requirement — re-measure against the node you run. The provider's remedy
        # for a `max_tokens` stop is to raise the cap when the cut replies needed the
        # reasoning and to lower the effort when they were over-thought; a reviewer certifies,
        # so this sample raises the cap. If cuts recur at it, `effort: medium` is the lever.
        # `timeout_s` stays: in that run a 16384-token reply here took 157-160 s (about 103
        # tokens/s), so a 32768-token one fits 1800 with room.
        max_output_tokens: 32768
        timeout_s: 1800
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch

  generate:
    substeps:
      # The CodegenBundle producer: writes the bundle's files and `bundle.yaml` in its tree,
      # one file per reply, and builds, lints and runs them through the host's operations.
      generate:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-opus-5
        effort: high
        max_output_tokens: 32768
        max_wrapper_calls: 30      # wrapper calls per lineage (its cold launch + resumes)
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch
      # The verdict reviewer over the bundle above, seeded in its tree; writes `verdict.json`.
      verify:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-opus-5
        effort: high
        # The reading kind is one shape, so this cap moves with `compile.verify`'s (see the
        # measurements there): this lineage stayed under 16384, with 14,965 of its 15,868
        # output tokens thinking.
        max_output_tokens: 32768
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch

  validate:
    substeps:
      # The independent semantic check, and the last leaf of the run: it reads the seeds and
      # writes `review.json`. Its seeds are the largest of the five in artifact terms and the
      # most VARIABLE: the run's own documents plus the raw-evidence excerpt
      # (`raw_evidence_excerpt.json`), which grows with (test x case x variable). Every page it
      # reads is re-sent in each later request. Measured on `problem/shallow_water2d@0.4.0`'s
      # recorded `run_20260802_001`, the excerpt alone is 52,001 bytes (from 13,019,745 bytes of
      # `raw/`) and the whole seed set is about 150 KB. Re-measure rather than trusting that —
      # build a `Conductor` and sum
      # `len(v.encode()) for v in c._build_leaf_judge_context(refs).values()`, whose values
      # are the seeds (a `.json` one re-indented one value per line).
      judge:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-opus-5
        effort: high
        # The artifact is a decision and a findings array, so this is headroom rather than a
        # size, and most of a reply is thinking: the same cap as the two verify leaves, the
        # bundle writer's budget, for the reason given at `compile.verify`.
        max_output_tokens: 32768
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch
