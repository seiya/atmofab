# Sample leaf-LLM configuration: EVERY LLM leaf — both `compile`, both `generate`, and
# `validate.judge` — on the hosted Anthropic Messages API. `defaults` stays on the Claude Code
# CLI, and the reason is not the leaves: see the ALL-HTTP note below.
#
# Copy it to `./llm.yaml` — the operator-owned file `run_workflow.py` loads when nobody passes
# `--llm-config`:
#
#     cp docs/examples/llm_anthropic_api.example.yaml llm.yaml
#
# WHY EVERY LEAF, NOW. `anthropic_api` is one request and one response: no session to reopen,
# no tools to grant, and no agentic loop. That confines it to the leaves that run as
# host-mediated PURE functions — one closed context in, one JSON document out — and since Z3
# (issue #169) every LLM leaf is one of those. `validate.judge` was the last exception; it held
# tools only to walk `raw/`, which the host now summarizes for it
# (`tools/raw_evidence_excerpt.py`), so an HTTP provider is admissible on it too.
#
# `defaults` MAY be an HTTP provider since issue #169: the one launch it serves, the
# `escalate` diagnostician, is a pure leaf now, so the rule on it is
# `llm_config_defaults_not_pure` rather than a requirement to be agentic. `init` and the
# preflight still take one CLI backend token, and it is resolved from whatever the file can
# launch (`LlmConfig.cli_launch_identity`) rather than from `defaults`, so an HTTP `defaults`
# beside a CLI leaf runs. ONE thing still stands between this file and an ALL-HTTP run — that
# single CLI backend token, which a file naming no CLI provider at all cannot supply
# (`llm_config_no_cli_backend`, refused at run start). It is why `defaults` here is the CLI
# provider rather than the endpoint every leaf uses.
#
# The two GENERATE pure leaves are additionally gated at run time on the node having a
# CodegenBundle SHAPE (`Conductor._bundle_shape`: `m3c` for a physics node, `harness` for an
# `infrastructure` self-test since issue #169). Every node the spec catalog holds has one, so a
# pure-only provider has a pure path everywhere; a hand-crafted IR with no shape would fail that
# node closed rather than silently launching an agentic session on it. The two COMPILE pure
# leaves carry no such condition — the Compile contract does not depend on the node kind.
#
# EVERY phase, substep and provider is written out, even though the resolution rules would let
# the unmentioned leaves inherit `defaults`. The file is the answer to "what runs where" — a
# reader should get that answer by reading it, not by re-deriving it from an inheritance chain.
#
# HOW THIS PROVIDER DIFFERS from `openai_compatible` (see `llm_openai_compatible.example.yaml`):
#
#   base_url    Optional, and omitted below. The Messages API has one canonical endpoint,
#               https://api.anthropic.com, which the entry takes by default. Setting it is for
#               a gateway or a proxy — and it must be a BARE host, because the request appends
#               /v1/messages (the OpenAI-compatible provider is the opposite: it appends
#               /chat/completions, so its `base_url` carries the version segment itself).
#   effort      Does not apply, and declaring it is rejected with
#               `llm_config_field_not_applicable`. The Messages API expresses the same idea as a
#               thinking TOKEN BUDGET rather than as a level, so there is no `low`/`high` word
#               to pass; a level here would name a knob the transport does not have.
#   command     Does not apply either, and is rejected the same way: there is no child process
#               to wrap.
#
#   stream      Applies here exactly as it does there, and is on by default for the same reason:
#               a non-streaming completion writes nothing until the whole answer exists, so an
#               intermediary bounding the interval between upstream reads cuts it long before
#               the model is done (measured elsewhere as three `HTTP 504`s on requests of
#               613.6 s / 612.3 s / 611.8 s, while the entry's own 2400 s bound never fired). No `stream_options` counterpart is
#               needed: this API reports usage in the stream natively, input tokens in
#               `message_start` and output tokens in `message_delta`. Set `false` only for a
#               gateway that cannot speak server-sent events.
#
#   api_key_env The NAME of the environment variable holding the key, never the key. A
#               configuration file is read, copied and diffed; a key in it is a key leaked.
#   model       Required, and an exact slug: an HTTP endpoint has no alias to resolve at runtime
#               the way `claude --model opus` does.
defaults:
  provider: claude_cli
  model: opus
  effort: medium

phases:
  compile:
    substeps:
      # PURE: the IR producer. The host inlines the controlled spec, the tests, the dependency
      # declaration and the phase contract; the leaf returns one JSON document holding the IR.
      # The inlined context is a BOUND, not a constant: most of it is
      # `docs/workflow/phases/phase_01_compile.md` in full (so it moves whenever that document
      # is edited) and the reviewer's also carries the IR under review (so it moves per node and
      # per attempt). Measured on `problem/shallow_water2d@0.4.0` with that document at
      # 63,222 B: 127,273 bytes for this leaf across all 7 IR directories on disk, and 150,912
      # to 171,200 for the reviewer below. This endpoint's window accommodates it; a 32k-token
      # one does not.
      generate:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-opus-5
        # Sizes the ARTIFACT, over a NAMED population: the 7 `shallow_water2d` IRs under the
        # live `workspace/` run 42,721 to 63,009 bytes of YAML (widen the scope to the
        # archived `workspace_2026*/` snapshots and it is 25 from 20,850; the MAXIMUM is
        # 63,009 either way). The JSON document carrying one is larger again. 32768 is a
        # BOUND taken from that population, not a requirement — re-measure against the node
        # you run.
        max_output_tokens: 32768
        timeout_s: 2400
      # PURE: the IR reviewer. Returns the same verdict document the generate reviewer does.
      verify:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-sonnet-5
        max_output_tokens: 16384
        timeout_s: 1800

  generate:
    substeps:
      # PURE: the CodegenBundle producer. One typed document in, one JSON document out.
      generate:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-opus-5
        max_output_tokens: 32768
      # PURE: the verdict reviewer over the bundle above.
      verify:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-opus-5
        max_output_tokens: 16384

  validate:
    substeps:
      # PURE since Z3: the independent semantic check, and the last leaf of the run. Its
      # context is the largest of the five in artifact terms and the most VARIABLE: the run's
      # own documents plus the raw-evidence excerpt, which grows with (test x case x variable).
      # Measured on `problem/shallow_water2d@0.4.0`'s recorded `run_20260802_001`, the excerpt
      # alone is 52,001 bytes (from 13,019,745 bytes of `raw/`) and the whole context is about
      # 150 KB. Re-measure rather than trusting that — build a `Conductor` and sum
      # `len(v.encode()) for v in c._build_pure_judge_context(refs).values()`.
      judge:
        provider: anthropic_api
        api_key_env: ANTHROPIC_API_KEY
        model: claude-opus-5
        # The artifact is a decision and a findings array, so this is headroom rather than a
        # size: half the bundle writer's budget, as the verify leaves take.
        max_output_tokens: 16384
