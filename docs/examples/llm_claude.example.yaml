# Sample leaf-LLM configuration: every LLM leaf on the Claude Code CLI.
#
# This is the sample to copy to `./llm.yaml` — the operator-owned file `run_workflow.py` loads
# when nobody passes `--llm-config`:
#
#     cp docs/examples/llm_claude.example.yaml llm.yaml
#
# `tools/tests/test_llm_config.py` asserts it loads and `tools/tests/test_workflow_conductor.py`
# asserts the leaf argv it produces, so it cannot drift silently the way an untested YAML file in
# this repository has before.
#
# EVERY phase, substep, provider, model and effort is written out. The substep entries are
# REQUIRED: each states its own bounds (`lineage_timeout_s`, and `max_wrapper_calls` on a
# producing substep), which no level inherits, so a substep left out is refused at load
# (`llm_config_workshop_bound_missing`). Provider, model and effort would inherit from
# `defaults`; they are written out anyway because the file is the answer to "what runs where,
# and how hard does it think" — a reader should get that answer by reading it, not by
# re-deriving it from an inheritance chain.
#
# The five entries below are the complete set of LLM leaves. Every other substep
# (compile.static, generate.gate, validate.pre_judge / execute / post_judge, and the whole
# build phase) is deterministic and runs in-process, so naming one here is rejected.
#
#   model    An unpinned ALIAS, never a pinned version: versions move, and the exact version
#            that ran is recovered afterwards from the leaf's own CLI result envelope and
#            recorded on its `agent_runs` row. Because this file DECLARES it, it is passed as
#            `claude --model opus`. Delete the `model:` lines and no `--model` is passed,
#            which hands the choice to the CLI's own default (admin-managed settings
#            aside). Every leaf launches with `--restricted`, so the operator's own
#            `~/.claude/settings.json` takes no part: neither its `model` key nor an `env`
#            block remap of an alias such as `opus` reaches the leaf (issue #453).
#   effort   `low` | `medium` | `high` | `xhigh` | `max`, passed as `claude --effort`.
#            Delete the lines and no `--effort` is passed; the CLI's own default then decides.
#
# WHY `medium`. It is what the current model generation is built around: it is this CLI's own
# default, and Codex ships the same default for every gpt-5.6 model while its PREDECESSOR
# gpt-5.5 defaulted to `xhigh` — the vendor lowered the default as the model got better. A
# sample should not override that without evidence about the model it will actually run on.
#
# The measurements below are NOT that evidence, and it is worth being exact about why. They come
# from the 94 recorded orchestrations that still have transcripts (`skills/workflow-timing-audit/`),
# and those ran almost entirely on Opus 4.8: of the leaves that record a model, ~1250 are 4.8 and
# 31 are Opus 5. A re-run rate is a property of the (model, effort, task) triple, so the table
# says what 4.8 needed at its settings, not what 5 needs. Re-measure on the current model before
# tuning any of these values again.
#
#     leaf                 tokens   re-run   attempts seen
#     generate.generate     45.3%    30.2%   1..7   (only 39 of 87 nodes passed first try)
#     compile.generate      26.7%    14.8%   1..3
#     generate.verify       11.3%    21.8%   1..5
#     compile.verify         8.3%     3.3%   1..2   (90 of 93 nodes passed first try)
#     validate.judge         8.2%     0.0%   1      (69 of 69)
#
# What the table DOES establish is structural and survives a model change: re-runs were 20% of
# every token spent, they concentrated in the leaves that WRITE, and `generate.generate` reached
# 7 attempts against a `MAX_ATTEMPTS_PER_PHASE` of 3. Crossing that cap does not cost one more
# attempt — it fails the phase and re-runs the node. So the cheapest setting per attempt is not
# the cheapest expected bill, and the leaves that write are the LAST to economise on any model.
# That is why the one economy below is a model tier on a single leaf, not a lower effort on the
# expensive ones.
#
# `compile.verify` is where it goes: the smallest leaf, re-run in 3 of 93 nodes, reading an IR
# the deterministic `compile.static` gate has already proved clean — and both `generate` and
# `validate.judge` read that same IR afterwards. `validate.judge` is NOT economised despite being
# equally small and never re-run once in 69 nodes: nothing runs after it, so what it misses ships.
#
# Raising `generate.generate` above `medium` is the obvious next question and is deliberately
# left open. Each notch costs on every attempt, so it only pays if it lifts the first-try rate,
# and that has never been measured on this model. Run the A/B rather than reasoning from the 4.8
# table — reasoning from it is the mistake this comment exists to prevent.
#
# To move one leaf elsewhere, replace its block. HTTP providers (`openai_compatible`,
# `anthropic_api`) are admissible on every LLM leaf, through the host's tool-use loop.
# `llm_openai_compatible.example.yaml` and `llm_anthropic_api.example.yaml` in this directory
# are worked examples of each.
#
# `capabilities:` narrows what a provider may be used for. The key is RESTRICT-ONLY — it may
# name a subset of what the provider has (`claude_cli`: warm_resume, workshop) and never more,
# or the load is refused with `llm_config_capability_exceeds_provider`. Every LLM leaf is a
# WORKSHOP leaf (issue #534), so an entry narrowed away from `workshop` can run nothing and is
# refused with `llm_config_capability_insufficient_for_substep`. No sample sets the key.
#
# A workshop leaf works in a host-seeded tree. The two producing substeps, `compile.generate`
# and `generate.generate`, edit that tree: `generate.generate` asks the host to derive, compile,
# lint, syntax-check and run its bundle; `compile.generate` writes the WHOLE IR in its tree and
# asks the host to check it the way `Compile.static` will. Their entries state both bounds,
# `max_wrapper_calls` (wrapper calls per lineage: its cold launch and resumes) and
# `lineage_timeout_s` (seconds per lineage, from its cold launch). The three judging substeps,
# `compile.verify`, `generate.verify` and `validate.judge`, read the documents seeded in their
# tree and write their one verdict document there; they are served no host operation, so they
# state `lineage_timeout_s` alone and `max_wrapper_calls` is refused on them. The bounds have
# no default and are written on the substep only: no level inherits one.
#
# A bound that runs out ends the lineage with its tree as it stands. A repair, a transient
# retry and a usage-limit wait each start a fresh lineage with fresh counters, so one substep
# run may open up to 8 lineages (1 + 2 repair turns + 2 transient retries + 3 usage waits; 5
# without --wait-usage-reset): up to max_wrapper_calls x 8 calls and lineage_timeout_s x 8
# seconds, and more across an outer reopen. The leaf runs in a private config home under
# its lineage home, over which `~/.claude/.credentials.json` is bound, so that file must exist
# (`docs/ORCHESTRATION.md` §workshop leaf; `docs/RUNBOOK.md` §0-2).
defaults:
  provider: claude_cli
  model: opus
  effort: medium
  # `defaults` also serves the `escalate` diagnostician, a READING workshop leaf: this bounds
  # its lineage (required; no substep entry inherits it).
  lineage_timeout_s: 2700

phases:
  compile:
    substeps:
      # The IR producer. The host seeds the controlled spec, the tests, the dependency
      # declaration and the phase contract into its tree; the leaf writes the whole IR there as
      # `spec.ir.yaml` (or `compile_fail.json` to declare an input defect) and checks it with
      # `check_ir`. The hardest structured task in the run, 26.7% of all tokens on the agentic
      # measurement above, and every later leaf reads what it wrote.
      generate:
        provider: claude_cli
        model: opus
        effort: medium
        max_wrapper_calls: 30      # wrapper calls per lineage (its cold launch + resumes)
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch
      # The IR reviewer. Semantic cross-reference (V1/V3/V5) over a deterministically-clean IR
      # seeded in its tree, written as one verdict document, `verdict.json`. The cheapest leaf
      # to be wrong in: 3 of 93 nodes re-ran it, and both `generate` and `validate.judge` read
      # the same IR afterwards. The only leaf this file economises, and it does so by model tier —
      # effort stays at the generation default here as everywhere else.
      verify:
        provider: claude_cli
        model: sonnet
        effort: medium
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch

  generate:
    substeps:
      # The CodegenBundle producer: writes the bundle's files and `bundle.yaml` in its tree and
      # builds, lints and runs them through the host's operations. 45.3% of all tokens and the
      # only leaf that routinely re-runs (30.2% of its spend is re-runs, tail to 7 attempts).
      # The last leaf to economise.
      generate:
        provider: claude_cli
        model: opus
        effort: medium
        max_wrapper_calls: 30      # wrapper calls per lineage (its cold launch + resumes)
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch
      # The verdict reviewer: reads the bundle seeded in its tree and writes `verdict.json`.
      # Reached only on a source the deterministic gate already accepted — but it re-ran in 12
      # of 80 nodes, and a wrong rejection re-runs the 45% leaf above.
      verify:
        provider: claude_cli
        model: opus
        effort: medium
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch

  validate:
    substeps:
      # The independent semantic check: reads the run's documents seeded in its tree and writes
      # `review.json`. Never re-run in 69 of 69 nodes, so its cost is perfectly predictable —
      # and still not economised, because nothing runs after it to catch a miss.
      judge:
        provider: claude_cli
        model: opus
        effort: medium
        lineage_timeout_s: 2700    # seconds per lineage, from its cold launch
