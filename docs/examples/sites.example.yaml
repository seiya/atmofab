# Execution sites: where Validate.execute runs each target's binary (docs/ORCHESTRATION.md
# §Execution sites). Copy to ./sites.yaml and edit; that file is machine-local and gitignored.
# Without ./sites.yaml every target runs at the `local` site. The driver reads it once per run,
# and probes a remote site before anything is billed — for a `--with-deps` run, before each
# dependency member, which is driven to Validate whatever phase the run stops at.
#
# The host names and paths below are placeholders. Authentication and port are ssh's own
# configuration, not this file's: a site names one ssh destination ([user@]name) and nothing
# else about it; a destination with a port or an IPv6 address is an alias in ssh's config.
sites_version: 1
sites:
  cpu_box:                          # site id: a lowercase token
    host: cpu-box                   # ssh destination [user@]name; no ':', '/', or spaces
    workdir: /scratch/atmofab-jobs  # absolute remote path, no ':'; each job is created and removed beneath it
    executes: [cpu]                 # the hardware classes this site runs
    scheduler: none                 # the job script runs in the foreground over ssh
  gpu_box:
    host: gpu-box
    workdir: /scratch/atmofab-jobs
    executes: [gpu]
    scheduler: none
  cluster:                          # a site whose jobs run through a batch scheduler
    host: login-node                # the machine the job is asked for from
    workdir: /work/atmofab-jobs     # must be visible at this path from the machines jobs run on
    executes: [cpu, gpu]
    scheduler: slurm                # docs/backends/scheduler/slurm/JOB_SUBMIT.md
    scheduler_directives: ["--partition=gpu", "--gres=gpu:1"]  # passed to the scheduler as written
    queue_timeout_sec: 7200         # the longest wait for an allocation; default 3600
  local:                            # optional; `executes` is the only key it takes
    executes: [cpu]
targets:                            # target id -> site id; a target not listed runs at `local`
  fortran_cpu: local                # write `cpu_box` here to run this target's binary there
# A site is not part of any derivation key, so re-mapping a target does not re-run a Validate
# already certified for it: add `--rederive validate` to run it at the new site (for the target
# node only; a --with-deps member is re-run by its own invocation).
