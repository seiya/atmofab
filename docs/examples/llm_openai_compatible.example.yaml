# Sample leaf-LLM configuration: the two `generate` leaves on a local OpenAI-compatible server,
# everything else on the Claude Code CLI.
#
# Copy it to `./llm.yaml` — the operator-owned file `run_workflow.py` loads when nobody passes
# `--llm-config`:
#
#     cp docs/examples/llm_openai_compatible.example.yaml llm.yaml
#
# WHY ONLY THOSE TWO. `openai_compatible` is one request and one response: no session to reopen,
# no tools to grant, and no agentic loop. `generate.generate` and `generate.verify` are the only
# LLM leaves that can run as host-mediated PURE functions (one typed document in, one JSON
# document out), so they are the only ones an HTTP provider is admissible on. Assigning one to
# `compile.generate`, `compile.verify` or `validate.judge` is rejected at load with
# `llm_config_capability_insufficient_for_substep`, and so is putting one in `defaults` (which
# also runs the `escalate` diagnostician) — that one is `llm_config_defaults_not_agentic`.
#
# The pure path is additionally gated on the node's M3c shape at run time, so a pure-only
# provider reaching a non-M3c node fails that node closed rather than silently launching an
# agentic session on it.
#
# EVERY phase, substep and provider is written out, even though the resolution rules would let
# the unmentioned leaves inherit `defaults`. The file is the answer to "what runs where" — a
# reader should get that answer by reading it, not by re-deriving it from an inheritance chain.
#
#   base_url         MUST carry the API version segment: the request appends /chat/completions.
#                    (`anthropic_api` is the opposite — it appends /v1/messages, so give that one
#                    a bare host, or omit `base_url` entirely and take its default.)
#                    Plain `http` is accepted only for a LOOPBACK host, which is where the local
#                    servers this provider exists for run. Anything else would send the API key
#                    in cleartext and is rejected with `llm_config_insecure_base_url` unless
#                    `METDSL_ALLOW_INSECURE_LLM_BASE_URL=1` accepts that deliberately.
#   api_key_env      The NAME of the environment variable holding the key, never the key. A
#                    configuration file is read, copied and diffed; a key in it is a key leaked.
#   model            Required, and an exact slug: an HTTP endpoint has no alias to resolve at
#                    runtime the way `claude --model opus` does.
#   effort           `minimal` | `low` | `medium` | `high` — the OpenAI API's `reasoning_effort`
#                    vocabulary, which is NOT the Codex CLI's (that one has `ultra` and no
#                    `minimal`). Sent in the request body; delete the line to send nothing.
#   max_output_tokens  Size it against the model's CONTEXT WINDOW, not its documented maximum:
#                    the whole completion has to fit alongside the prompt, and streaming the
#                    answer does not change that. The default (32768) is sized for a
#                    CodegenBundle.
#                    NECESSARY AND NOT SUFFICIENT for an endpoint that streams
#                    `reasoning_content`: there this field is a COMBINED reasoning+answer
#                    budget, and the reasoning is the dominant VARIABLE term (measured 2.4x
#                    across three attempts of one closure on one model at one ceiling). Two
#                    consequences worth knowing BEFORE the first run: a ceiling below the
#                    model's reasoning FLOOR yields a zero-character answer with
#                    `finish_reason: length`, not a short answer — measured 5 runs of 5 — and
#                    the floor is model-specific, so a value cannot be carried from one entry
#                    to another. `docs/ORCHESTRATION.md` "Leaf LLM configuration" is canonical
#                    for the sizing rule and the measurements. It also records that `effort`
#                    did not move the reasoning volume on the one endpoint measured — on a
#                    CENSORED probe, where only the ORDER of the three levels is evidence, so
#                    read it as "do not spend a run tuning this before re-measuring", not as
#                    "the field does nothing". The entries below still set it, for an endpoint
#                    that honours it.
#   timeout_s        Client-side WALL-CLOCK bound on the whole request, default 900. It is not
#                    bounded from above by the conductor's per-leaf process cap, which applies
#                    to a CLI leaf and not to an HTTP request. MOVE IT WITH
#                    `max_output_tokens`: raising the ceiling alone converts a truncation into
#                    a timeout. Size it on the endpoint's LOADED throughput, not its idle one
#                    — one measured endpoint halved within a single evening. Canonical, with
#                    the arithmetic: `docs/ORCHESTRATION.md` "Leaf LLM configuration".
#   stream           `true` (the default) | `false`. On by default, and the default is the point:
#                    a non-streaming completion means the endpoint writes nothing until the whole
#                    answer exists, so anything in front of it that bounds the interval between
#                    upstream reads cuts the connection long before the model is done. Measured
#                    against one nginx-fronted endpoint, three `generate.generate` requests ran
#                    613.6 s / 612.3 s / 611.8 s and each died with `HTTP 504 Gateway Time-out`
#                    while `timeout_s: 2400` never fired. Under two seconds apart over three
#                    attempts is the signature: that timer belongs to the gateway, not to us. A
#                    frame every few hundred milliseconds resets it.
#                    Set `false` only for an endpoint that cannot speak server-sent events; it
#                    restores byte-identical pre-streaming requests. RESIDUAL RISK on this
#                    provider: a streaming request also carries
#                    `stream_options: {include_usage: true}`, without which an OpenAI-dialect
#                    stream reports no token usage at all and the per-leaf cost comparison below
#                    has nothing to read. A server strict about unknown body keys answers 400 —
#                    tagged `llm_client_error`, so it fails closed on the FIRST attempt, names
#                    `stream_options` in the persisted response body, and costs no tokens. That
#                    is the signal to set `stream: false` here.
#
# `command` does not apply here and declaring it is rejected: there is no child process to wrap.
defaults:
  provider: claude_cli
  model: opus
  effort: medium

phases:
  compile:
    substeps:
      # Agentic: authors spec.ir.yaml from the controlled spec, holding a workspace and tools.
      generate:
        provider: claude_cli
        model: opus
        effort: medium
      # Agentic: semantic cross-reference (V1/V3/V5) over a deterministically-clean IR.
      verify:
        provider: claude_cli
        model: sonnet
        effort: medium

  generate:
    substeps:
      # PURE: the CodegenBundle producer. One typed document in, one JSON document out.
      generate:
        provider: openai_compatible
        base_url: http://localhost:8000/v1
        api_key_env: LOCAL_LLM_API_KEY
        model: qwen2.5-coder-32b-instruct
        effort: medium
        # 32768 sizes the ARTIFACT, and that is the whole budget only because the model named
        # here does not stream `reasoning_content`. A PROBE against a reasoning model at this
        # same 32768 spent all of it on reasoning and emitted a zero-character bundle on every
        # effort level; SEPARATELY, a production closure on that model ended at 98304. Two
        # different measurements, kept apart on purpose — `docs/ORCHESTRATION.md` is canonical
        # for which is which. Re-size against the model you run.
        max_output_tokens: 32768
        # Declared rather than defaulted, because the glossary above says the pair moves
        # together and a sample that omits one models neither half. The value is deliberately
        # GENEROUS, not derived: this sample's endpoint has not been measured, and the rates
        # `docs/ORCHESTRATION.md` records belong to another endpoint and another model, which
        # the same document says cannot be carried across. What the arithmetic does settle is
        # what the DEFAULT would demand, next to what was measured elsewhere; the comparison is
        # left to the reader, because summarising a spread of rates in a sentence is how the
        # two previous versions of this comment came to be wrong. 32768 inside 900 s needs
        # 36.4 tok/s sustained. The rates in `docs/ORCHESTRATION.md`, on another endpoint and
        # another model, are 17.6 to 59.8 tok/s. 2400 asks 13.7 tok/s. Re-measure your own.
        timeout_s: 2400
      # PURE: the verdict reviewer over the bundle above.
      verify:
        provider: openai_compatible
        base_url: http://localhost:8000/v1
        api_key_env: LOCAL_LLM_API_KEY
        model: qwen2.5-coder-32b-instruct
        effort: medium
        # Half the writer's budget, because a verdict is not a bundle. CORRECT FOR THE MODEL
        # THIS SAMPLE NAMES and for no other: on a reasoning model 16384 sat below the
        # measured reasoning floor and returned a zero-character verdict on five attempts of
        # five, and the run that hit it ended at 32768. Re-size against the model, never by
        # inheritance. `docs/ORCHESTRATION.md` carries the measurement.
        max_output_tokens: 16384
        # 16384 inside the 900 s default would demand 18.2 tok/s, which lands INSIDE the
        # 17.6-19.8 loaded band `docs/ORCHESTRATION.md` records — i.e. the default is a
        # coin toss there rather than a margin. 1200 asks 13.7 tok/s, as the writer does.
        timeout_s: 1200

  validate:
    substeps:
      # Agentic: the independent semantic check, and the last leaf of the run.
      judge:
        provider: claude_cli
        model: opus
        effort: medium
