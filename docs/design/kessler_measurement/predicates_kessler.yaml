# The judgments of the Kessler node's tests.md §6, transcribed by hand into the primary-predicate
# grammar. A measurement input, not an IR: `Compile.generate` authors its own.
bind_sets:
  mask:
    idx: floor(c)
    interior: min(1, max(0, idx - (inputs.grid.ks - 2))) * min(1, max(0, inputs.grid.ke - idx))
    halo: 1 - interior
    first: max(0, 1 - abs(idx - (inputs.grid.ks - 1)))
  const:
    rvap: inputs.constants.rvap
    cpvap: inputs.constants.cpvap
    cl: inputs.constants.cl
    lhv0: inputs.constants.lhv0
    psat0: inputs.constants.psat0
    tem00: inputs.constants.tem00
    dwatr: inputs.constants.dwatr
    cvv: cpvap - rvap
    L00: lhv0 - (cpvap - cl) * tem00
  diffs:
    dv: final.qv - initial.qv
    dc: final.qc - initial.qc
    dr: final.qr - initial.qr
  rates:
    qs: psat0 * exp(log(initial.temp / tem00) * (cpvap - cl) / rvap + L00 / rvap * (1 / tem00 - 1 / initial.temp)) / (initial.dens * rvap * initial.temp)
    dq_auto: 1e-3 * max(initial.qc - 1e-3, 0)
    dq_accr: 2.2 * initial.qc * initial.qr ** 0.875
    sliq: initial.qv / max(qs, inputs.constants.eps)
    pq: initial.pres * qs
    dq_evap: (1 - min(sliq, 1)) * (1.6 + 124.9 * (initial.dens * initial.qr) ** 0.2046) * (initial.dens * initial.qr) ** 0.525 * pq / (initial.dens * (5.4e5 * pq + 2.55e8))
  qs_final:
    qs_final: psat0 * exp(log(final.temp / tem00) * (cpvap - cl) / rvap + L00 / rvap * (1 / tem00 - 1 / final.temp)) / (final.dens * rvap * final.temp)
    dqs_final: qs_final / final.temp * ((lhv0 + (cpvap - cl) * (final.temp - tem00)) / (rvap * final.temp) - 1)
all_adj: &alladj [l0_dry_column, l0_autoconv_below, l0_autoconv_above, l0_accretion, l0_evaporation, l0_cloud_evaporates, l0_supersaturated, l0_eps_floor, l0_limiter_qr, l0_limiter_qc, l0_limiter_qv]
conserving: &cons [l0_dry_column, l0_autoconv_below, l0_autoconv_above, l0_accretion, l0_evaporation, l0_cloud_evaporates, l0_supersaturated, l0_limiter_qr, l0_limiter_qc]
tv: &tv [l0_tv_formula, l0_tv_refstate, l0_tv_zerosw]
predicates:
- &dry {test_id: l0_dry_column_noop_pass, quantity: dqv, target_cases: [l0_dry_column], binds: [mask], expr: 'maxabs(final.qv - initial.qv)', op: eq, value: 0.0}
- {<<: *dry, quantity: dqc, expr: 'maxabs(final.qc - initial.qc)'}
- {<<: *dry, quantity: dqr, expr: 'maxabs(final.qr - initial.qr)'}
- {<<: *dry, quantity: dcp, expr: 'maxabs(final.cptot - initial.cptot)'}
- {<<: *dry, quantity: dcv, expr: 'maxabs(final.cvtot - initial.cvtot)'}
- {<<: *dry, quantity: rhoe_t, expr: 'maxabs(interior * final.rhoe_t)'}
- {<<: *dry, quantity: evaporate, expr: 'maxabs(interior * final.evaporate)'}
- {<<: *dry, quantity: pcsat, expr: 'maxabs(interior * final.pcsat)'}
- {<<: *dry, quantity: dtemp, expr: 'maxabs(final.temp - initial.temp)', op: le, value: 2.0e-13}
- {<<: *dry, quantity: guard_pass, expr: 'final.guard_pass', value: 1.0}

- &auto {test_id: l0_autoconversion_threshold_pass, quantity: below_dqc, target_cases: [l0_autoconv_below], binds: [mask, diffs], expr: 'maxabs(interior * dc)', op: le, value: 3.0e-16}
- {<<: *auto, quantity: below_dqr, expr: 'maxabs(final.qr - initial.qr)', op: eq, value: 0.0}
- &above {test_id: l0_autoconversion_threshold_pass, quantity: above_dqc_rel, target_cases: [l0_autoconv_above], binds: [mask, diffs], bind: {ref: '1e-3 * (initial.qc - 1e-3) * inputs.dt'}, expr: 'maxabs(interior * (dc + ref)) / maxabs(interior * ref)', op: le, value: 1.0e-10}
- {<<: *above, quantity: above_dqr_rel, expr: 'maxabs(interior * (dr - ref)) / maxabs(interior * ref)'}
- &auto2 {test_id: l0_autoconversion_threshold_pass, quantity: dqv, target_cases: [l0_autoconv_below, l0_autoconv_above], binds: [mask, diffs], expr: 'maxabs(interior * dv)', op: le, value: 3.0e-16}
- {<<: *auto2, quantity: dtemp, expr: 'maxabs(final.temp - initial.temp)', op: le, value: 2.0e-13}
- {<<: *auto2, quantity: guard_pass, expr: 'final.guard_pass', op: eq, value: 1.0}

- &acc {test_id: l0_accretion_pass, quantity: dqc_rel, target_cases: [l0_accretion], binds: [mask, const, diffs, rates], bind: {ref: '(dq_auto + dq_accr) * inputs.dt'}, expr: 'maxabs(interior * (dc + ref)) / maxabs(interior * ref)', op: le, value: 1.0e-10}
- {<<: *acc, quantity: dqr_rel, expr: 'maxabs(interior * (dr - ref)) / maxabs(interior * ref)'}
- {<<: *acc, quantity: guard_pass, expr: 'final.guard_pass', op: eq, value: 1.0}

- &ev {test_id: l0_evaporation_pass, quantity: dqr_rel, target_cases: [l0_evaporation], binds: [mask, const, diffs, rates], bind: {ref: 'dq_evap * inputs.dt'}, expr: 'maxabs(interior * (dr + ref)) / maxabs(interior * ref)', op: le, value: 1.0e-12}
- {<<: *ev, quantity: dqv_rel, expr: 'maxabs(interior * (dv - ref)) / maxabs(interior * ref)'}
- {<<: *ev, quantity: qc_zero, expr: 'maxabs(interior * final.qc)', op: eq, value: 0.0}
- {<<: *ev, quantity: dtemp, expr: 'maxabs(interior * (final.temp - initial.temp + dv * (L00 + initial.temp * (cvv - cl)) / final.cvtot))', op: le, value: 2.0e-13}
- {<<: *ev, quantity: guard_pass, expr: 'final.guard_pass', op: eq, value: 1.0}

- &eps {test_id: l0_eps_floor_pass, quantity: dqv_rel, target_cases: [l0_eps_floor], binds: [mask, const, diffs, rates], bind: {ref: 'dq_evap * inputs.dt'}, expr: 'maxabs(interior * (dv - ref)) / maxabs(interior * ref)', op: le, value: 1.0e-12}
- {<<: *eps, quantity: guard_pass, expr: 'final.guard_pass', op: eq, value: 1.0}

- &we {test_id: l0_total_water_and_energy_pass, quantity: total_water, target_cases: *cons, binds: [mask, const, diffs, qs_final], expr: 'maxabs(interior * (dv + dc + dr))', op: le, value: 1.0e-15}
- {<<: *we, quantity: energy_ratio, bind: {em: 'final.temp * final.cvtot + final.qv * L00', em0: 'initial.temp * initial.cvtot + initial.qv * L00'}, expr: 'max(interior * abs(em - em0) / (2e-6 * dqs_final * (L00 + final.temp * (cvv - cl))))', op: le, value: 1.0}
- {<<: *we, quantity: rhoe_t_rel, expr: 'maxabs(interior * (final.rhoe_t * inputs.dt + final.dens * L00 * dv)) / max(maxabs(interior * final.dens * L00 * dv), 10)', op: le, value: 1.0e-12}
- {<<: *we, quantity: guard_pass, expr: 'final.guard_pass', op: eq, value: 1.0}

- {test_id: l0_limiter_positivity_pass, quantity: qr_clipped, target_cases: [l0_limiter_qr], binds: [mask], expr: 'maxabs(interior * final.qr)', op: le, value: 1.0e-17}
- {test_id: l0_limiter_positivity_pass, quantity: qc_clipped, target_cases: [l0_limiter_qc], binds: [mask], expr: 'maxabs(interior * final.qc)', op: eq, value: 0.0}
- {test_id: l0_limiter_positivity_pass, quantity: qv_clipped, target_cases: [l0_limiter_qv], binds: [mask], expr: 'maxabs(interior * final.qv)', op: le, value: 1.0e-17}
- &lim {test_id: l0_limiter_positivity_pass, quantity: qv_min, target_cases: [l0_limiter_qr, l0_limiter_qc, l0_limiter_qv], binds: [mask], expr: 'min(interior * final.qv)', op: ge, value: -1.0e-17}
- {<<: *lim, quantity: qc_min, expr: 'min(interior * final.qc)'}
- {<<: *lim, quantity: qr_min, expr: 'min(interior * final.qr)'}
- {<<: *lim, quantity: guard_pass, expr: 'final.guard_pass', op: eq, value: 1.0}

- &sat {test_id: l0_supersaturated_saturates_pass, quantity: qv_ratio, target_cases: [l0_supersaturated], binds: [mask, const, qs_final], expr: 'max(interior * abs(final.qv - qs_final) / (2e-6 * dqs_final))', op: le, value: 1.0}
- {<<: *sat, quantity: qc_positive, expr: 'min(interior * final.qc + halo)', op: gt, value: 0.0}
- {<<: *sat, quantity: guard_pass, expr: 'final.guard_pass', op: eq, value: 1.0}

- &num {test_id: l0_evaporate_number_pass, quantity: evaporate_rel, target_cases: [l0_cloud_evaporates, l0_supersaturated], binds: [mask, const], bind: {ref: 'max(-final.pcsat, 0) * final.dens / (4 / 3 * pi * dwatr * (8e-6) ** 3)'}, expr: 'maxabs(interior * (final.evaporate - ref)) / max(maxabs(interior * ref), 1)', op: le, value: 1.0e-12}
- {<<: *num, quantity: pcsat_rel, bind: {star: 'initial.qc - 1e-3 * max(initial.qc - 1e-3, 0) * inputs.dt'}, expr: 'maxabs(interior * (final.pcsat - (final.qc - star) / inputs.dt)) / maxabs(interior * final.pcsat)'}
- {<<: *num, quantity: guard_pass, bind: {}, expr: 'final.guard_pass', op: eq, value: 1.0}
- {test_id: l0_evaporate_number_pass, quantity: evaporate_positive, target_cases: [l0_cloud_evaporates], binds: [mask], expr: 'min(interior * final.evaporate + halo)', op: gt, value: 0.0}
- {test_id: l0_evaporate_number_pass, quantity: evaporate_zero, target_cases: [l0_supersaturated], binds: [mask], expr: 'maxabs(interior * final.evaporate)', op: eq, value: 0.0}
- {test_id: l0_evaporate_number_pass, quantity: pcsat_positive, target_cases: [l0_supersaturated], binds: [mask], expr: 'min(interior * final.pcsat + halo)', op: gt, value: 0.0}

- &h {test_id: l0_adjustment_halo_untouched_pass, quantity: halo_temp, target_cases: *alladj, binds: [mask], expr: 'maxabs(halo * (final.temp - initial.temp))', op: eq, value: 0.0}
- {<<: *h, quantity: halo_qv, expr: 'maxabs(halo * (final.qv - initial.qv))'}
- {<<: *h, quantity: halo_qc, expr: 'maxabs(halo * (final.qc - initial.qc))'}
- {<<: *h, quantity: halo_qr, expr: 'maxabs(halo * (final.qr - initial.qr))'}
- {<<: *h, quantity: halo_cptot, expr: 'maxabs(halo * (final.cptot - initial.cptot))'}
- {<<: *h, quantity: halo_cvtot, expr: 'maxabs(halo * (final.cvtot - initial.cvtot))'}
- {<<: *h, quantity: halo_rhoe_t, expr: 'maxabs(halo * final.rhoe_t)'}
- {<<: *h, quantity: halo_evaporate, expr: 'maxabs(halo * final.evaporate)'}
- {<<: *h, quantity: halo_pcsat, expr: 'maxabs(halo * final.pcsat)'}
- {<<: *h, quantity: guard_pass, expr: 'final.guard_pass', value: 1.0}

- &tvf {test_id: l0_terminal_velocity_formula_pass, quantity: vterm_r_rel, target_cases: [l0_tv_formula], binds: [mask], bind: {ref: '-36.34 * (final.dens * (final.rhoq_r / final.dens)) ** 0.1364 * sum(first * final.refstate_dens) / final.refstate_dens'}, expr: 'maxabs(interior * (final.vterm_r - ref)) / maxabs(interior * ref)', op: le, value: 1.0e-12}
- {<<: *tvf, quantity: vterm_r_negative, bind: {}, expr: 'max(interior * final.vterm_r - halo)', op: lt, value: 0.0}
- {<<: *tvf, quantity: guard_pass, bind: {}, expr: 'final.guard_pass', op: eq, value: 1.0}
- &tvz {test_id: l0_terminal_velocity_zerosw_pass, quantity: vterm_r_zero, target_cases: [l0_tv_zerosw], expr: 'maxabs(final.vterm_r)', op: eq, value: 0.0}
- {<<: *tvz, quantity: guard_pass, expr: 'final.guard_pass', value: 1.0}
- &tvr {test_id: l0_terminal_velocity_refstate_scaling_pass, quantity: scaling, target_cases: [l0_tv_refstate], binds: [mask], expr: 'maxabs(interior * final.vterm_r / sum(first * final.vterm_r) - interior * sum(first * final.refstate_dens) / final.refstate_dens)', op: le, value: 1.0e-12}
- {<<: *tvr, quantity: guard_pass, expr: 'final.guard_pass', op: eq, value: 1.0}
- &tvc {test_id: l0_terminal_velocity_cloud_zero_pass, quantity: vterm_c_zero, target_cases: *tv, expr: 'maxabs(final.vterm_c)', op: eq, value: 0.0}
- {<<: *tvc, quantity: guard_pass, expr: 'final.guard_pass', value: 1.0}
- &tvh {test_id: l0_tv_halo_untouched_pass, quantity: halo_vterm_r, target_cases: *tv, binds: [mask], expr: 'maxabs(halo * final.vterm_r)', op: eq, value: 0.0}
- {<<: *tvh, quantity: guard_pass, expr: 'final.guard_pass', value: 1.0}

- {test_id: l0_dt_nonpositive_xfail, quantity: guard_pass, target_cases: [l0_dt_nonpositive], expr: 'final.guard_pass', op: eq, value: 0.0}
- {test_id: l0_negative_moisture_xfail, quantity: guard_pass, target_cases: [l0_negative_moisture], expr: 'final.guard_pass', op: eq, value: 0.0}
- {test_id: l0_cvtot_nonpositive_xfail, quantity: guard_pass, target_cases: [l0_cvtot_nonpositive], expr: 'final.guard_pass', op: eq, value: 0.0}
- {test_id: l0_dens_nonpositive_xfail, quantity: guard_pass, target_cases: [l0_dens_nonpositive], expr: 'final.guard_pass', op: eq, value: 0.0}
- {test_id: l0_bad_range_xfail, quantity: guard_pass, target_cases: [l0_bad_range], expr: 'final.guard_pass', op: eq, value: 0.0}
- {test_id: l0_nonconverged_xfail, quantity: guard_pass, target_cases: [l0_nonconverged], expr: 'final.guard_pass', op: eq, value: 0.0}
- {test_id: l0_dt_nonpositive_xfail, quantity: restored, target_cases: [l0_dt_nonpositive], expr: &restored 'maxabs(final.temp - initial.temp) + maxabs(final.qv - initial.qv) + maxabs(final.qc - initial.qc) + maxabs(final.qr - initial.qr) + maxabs(final.cptot - initial.cptot) + maxabs(final.cvtot - initial.cvtot)', op: eq, value: 0.0}
- {test_id: l0_negative_moisture_xfail, quantity: restored, target_cases: [l0_negative_moisture], expr: *restored, op: eq, value: 0.0}
- {test_id: l0_cvtot_nonpositive_xfail, quantity: restored, target_cases: [l0_cvtot_nonpositive], expr: *restored, op: eq, value: 0.0}
- {test_id: l0_dens_nonpositive_xfail, quantity: restored, target_cases: [l0_dens_nonpositive], expr: *restored, op: eq, value: 0.0}
- {test_id: l0_bad_range_xfail, quantity: restored, target_cases: [l0_bad_range], expr: *restored, op: eq, value: 0.0}
- {test_id: l0_nonconverged_xfail, quantity: restored, target_cases: [l0_nonconverged], expr: *restored, op: eq, value: 0.0}
- {test_id: l0_tv_bad_range_xfail, quantity: guard_pass, target_cases: [l0_tv_bad_range], expr: 'final.guard_pass', op: eq, value: 0.0}
- {test_id: l0_tv_dens_nonpositive_xfail, quantity: guard_pass, target_cases: [l0_tv_dens_nonpositive], expr: 'final.guard_pass', op: eq, value: 0.0}
- {test_id: l0_tv_refstate_nonpositive_xfail, quantity: guard_pass, target_cases: [l0_tv_refstate_nonpositive], expr: 'final.guard_pass', op: eq, value: 0.0}
cross_target:
- {test_id: l0_dry_column_noop_pass, target_cases: [l0_dry_column], variables: [temp, qv, qc, qr, cptot, cvtot, rhoe_t, evaporate, pcsat]}
- {test_id: l0_autoconversion_threshold_pass, target_cases: [l0_autoconv_below, l0_autoconv_above], variables: [temp, qv, qc, qr, cptot, cvtot]}
- {test_id: l0_accretion_pass, target_cases: [l0_accretion], variables: [temp, qv, qc, qr, cptot, cvtot]}
- {test_id: l0_evaporation_pass, target_cases: [l0_evaporation], variables: [temp, qv, qc, qr, cptot, cvtot, rhoe_t]}
- {test_id: l0_eps_floor_pass, target_cases: [l0_eps_floor], variables: [temp, qv, qr]}
- {test_id: l0_total_water_and_energy_pass, target_cases: *cons, variables: [qv, qc, qr]}
- {test_id: l0_limiter_positivity_pass, target_cases: [l0_limiter_qr, l0_limiter_qc, l0_limiter_qv], variables: [temp, qv, qc, qr, cptot, cvtot]}
- {test_id: l0_supersaturated_saturates_pass, target_cases: [l0_supersaturated], variables: [temp, qv, qc, cptot, cvtot, rhoe_t, pcsat]}
- {test_id: l0_evaporate_number_pass, target_cases: [l0_cloud_evaporates, l0_supersaturated], variables: [evaporate, pcsat]}
- {test_id: l0_terminal_velocity_formula_pass, target_cases: [l0_tv_formula], variables: [vterm_r]}
- {test_id: l0_terminal_velocity_zerosw_pass, target_cases: [l0_tv_zerosw], variables: [vterm_r]}
- {test_id: l0_terminal_velocity_refstate_scaling_pass, target_cases: [l0_tv_refstate], variables: [vterm_r]}
- {test_id: l0_terminal_velocity_cloud_zero_pass, target_cases: *tv, variables: [vterm_c]}
- {test_id: l0_adjustment_halo_untouched_pass, target_cases: *alladj, variables: [temp, qv, qc, qr, cptot, cvtot]}
- {test_id: l0_tv_halo_untouched_pass, target_cases: *tv, variables: [vterm_r]}
