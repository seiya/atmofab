# Target profile (issue #284, R4-a). Operator-authored data: one value per target axis, and the
# harness a node built for this target runs over. Loader and gate: tools/target_profile.py.
# Schema (declarative copy): spec/schema/targets/target_profile.schema.json.
#
# `execution.threads_per_rank` is the threads the certifying Validate run gives each rank;
# `execution.sweep.threads_per_rank` are the further counts the same binary runs with (issue
# #512). Each run is compared with the quality check's serial reference, one thread, by its check
# statuses, its verdict and its captured state (docs/workflow/phases/phase_04_validate.md §4-2).
target_profile_version: 1
target_id: fortran_cpu
hardware:
  class: cpu
  architecture: x86_64
toolchain:
  language: fortran
  standard: f2008
  build_system: make
parallel:
  backend: openmp
execution:
  threads_per_rank: 4
  sweep:
    threads_per_rank: [2, 3]
harness:
  infrastructure_id: harness_fortran_cpu
  version_constraint: ">=0.3.0 <1.0.0"
